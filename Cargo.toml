[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.96"

[workspace.dependencies]
anyhow = "1"
# The assistant's model provider. `aws-config` resolves the EC2 instance
# profile through the default credential chain — which is what lets the box
# call Bedrock with no key and no environment variable — and
# `aws-sdk-bedrockruntime` owns SigV4 signing and the binary event-stream
# framing a streaming inference arrives in. Both are specifications this repo
# would otherwise be hand-writing against.
aws-config = { version = "1", default-features = false, features = ["behavior-version-latest", "rt-tokio", "sso"] }
# Only for `ProvideCredentials`, which the composition root calls once at boot
# to find out whether this machine can reach Bedrock at all.
aws-credential-types = "1"
aws-sdk-bedrockruntime = { version = "1", default-features = false, features = ["behavior-version-latest", "rt-tokio"] }
# rustls over ring, matching the reqwest and sqlx lines below: one TLS stack and
# one crypto backend in the binary. The SDK's own default HTTPS client selects
# aws-lc-rs, which would link a second one — hence `default-features = false`
# on the two crates above and an explicitly built client at the call site.
aws-smithy-http-client = { version = "1", default-features = false, features = ["rustls-ring"] }
axum = "0.8"
# The three base64url segments of an App Store signed transaction. Already in
# the binary through rustls; named here because `features/entitlement` decodes
# a JWS itself rather than through a library that hides the encoding.
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
cuid2 = "0.1"
# Writes the 24 kHz mono WAV that `afconvert` turns into a shipped cue clip.
# A WAV header is 44 bytes and hand-writing one is a morning's work, but it is
# a morning spent on a format that has been settled since 1991.
hound = "3"
# The native gRPC metric has to observe the final trailers rather than the HTTP
# response head. `http-body` is the transport contract for that wrapper;
# `http-body-util` builds trailer-bearing bodies in its focused tests.
http-body = "1"
http-body-util = "0.1"
# The container format `favicon.ico` is, and only that: an ICO is a directory of
# images with its own header, which is a specification to implement rather than
# a morning's work, and the browsers that still ask for one are exactly the ones
# that will not forgive getting it wrong.
ico = "0.5"
# Named for one value: the level filter sqlx's `ConnectOptions` takes for its
# query logging. sqlx emits those records through `tracing` and configures them
# through `log`, and re-exports neither — so this is a name the manifest needs
# rather than a second logging facade in the binary.
log = "0.4"
# The `/metrics` exposition. The text format is a morning's work to emit by
# hand; the bucketed histogram behind a latency quantile is not, and a
# hand-rolled one is the kind of code that is quietly wrong for a year.
metrics = "0.24"
# `default-features = false` drops the crate's own HTTP listener: this binary
# already has an axum router, and a second socket serving one route would be a
# second thing to bind, firewall and reason about.
metrics-exporter-prometheus = { version = "0.18", default-features = false }
prost = "0.14"
# `google.protobuf.Timestamp` on the wire maps to `prost_types::Timestamp`, which
# the journey contract carries on every session.
prost-types = "0.14"
# Sign in with Apple's published keys — the one outbound HTTP call this crate
# makes itself, now that the assistant goes through the AWS SDK. rustls rather
# than the default native-tls, matching the TLS stack sqlx already links — one
# TLS implementation in the binary, and no OpenSSL on the build host.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
# Rasterises the committed SVGs into the two icons a browser cannot read SVG
# for. Pure Rust, so `generate:icons` needs no ImageMagick and no librsvg — this
# repository has neither, and a generator that depends on what a laptop happens
# to have installed produces a different icon per machine. It also has no media
# query support, which favicon.svg is written to exploit rather than work
# around: the light variant is what a renderer that ignores CSS sees.
resvg = "0.48"
# Encodes the watch app icon's PNG without an alpha channel, which App Store
# validation demands of an icon and tiny-skia's own writer cannot omit. The
# version resvg already compiles, so this adds a name to the manifest rather
# than a second PNG implementation to the binary.
png = "0.18"
# The ES256 check over an App Store transaction's signing input. rustls already
# links it, so this adds a name to the manifest rather than a second crypto
# implementation to the binary — the same rule the reqwest line above follows.
ring = "0.17"
serde = { version = "1", features = ["derive"] }
# Bodies for the chat-completions API, and the SSE frames its stream carries.
serde_json = "1"
sqlx = { version = "0.9", features = ["chrono", "migrate", "postgres", "runtime-tokio", "tls-rustls", "uuid"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
# The voice manifests: what each cue says, and who reads it.
toml = "1"
# `Stream` itself, plus the channel-to-stream wrapper the streaming RPC returns.
# tonic depends on it but does not re-export it.
tokio-stream = "0.1"
tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tonic-reflection = "0.14"
# Serves the gRPC-Web protocol over the same listener as gRPC. This is what the
# iOS client actually talks to — see docs/transport.md for why the Swift client
# uses gRPC-Web rather than the Connect protocol.
tonic-web = "0.14"
# Dev-only: `tower::ServiceExt::oneshot` drives a router in tests without a
# listener.
tower = { version = "0.5", features = ["util"] }
# `timeout` is for the metrics listener alone: a scrape that stalls in the
# census must give up before Prometheus does, so the failure is recorded on the
# side that caused it.
tower-http = { version = "0.7", features = ["cors", "timeout", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# Anonymous user ids. Generated on the client and only ever parsed here, so no
# generator feature is enabled — a server that could mint one would invite an
# identity the client never sees.
uuid = "1"
# The certificate chain an App Store JWS carries in its header: parses the DER,
# checks each certificate's signature against its issuer, and reads the Apple
# marker extensions. `verify` selects ring as the backend, which is the one
# already in the binary.
x509-parser = { version = "0.18", features = ["verify"] }

# What a deployment ships (`mise run deploy:api` builds it in Docker). Thin
# LTO buys most of fat LTO's inlining at a fraction of the link time, and
# stripping symbols roughly halves the binary. `panic = "abort"` is absent on
# purpose: it turns any handler panic into whole-process death, where
# unwinding loses only the offending task.
[profile.release]
lto = "thin"
strip = "symbols"

# Lints are declared once here and inherited by every crate via
# `[lints] workspace = true`. Levels, not config values — the settings these
# read live in clippy.toml.
[workspace.lints.rust]
# Nothing in this workspace has a reason to reach for `unsafe`. Denying it
# outright means the question never has to be re-litigated in review.
unsafe_code = "deny"
elided_lifetimes_in_paths = "warn"
let_underscore_drop = "warn"
trivial_numeric_casts = "warn"
unused_lifetimes = "warn"

[workspace.lints.clippy]
# `priority = -1` is load-bearing: same-priority lint entries resolve in an
# unspecified order, so without it the individual overrides below race against
# the group and may lose.
pedantic = { level = "warn", priority = -1 }

# Debugging leftovers. Denied rather than warned because there is no case where
# one of these belongs on main.
dbg_macro = "deny"
print_stderr = "warn"
print_stdout = "warn"
todo = "warn"
unimplemented = "warn"

# Panicking paths. A panic in a request handler takes out the task and returns
# no useful error to the client; the typed-error path (see
# crates/api/src/features/technique/errors.rs) is always available instead.
# clippy.toml re-allows all three inside tests.
expect_used = "warn"
panic = "warn"
unwrap_used = "warn"

# Async correctness. `await_holding_lock` is the one that actually bites: a
# std::sync guard held across an await point deadlocks the executor rather than
# failing loudly.
await_holding_lock = "warn"
significant_drop_tightening = "warn"

redundant_clone = "warn"
use_self = "warn"

# Deliberate opt-outs. Each names an idiom this codebase uses on purpose, so
# re-enabling one is a style decision rather than a cleanup ticket.
#
# `module_name_repetitions` fights the feature-first layout: within
# features/technique/, a `TechniqueError` type is the clearest available name
# even though the module is already called `technique`.
module_name_repetitions = "allow"
# `pub` in these crates means "reachable from the binary and from `tests/`", not
# "published API" — both members set `publish = false`. `#[must_use]` earns its
# keep by warning a consumer who cannot see the implementation, and there is no
# such consumer here.
must_use_candidate = "allow"
# Doc comments here explain *why*, per CLAUDE.md §1.2. Demanding a
# `# Errors` section on every fallible function produces restatement, which
# that same policy tells us to delete.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
