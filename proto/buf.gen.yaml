version: v2
inputs:
  - directory: .
# Local plugins, not `remote:` ones: executing on buf.build put an
# unauthenticated third-party quota on the critical path of every generate
# and check, and concurrent agents drained it into `resource_exhausted` for
# hours (TIM-87). Versions are pinned in `.mise.toml`, in lockstep with the
# runtimes in ios/Packages/OndCore/Package.resolved; `check:generated` catches drift.
plugins:
  # Message types and enums. `protoc-gen-swift`, from apple/swift-protobuf.
  - local: protoc-gen-swift
    out: ../ios/Packages/OndCore/Sources/OndAPI/Generated
    opt:
      - Visibility=Public

  # Service clients for the Connect runtime. `GenerateAsyncMethods` gives the
  # async/await surface; the callback-based one is dead weight in a
  # structured-concurrency codebase.
  - local: protoc-gen-connect-swift
    out: ../ios/Packages/OndCore/Sources/OndAPI/Generated
    opt:
      - Visibility=Public
      - GenerateAsyncMethods=true
      - GenerateCallbackMethods=false
