syntax = "proto3";

package ond.v1;

import "ond/v1/technique_service.proto";

// ProfileService reads and writes the answers a person gave at onboarding.
// Unlike TechniqueService, every RPC is scoped to a caller: the anonymous
// identity travels in the `ond-user-id` header, a call without one is
// UNAUTHENTICATED, and no request carries an id — so one client can never
// read another's profile by guessing a value.
service ProfileService {
  // Returns this caller's profile.
  //
  // Never NOT_FOUND: the identity layer creates the row on first sight, so a
  // caller who has answered nothing gets a profile of empty answers rather than
  // an error the client would have to special-case at every call site.
  rpc GetProfile(GetProfileRequest) returns (GetProfileResponse);

  // Replaces this caller's profile wholesale.
  //
  // A full replacement rather than a patch: onboarding submits every answer at
  // once, and a field mask would add a contract both ends must honour in
  // exchange for a partial update nothing performs.
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse);
}

// How much breathwork someone has done before.
//
// Chooses what the app explains rather than what it offers — every technique is
// available at every level. UNSPECIFIED is a real state here: a profile exists
// from the first RPC, which is before anyone has been asked.
enum ExperienceLevel {
  EXPERIENCE_LEVEL_UNSPECIFIED = 0;

  // Has not done this before.
  EXPERIENCE_LEVEL_NEW = 1;

  // Has tried it, without a routine.
  EXPERIENCE_LEVEL_OCCASIONAL = 2;

  // Practises already.
  EXPERIENCE_LEVEL_REGULAR = 3;
}

// How much the app is invited to ask for someone's attention. The zero value
// is NEVER, not UNSPECIFIED, by design: proto3 cannot tell an unset field
// from its zero value, so an absent field, an older client, and a
// partly-written row all mean whatever sits at zero — and silence has to mean
// no reminders. Notification permission is requested only once this moves off NEVER.
enum ReminderIntensity {
  REMINDER_INTENSITY_NEVER = 0;

  // An occasional nudge, and nothing that counts a missed day against you.
  REMINDER_INTENSITY_GENTLE = 1;

  // One reminder a day, at a time the client picks.
  REMINDER_INTENSITY_DAILY = 2;
}

// What someone told the app about themselves.
//
// Answers, not derived state: streaks, totals, and entitlements live elsewhere,
// so this message stays something a person can recognise as the things they
// typed.
message Profile {
  // What they are here for, in the order they picked. May be empty — a skipped
  // question, meaning exactly that rather than "all of them". Reuses
  // TechniqueGoal so a goal picked at onboarding is the same value the
  // catalogue is grouped by; a parallel enum would need mapping and would drift.
  repeated TechniqueGoal goals = 1;

  ExperienceLevel experience_level = 2;

  ReminderIntensity reminder_intensity = 3;

  // Why they are here, in their own words. Optional and free-form: M6's
  // assistant reads it as context, and nothing else parses it. Empty is the
  // normal state.
  string intent_note = 4;

  // What the leaderboards call this person, and the whole of the opt-in to
  // them: empty means invisible to everyone else, the state every profile
  // starts in. The server owns the final value — it trims, screens, and
  // suffixes a name somebody else already holds — so what comes back in
  // `UpdateProfileResponse` is what others will see, not always what was sent.
  string display_name = 5;

  // Which decade they were born in, if they said. Optional, and coarse on
  // purpose: it exists so the age-band leaderboard can compare like with like,
  // and a birth year would be a more precise fact than that use needs.
  BirthYearBand birth_year_band = 6;

  // Gender, if they said. It exists so the assistant can calibrate how it
  // reads a breath-test score — the reference ranges differ by sex — and
  // nothing else reads it.
  Gender gender = 7;

  // What to call this person, if they said; empty is the whole of "they did
  // not answer". Not `display_name` under another name: that one is a public
  // handle the server screens and suffixes, while this one is never shown to
  // anybody else — it exists for the app's own greeting — so it is neither
  // unique nor screened, and what comes back is what was sent.
  string given_name = 8;
}

// Gender, as someone chose to share it. UNSPECIFIED is the state most
// profiles hold and keep: nobody has to answer, and the server stores silence
// as NULL. A closed list without a self-describe field, on purpose — the one
// consumer is a prompt, and free text here would be a second injection
// surface bought for a single prose reader.
enum Gender {
  GENDER_UNSPECIFIED = 0;

  GENDER_FEMALE = 1;

  GENDER_MALE = 2;

  GENDER_NON_BINARY = 3;
}

// The decade somebody was born in. Bands by decade rather than by age, so a
// person's band never changes under them. UNSPECIFIED is a real state: nobody
// has to answer. The youngest band is a published claim that must agree with
// web/privacy.html and the App Store Connect questionnaire, and only a closed
// decade can hold that agreement — see docs/product/listing.md before adding one.
enum BirthYearBand {
  BIRTH_YEAR_BAND_UNSPECIFIED = 0;

  BIRTH_YEAR_BAND_BORN_BEFORE_1960 = 1;

  BIRTH_YEAR_BAND_BORN_1960S = 2;

  BIRTH_YEAR_BAND_BORN_1970S = 3;

  BIRTH_YEAR_BAND_BORN_1980S = 4;

  BIRTH_YEAR_BAND_BORN_1990S = 5;

  BIRTH_YEAR_BAND_BORN_2000S = 6;

  // BORN_2010_OR_LATER, retired and never reusable. A client still sending 7
  // is refused with INVALID_ARGUMENT rather than having its answer dropped, so
  // the retirement is visible to whoever sent it.
  reserved 7;
  reserved "BIRTH_YEAR_BAND_BORN_2010_OR_LATER";
}

message GetProfileRequest {}

message GetProfileResponse {
  Profile profile = 1;
}

message UpdateProfileRequest {
  // Required. Every field is replaced by what this carries, so an omitted
  // message is rejected rather than read as "clear everything".
  Profile profile = 1;
}

message UpdateProfileResponse {
  // The profile as stored, which is what the client should keep. Returned
  // rather than assumed so a value the server normalised — a duplicated goal,
  // say — does not leave the client displaying something the server does not
  // hold.
  Profile profile = 1;
}
