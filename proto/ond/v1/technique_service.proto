syntax = "proto3";

package ond.v1;

// TechniqueService serves the catalogue of breathing techniques.
//
// A technique is reference data: a name, the goal it serves, and the ordered
// stages a session plays. It carries no user state — what a person did with a
// technique is a separate concern, so this service stays readable without
// authentication. The same holds for the breathing foundations it also serves.
service TechniqueService {
  // Lists every technique, ordered for presentation.
  //
  // Unpaginated on purpose. The catalogue is curated and small (single digits
  // now, tens at most), so a cursor would add a round-trip contract the client
  // has to honour in exchange for nothing.
  rpc ListTechniques(ListTechniquesRequest) returns (ListTechniquesResponse);

  // Lists the breathing foundations — the questions most apps never answer
  // (belly or chest, nose or mouth, posture, eyes), as reference data rather
  // than copy baked into a client.
  //
  // Same no-auth stance and same lack of pagination as the catalogue, for the
  // same reasons.
  rpc ListFoundations(ListFoundationsRequest) returns (ListFoundationsResponse);

  // Lists the curated ways into the catalogue: the occasion entries and the
  // Start here progression.
  //
  // Both in one call because they are one answer to one question — where does
  // somebody who has not chosen a technique begin — and a client that showed
  // the occasions before the progression arrived would render half a screen.
  // Neither adds a technique: every route here resolves to a slug
  // `ListTechniques` already returned.
  //
  // Same no-auth stance as the catalogue. Nothing here is scoped to a caller:
  // a route is a suggestion the same for everybody, and which of them a person
  // has already walked is the client's own history to read.
  rpc ListRoutes(ListRoutesRequest) returns (ListRoutesResponse);
}

// The outcome a technique is chosen for. Drives how the catalogue is grouped in
// the UI, so a technique has exactly one — the primary reason to reach for it.
enum TechniqueGoal {
  TECHNIQUE_GOAL_UNSPECIFIED = 0;

  // Down-regulate in the moment: anxiety, pre-performance nerves, acute stress.
  TECHNIQUE_GOAL_CALM = 1;

  // Wind down towards sleep. Long exhales, no holds sharp enough to rouse.
  TECHNIQUE_GOAL_SLEEP = 2;

  // Raise alertness. Fast, exhale-driven, and the one category with real
  // contraindications — never practised in water or while driving.
  TECHNIQUE_GOAL_ENERGY = 3;

  // Restore parasympathetic tone after a spike. Short, and effective in one or
  // two cycles rather than over a timed session.
  TECHNIQUE_GOAL_RESET = 4;

  // Hold attention on something deliberate. Longer holds and side-to-side
  // patterns, where the counting is as much the point as the breathing.
  TECHNIQUE_GOAL_FOCUS = 5;
}

// One segment of a breathing cycle.
//
// Four values where somebody composing one picks from three. The two holds are
// one choice to the person authoring an exercise and two distinct beats to the
// person breathing it, so `DraftPhase` offers a single `hold` and the server
// derives which of these it stores from the breath before it — see the `hold`
// arm of `DraftPhase.movement`. Collapsing the pair would break every client for
// the sake of a distinction the UI needs anyway.
enum PhaseKind {
  PHASE_KIND_UNSPECIFIED = 0;

  PHASE_KIND_INHALE = 1;

  // Hold with the lungs full.
  PHASE_KIND_HOLD_IN = 2;

  PHASE_KIND_EXHALE = 3;

  // Hold with the lungs empty. Distinct from HOLD_IN because it feels
  // materially different to the practitioner and the UI cues it differently.
  PHASE_KIND_HOLD_OUT = 4;
}

// Where the air goes on its way in or out.
//
// The second half of what a phase is. Nose or mouth is the question every
// beginner asks, and which nostril is what makes alternate-nostril breathing
// that exercise rather than a 4:6:4:6 rhythm — so it is seeded data rather than
// a client-side table keyed on a slug, which is what it was until this field
// existed.
enum Passage {
  PASSAGE_UNSPECIFIED = 0;

  PASSAGE_NOSE = 1;

  PASSAGE_MOUTH = 2;

  // The nostrils are named from the practitioner's own body, not from a
  // reader's view of them: "left" is the one under their left hand.
  PASSAGE_LEFT_NOSTRIL = 3;
  PASSAGE_RIGHT_NOSTRIL = 4;
}

// How loudly a session runs.
//
// The load-bearing half of an occasion. "Through this meeting" and "after a
// hard meeting" reach for the same technique at the same pace and differ only
// here, which is what makes an occasion more than a second name for a goal.
enum DeliverySurface {
  DELIVERY_SURFACE_UNSPECIFIED = 0;

  // The session owns the screen: the figure, the counts, the haptics.
  DELIVERY_SURFACE_FULL_SCREEN = 1;

  // The session runs where nobody watching would notice it — a wrist tapping
  // out the rhythm, no animation, no sound. What a person can do while somebody
  // else is talking.
  DELIVERY_SURFACE_DISCREET = 2;
}

// Which words a session uses to say what the breath is doing.
//
// A property of the route, never of the technique, on the same terms as
// `DeliverySurface`: the same exercise is read plainly by an adult browsing the
// catalogue and playfully by a parent who arrived through "with your child". A
// register on the technique would be the second taxonomy occasions exist to
// avoid.
//
// Read differently from a surface on the client, and deliberately. An
// unrecognised surface fails the whole `ListRoutes` response — every occasion
// and the progression with it — because a route that guessed wrong could start
// something audible in a meeting, and losing the lot is the cheaper mistake. An
// unrecognised register falls back to `COPY_REGISTER_PLAIN` and keeps its route,
// because the only thing lost is a tone.
enum CopyRegister {
  COPY_REGISTER_UNSPECIFIED = 0;

  // "Breathe in", "Hold", "Breathe out" — what every route says unless it asks
  // for otherwise.
  COPY_REGISTER_PLAIN = 1;

  // The same phases named as a small child can follow them: smelling a flower,
  // blowing out a candle. Covers moving breath through the nose and nothing
  // else — a register is a way of saying the breaths an exercise has, not a
  // licence to invent copy for breaths it was never written for.
  COPY_REGISTER_PLAYFUL = 2;
}

// A single segment of the cycle, held in the order the client should play it.
message Phase {
  PhaseKind kind = 1;

  // Milliseconds, not seconds: the physiological sigh's second inhale is a
  // sub-second beat, and an integer count of seconds cannot express it.
  //
  // The curated default. Always within [min_duration_ms, max_duration_ms].
  uint32 duration_ms = 2;

  // The evidence-based range this phase may be dialled within, inclusive.
  //
  // Carried as data so that every client renders its Advanced dials from the
  // catalogue rather than hardcoding limits it would then have to keep in step
  // with the seed. A phase whose range is a single point is not adjustable —
  // an open-ended retention has no dial at all, because the person ends it.
  uint32 min_duration_ms = 3;
  uint32 max_duration_ms = 4;

  // Where the air goes, and `PASSAGE_UNSPECIFIED` exactly when `kind` is a
  // hold: air that is not moving goes nowhere.
  //
  // Unset rather than defaulted for a hold, which is also how the two write
  // paths that produce this field are shaped — a `DraftPhase` hold has no
  // passage to carry, and the column behind it is null under the same
  // condition. A client reading a hold's passage is reading a field that was
  // never answered.
  Passage passage = 5;
}

// A run of cycles sharing one phase pattern.
//
// The general case a plain cyclic technique degenerates to: box breathing is
// one stage repeated to five minutes, while a Wim Hof-style round is three stages —
// fast breaths, a retention the person ends, then a recovery hold.
message Stage {
  // The pattern, in play order. Never empty.
  repeated Phase phases = 1;

  // How many times this stage repeats its pattern before the next stage
  // begins. Always at least one.
  uint32 cycles = 2;

  // Whether the person, rather than the clock, decides when this stage is
  // over — a retention hold in a Wim Hof-style round. A client shows a "tap
  // when you're ready" affordance instead of a countdown, and its phases'
  // durations describe a typical hold rather than a scheduled one.
  bool open_ended = 3;
}

// A breathing technique and the session it describes.
message Technique {
  string id = 1;

  // Stable, human-readable key ("box-breathing"). The client pins its built-in
  // artwork and haptic patterns to this rather than to `id`, so the catalogue
  // can be reseeded without the app losing track of what it is looking at.
  string slug = 2;

  string name = 3;

  // One or two sentences: what it does and when to reach for it. Short on
  // purpose — it is what a catalogue row shows under the name, where a
  // paragraph would push the next exercise off the screen.
  string summary = 4;

  TechniqueGoal goal = 5;

  // M1's `phases` and `recommended_cycles`, replaced by the stage model in M2
  // while no client had shipped. Reserved rather than reused so a development
  // build holding the old contract fails to decode rather than misreading a
  // stage list as a phase list.
  reserved 6, 7;
  reserved "phases", "recommended_cycles";

  // The session, in play order. Never empty.
  repeated Stage stages = 8;

  // How many times a session repeats the whole stage list by default — curated
  // per technique. One for everything cyclic; three for a Wim Hof-style round,
  // where the round is the unit the protocol is counted in. Always at least
  // one. A user's own preference is a client-side override until identity
  // exists to store it against.
  uint32 recommended_rounds = 9;

  // The caution to show somebody who is already breathing this one, or empty
  // where there is nothing to say at that moment.
  //
  // Narrower than it reads. The general hazards of breathwork — fainting,
  // water, driving, stopping at lightheadedness — are consented to once in a
  // client's onboarding, so this carries only what a screen seen weeks earlier
  // does not discharge. Empty for most of the catalogue, and a client that
  // renders it while somebody is *choosing* is putting a warning back where it
  // was deliberately taken from.
  string safety_note = 10;

  // Whether breathing this one needs a subscription.
  //
  // Phrased so that `false` — the proto3 zero value, and therefore what an
  // absent field, an older server, and a truncated message all mean — is
  // *unlocked*. That direction is deliberate. A session runs entirely on the
  // device, so there is nothing to enforce here and nothing this saves: the
  // costly feature is the language model, and `EntitlementService` guards that
  // one server-side. What a decode gap could cost is a person being asked to
  // pay for something they were promised, which is worth more than the handful
  // of sessions the other direction gives away.
  //
  // The catalogue is served whole either way. A locked technique is listed,
  // described, and shown its rhythm — it is an invitation, not a hidden row.
  bool requires_subscription = 11;

  // Why this exercise works: the mechanism, in a paragraph, for the screen
  // somebody opens before they breathe it.
  //
  // Separate from `summary` because the two are read in different places and at
  // different lengths. The summary is a row's worth — a line under a name in a
  // list of eleven. This is the page's opening argument, and a list row carrying
  // it would be nine lines tall.
  //
  // Empty is a real answer and the zero value says so: handed a technique
  // nobody has written this for, the client opens the screen on the summary
  // instead. An exercise somebody composed themselves never has one — the
  // mechanism is curated reference copy, and inviting an author to assert
  // physiology is not something this app should do.
  string mechanism = 12;

  // How strong the case for this exercise actually is, in one short paragraph.
  //
  // A separate field from `mechanism` rather than a closing sentence of it,
  // because the two make different promises. `mechanism` is the confident story
  // of how an exercise works; this is what the trials found, at what size, and
  // where they found nothing — the blinded null, the pilot-grade sample, the
  // study that dosed the exercise differently from the way the app offers it.
  // Kept apart so a client can render the honest half in its own right, and so
  // it cannot be softened a clause at a time while the persuasive half is
  // polished.
  //
  // Empty is a real answer, on the same terms as `mechanism`: a client shown
  // nothing here shows nothing, and an exercise somebody composed themselves
  // never carries one — asking an author what the research says about their own
  // pattern is exactly the claim this field exists to keep honest.
  string evidence = 13;
}

// One question a beginner has, and the app's answer to it.
message FoundationTopic {
  // Stable key ("nose-or-mouth"), so a client — or M6's assistant, citing the
  // same rows — can reference a topic without pinning its wording.
  string slug = 1;

  // Phrased as the question someone actually asks, not as a heading.
  string question = 2;

  // A short answer, framed as a suggestion. Never a rule: the breathing works
  // while you are still learning.
  string answer = 3;
}

message ListTechniquesRequest {}

message ListTechniquesResponse {
  // Ordered for display, not by id — the sequence is curated so the catalogue
  // opens on the techniques a newcomer should try first.
  repeated Technique techniques = 1;
}

message ListFoundationsRequest {}

message ListFoundationsResponse {
  // Ordered for display: the questions come in the order they occur to someone
  // learning, not alphabetically.
  repeated FoundationTopic topics = 1;
}

// What an occasion resolves to: which technique, framed as what, run how, for
// how long.
//
// The route's whole destination, so a client hands one of these to a session
// rather than rebuilding the decision from an occasion's parts.
message Prescription {
  // The technique to breathe, named by the key `Technique.slug` carries. A
  // prescription never names one the catalogue does not hold — the column
  // behind it is a foreign key onto the catalogue.
  //
  // Everything else about that technique — its stages, its safety note,
  // whether it needs a subscription — is read from the catalogue entry this
  // resolves to, and is deliberately not repeated here. A client cannot play
  // an occasion without resolving the slug anyway, and a locked flag copied
  // onto the route would be a second copy of a promise free to disagree with
  // the first.
  string technique_slug = 1;

  // The goal this moment borrows, and the reason occasions are a route rather
  // than a second taxonomy: "before a presentation" *is* `CALM`, so the home
  // wheel and the coach keep speaking the five goals they already speak.
  //
  // Seeded per occasion rather than read back through `technique_slug`,
  // because the framing is the occasion's own fact: what a moment is for
  // should not move because a technique's primary grouping was re-curated.
  TechniqueGoal goal = 2;

  DeliverySurface surface = 3;

  // How long the occasion asks for, in milliseconds — a target the client fits
  // whole cycles into, not a stopwatch to cut a breath short with.
  //
  // Carried per occasion rather than taken from the technique's own cycle
  // count, because the same technique is a different offer in different
  // moments: a minute to come down from something, five to sit inside it.
  uint32 duration_ms = 4;

  // Which words the session speaks. Unset means `COPY_REGISTER_PLAIN`, which is
  // what every occasion seeded before this field existed means by saying
  // nothing.
  CopyRegister register = 5;
}

// A named moment somebody might open the app in, and where it routes.
//
// Occasions do not extend the catalogue and take nothing away from it: each is
// a shortcut onto a technique that is listed and described whether or not this
// entry exists. It is not a claim about price — a route may name a technique
// that needs a subscription, which `Technique.requires_subscription` says and
// this message does not repeat.
message Occasion {
  // Stable key ("before-a-presentation"), so a client can pin an icon or an
  // analytics event to an occasion without pinning its wording.
  string slug = 1;

  // How the moment is named to the person, in their words rather than the
  // catalogue's.
  string name = 2;

  // One sentence on what this does for them here, or empty.
  string summary = 3;

  // Where the occasion routes. Always set; a client reading
  // `DELIVERY_SURFACE_UNSPECIFIED` off the surface has read a message whose
  // prescription never arrived.
  Prescription prescription = 4;
}

// One rung of the Start here progression.
message ProgressionStep {
  // The technique this step is, named as `Technique.slug`.
  string technique_slug = 1;

  // Why this one, at this point — the sentence that makes the order a
  // progression rather than a list. Empty is allowed and means the technique's
  // own summary is enough.
  string note = 2;
}

message ListRoutesRequest {}

message ListRoutesResponse {
  // Ordered for display, in the order somebody is most likely to want them.
  repeated Occasion occasions = 1;

  // The Start here progression, in curated order.
  //
  // The first step is `progression[0]` — where somebody with no goal at all
  // begins. The next step is the first one whose technique they have not
  // breathed, which the client decides from its own session history: this list
  // is the same for everybody and holds no state.
  //
  // Suggestive, never gating: it names a few of the techniques
  // `ListTechniques` returns and changes nothing about the rest — none is
  // hidden or reordered by its absence from here, and reaching a step is never
  // a condition of breathing the one after it. What the ordering does not
  // speak to is price: a step may name a technique behind a subscription, and
  // the catalogue entry is where that is said.
  repeated ProgressionStep progression = 2;
}
