syntax = "proto3";

package ond.v1;

// TechniqueService serves the catalogue of breathing techniques. A technique
// is reference data: a name, the goal it serves, and the ordered stages a
// session plays. It carries no user state — what a person did with one is a
// separate concern — so this service stays readable without authentication,
// as do the breathing foundations it also serves.
service TechniqueService {
  // Lists every technique, ordered for presentation.
  //
  // Unpaginated on purpose. The catalogue is curated and small (single digits
  // now, tens at most), so a cursor would add a round-trip contract the client
  // has to honour in exchange for nothing.
  rpc ListTechniques(ListTechniquesRequest) returns (ListTechniquesResponse);

  // Lists the breathing foundations — the questions most apps never answer
  // (belly or chest, nose or mouth, posture, eyes), as reference data rather
  // than copy baked into a client. Same no-auth stance and same lack of
  // pagination as the catalogue, for the same reasons.
  rpc ListFoundations(ListFoundationsRequest) returns (ListFoundationsResponse);

  // Lists the curated ways into the catalogue: the occasion entries and the
  // Start here progression. One call because they are one answer to one
  // question — where somebody who has not chosen a technique begins — and
  // half of it would render half a screen. Every route resolves to a slug
  // `ListTechniques` already returned, and nothing here is scoped to a caller.
  rpc ListRoutes(ListRoutesRequest) returns (ListRoutesResponse);
}

// The outcome a technique is chosen for. Drives how the catalogue is grouped in
// the UI, so a technique has exactly one — the primary reason to reach for it.
enum TechniqueGoal {
  TECHNIQUE_GOAL_UNSPECIFIED = 0;

  // Down-regulate in the moment: anxiety, pre-performance nerves, acute stress.
  TECHNIQUE_GOAL_CALM = 1;

  // Wind down towards sleep. Long exhales, no holds sharp enough to rouse.
  TECHNIQUE_GOAL_SLEEP = 2;

  // Raise alertness. Fast, exhale-driven, and the one category with real
  // contraindications — never practised in water or while driving.
  TECHNIQUE_GOAL_ENERGY = 3;

  // Restore parasympathetic tone after a spike. Short, and effective in one or
  // two cycles rather than over a timed session.
  TECHNIQUE_GOAL_RESET = 4;

  // Hold attention on something deliberate. Longer holds and side-to-side
  // patterns, where the counting is as much the point as the breathing.
  TECHNIQUE_GOAL_FOCUS = 5;
}

// One segment of a breathing cycle. Four values where somebody composing one
// picks from three: the two holds are one choice to the author and two beats
// to the person breathing, so `DraftPhase` offers a single `hold` and the
// server derives which of these it stores from the breath before it.
// Collapsing the pair would break every client for a distinction the UI needs.
enum PhaseKind {
  PHASE_KIND_UNSPECIFIED = 0;

  PHASE_KIND_INHALE = 1;

  // Hold with the lungs full.
  PHASE_KIND_HOLD_IN = 2;

  PHASE_KIND_EXHALE = 3;

  // Hold with the lungs empty. Distinct from HOLD_IN because it feels
  // materially different to the practitioner and the UI cues it differently.
  PHASE_KIND_HOLD_OUT = 4;
}

// Where the air goes on its way in or out — the second half of what a phase
// is. Which nostril is what makes alternate-nostril breathing that exercise
// rather than a 4:6:4:6 rhythm, so it is seeded data rather than the
// client-side table keyed on a slug it used to be.
enum Passage {
  PASSAGE_UNSPECIFIED = 0;

  PASSAGE_NOSE = 1;

  PASSAGE_MOUTH = 2;

  // The nostrils are named from the practitioner's own body, not from a
  // reader's view of them: "left" is the one under their left hand.
  PASSAGE_LEFT_NOSTRIL = 3;
  PASSAGE_RIGHT_NOSTRIL = 4;
}

// How the breath is shaped, where `Passage` says where it goes. Seeded only
// where the shape is the mechanism's own claim: a new value strands every
// client that has not updated, so near-misses stay out. UNSPECIFIED is the
// ordinary answer. The alternative for a shape somebody cannot make — closed
// teeth for an unrolled tongue — lives in `preparation`; never render a case alone.
enum Manner {
  MANNER_UNSPECIFIED = 0;

  // Sitali's tube, drawn through a wet surface — the cooling breath's inhale.
  MANNER_CURLED_TONGUE = 1;

  // Lips barely parted, holding a little pressure back down the airway.
  MANNER_PURSED_LIPS = 2;

  // A steady hum for the length of the exhale, which is the whole of humming
  // breath. Not a passage: the air still leaves through the nose, and that is
  // the only way a hum works at all.
  MANNER_HUM = 3;
}

// How loudly a session runs.
//
// The load-bearing half of an occasion. "Through this meeting" and "after a
// hard meeting" reach for the same technique at the same pace and differ only
// here, which is what makes an occasion more than a second name for a goal.
enum DeliverySurface {
  DELIVERY_SURFACE_UNSPECIFIED = 0;

  // The session owns the screen: the figure, the counts, the haptics.
  DELIVERY_SURFACE_FULL_SCREEN = 1;

  // The session runs where nobody watching would notice it — a wrist tapping
  // out the rhythm, no animation, no sound. What a person can do while somebody
  // else is talking.
  DELIVERY_SURFACE_DISCREET = 2;
}

// Which words a session uses to say what the breath is doing — a property of
// the route, never of the technique, on `DeliverySurface`'s terms. Read
// differently from a surface: an unrecognised surface fails the whole
// `ListRoutes` response, because a wrong guess could start something audible
// in a meeting; an unrecognised register falls back to PLAIN and keeps its route.
enum CopyRegister {
  COPY_REGISTER_UNSPECIFIED = 0;

  // "Breathe in", "Hold", "Breathe out" — what every route says unless it asks
  // for otherwise.
  COPY_REGISTER_PLAIN = 1;

  // The same phases named as a small child can follow them: smelling a flower,
  // blowing out a candle. Covers moving breath through the nose and nothing
  // else — a register is a way of saying the breaths an exercise has, not a
  // licence to invent copy for breaths it was never written for.
  COPY_REGISTER_PLAYFUL = 2;
}

// How much the research supports what an exercise is offered for —
// `evidence`'s verdict as one word, graded against the rubric in
// docs/product/breathing-science.md. It rates the *evidence*, never the
// effect. Deliberately no "strong": the field's best-blinded trials are nulls,
// and an unawardable grade would be crept toward. Unrecognised draws nothing.
enum EvidenceGrade {
  // Nothing has been graded — which is the honest answer for an exercise
  // somebody composed themselves, exactly as `evidence` is empty for one.
  // Nobody has trialled a pattern its author wrote last Tuesday.
  EVIDENCE_GRADE_UNSPECIFIED = 0;

  // Randomised trials exist and point one way, but they are unblinded, small,
  // single-lab, or read across from a population or an outcome that is not the
  // one this exercise is offered for.
  EVIDENCE_GRADE_MODERATE = 1;

  // No trials of this pattern at all, pilot-sized work only, or the
  // best-controlled trial of it is a null.
  EVIDENCE_GRADE_LIMITED = 2;
}

// How the items following a reading lead are presented.
//
// The zero value means there is no list. A content block with items and this
// value is malformed rather than an invitation for the client to guess at a
// presentation.
enum ReadingListStyle {
  READING_LIST_STYLE_UNSPECIFIED = 0;
  READING_LIST_STYLE_BULLETS = 1;
  READING_LIST_STYLE_NUMBERED = 2;
}

// A short lead followed, where the content is genuinely list-shaped, by a
// scannable list. Kept deliberately smaller than Markdown: catalogue copy
// needs paragraphs, bullets and ordered steps, and accepting arbitrary markup
// would make every client a renderer and an editorial choice an input language.
message ReadingContent {
  string lead = 1;
  repeated string items = 2;
  ReadingListStyle list_style = 3;
}

// A single segment of the cycle, held in the order the client should play it.
message Phase {
  PhaseKind kind = 1;

  // Milliseconds, not seconds: the physiological sigh's second inhale is a
  // sub-second beat, and an integer count of seconds cannot express it.
  //
  // The curated default. Always within [min_duration_ms, max_duration_ms].
  uint32 duration_ms = 2;

  // The evidence-based range this phase may be dialled within, inclusive.
  // Carried as data so every client renders its Advanced dials from the
  // catalogue rather than hardcoding limits. A single-point range is not
  // adjustable — an open-ended retention has no dial, because the person ends it.
  uint32 min_duration_ms = 3;
  uint32 max_duration_ms = 4;

  // Where the air goes, and `PASSAGE_UNSPECIFIED` exactly when `kind` is a
  // hold: air that is not moving goes nowhere. Unset rather than defaulted for
  // a hold — a `DraftPhase` hold has no passage to carry and the column behind
  // it is null under the same condition, so a client reading a hold's passage
  // is reading a field that was never answered.
  Passage passage = 5;

  // How the breath is shaped, and `MANNER_UNSPECIFIED` for most phases — the
  // ordinary answer, not the pointed absence `passage` uses on a hold: most
  // breaths are shaped no particular way. A hold is never shaped at all, which
  // the column behind this states as a constraint rather than leaving to the seed.
  Manner manner = 6;

  // The stillness closing this phase, in milliseconds, capped at 600 by the
  // column behind it. Absent means the client sizes the gap from the phase's
  // own length. Carried with presence because an authored zero is a real
  // answer: a continuous rhythm turns without a gap on purpose, and a bare
  // zero could not say so.
  optional uint32 turn_gap_ms = 7;

  // The haptic pattern this phase plays, named by a key whose definition the
  // client holds — the way `Technique.slug` names built-in artwork. Absent on
  // `turn_gap_ms`'s terms, so one concept has one absence rule. A key the
  // client does not know plays the derived pattern and logs.
  optional string haptic_pattern = 8;

  // The line this phase speaks, named as the clip the voice render wrote. One
  // entry of the exercise's script, because a script is written against the
  // real timings and a phase is where those live. Absent means the client
  // picks the cue from the phase itself.
  optional string voice_script = 9;
}

// A run of cycles sharing one phase pattern.
//
// The general case a plain cyclic technique degenerates to: box breathing is
// one stage repeated to five minutes, while a Wim Hof-style round is three stages —
// fast breaths, a retention the person ends, then a recovery hold.
message Stage {
  // The pattern, in play order. Never empty.
  repeated Phase phases = 1;

  // How many times this stage repeats its pattern before the next stage
  // begins. Always at least one.
  uint32 cycles = 2;

  // Whether the person, rather than the clock, decides when this stage is
  // over — a retention hold in a Wim Hof-style round. A client shows a "tap
  // when you're ready" affordance instead of a countdown, and its phases'
  // durations describe a typical hold rather than a scheduled one.
  bool open_ended = 3;
}

// A breathing technique and the session it describes.
message Technique {
  string id = 1;

  // Stable, human-readable key ("box-breathing"). The client pins its built-in
  // artwork and haptic patterns to this rather than to `id`, so the catalogue
  // can be reseeded without the app losing track of what it is looking at.
  string slug = 2;

  string name = 3;

  // One or two sentences: what it does and when to reach for it. Short on
  // purpose — it is what a catalogue row shows under the name, where a
  // paragraph would push the next exercise off the screen.
  string summary = 4;

  TechniqueGoal goal = 5;

  // M1's `phases` and `recommended_cycles`, replaced by the stage model in M2
  // while no client had shipped. Reserved rather than reused so a development
  // build holding the old contract fails to decode rather than misreading a
  // stage list as a phase list.
  reserved 6, 7;
  reserved "phases", "recommended_cycles";

  // The session, in play order. Never empty.
  repeated Stage stages = 8;

  // How many times a session repeats the whole stage list by default — curated
  // per technique. One for everything cyclic; three for a Wim Hof-style round,
  // where the round is the unit the protocol is counted in. Always at least
  // one. A user's own preference is a client-side override until identity
  // exists to store it against.
  uint32 recommended_rounds = 9;

  // The caution to show somebody who is already breathing this one, or empty.
  // Narrower than it reads: the general hazards of breathwork are consented to
  // once at onboarding, so this carries only what that screen does not
  // discharge. Empty for most of the catalogue, and a client rendering it
  // while somebody is *choosing* puts a warning back where it was taken from.
  string safety_note = 10;

  // Whether breathing this one needs a subscription. Phrased so that `false`
  // — the proto3 zero, and what an absent field or older server means — is
  // *unlocked*: a session runs entirely on the device, so a decode gap can
  // only cost a person being asked to pay for something promised. A locked
  // technique is still listed, described, and shown its rhythm.
  bool requires_subscription = 11;

  // Why this exercise works — complete plain text for the screen somebody
  // opens before they breathe it. Separate from `summary` because a list row
  // carrying a page's opening argument would be nine lines tall. Empty is a
  // real answer — the client opens on the summary — and a composed exercise
  // never has one: an author is never invited to assert physiology.
  string mechanism = 12;

  // How strong the case for this exercise actually is, as complete plain
  // text. Separate from `mechanism` because the two make different promises:
  // that is the confident story of how it works, this is what the trials
  // found and where they found nothing — kept apart so it cannot be softened
  // a clause at a time. Empty is real; a composed exercise never carries one.
  string evidence = 13;

  // What to do with your body before the first breath — one sentence, for the
  // settling beat a client counts down through. On the technique rather than a
  // phase because it does not change while the exercise runs, and it carries
  // what `Manner` cannot: closed teeth for a tongue that will not roll, or a
  // room rather than a movement. Empty for most; always for a composed exercise.
  string preparation = 14;

  // `evidence`'s verdict as one word, so a row can carry what only a detail
  // screen had room for. A separate field rather than inferred from the prose:
  // a grade read out of prose at render time is a claim the client invented
  // and would drift the first time a sentence was rewritten. Seeded beside
  // the verdict it summarises and moves when that moves.
  EvidenceGrade evidence_grade = 15;

  // Structured forms of the three legacy strings above. New clients prefer
  // these when present; the strings remain complete plain-text fallbacks for
  // older clients and servers.
  ReadingContent mechanism_content = 16;
  ReadingContent evidence_content = 17;
  ReadingContent preparation_content = 18;
}

// One question a beginner has, and the app's answer to it.
message FoundationTopic {
  // Stable key ("nose-or-mouth"), so a client — or M6's assistant, citing the
  // same rows — can reference a topic without pinning its wording.
  string slug = 1;

  // Phrased as the question someone actually asks, not as a heading.
  string question = 2;

  // A short answer, framed as a suggestion. Never a rule: the breathing works
  // while you are still learning.
  string answer = 3;

  // The same answer as structured reading content. `answer` remains the
  // complete fallback for clients that predate this field.
  ReadingContent answer_content = 4;
}

message ListTechniquesRequest {}

message ListTechniquesResponse {
  // Ordered for display, not by id — the sequence is curated so the catalogue
  // opens on the techniques a newcomer should try first.
  repeated Technique techniques = 1;
}

message ListFoundationsRequest {}

message ListFoundationsResponse {
  // Ordered for display: the questions come in the order they occur to someone
  // learning, not alphabetically.
  repeated FoundationTopic topics = 1;
}

// What an occasion resolves to: which technique, framed as what, run how, for
// how long.
//
// The route's whole destination, so a client hands one of these to a session
// rather than rebuilding the decision from an occasion's parts.
message Prescription {
  // The technique to breathe, named by the key `Technique.slug` carries. A
  // prescription never names one the catalogue does not hold — the column
  // behind it is a foreign key. The exercise's stages and subscription tier
  // are read from the catalogue entry; a protocol may replace the rhythm or
  // add a caution below, never carry a second copy of the exercise.
  string technique_slug = 1;

  // The goal this moment borrows, and why occasions are a route rather than a
  // second taxonomy: "before a presentation" *is* `CALM`. Seeded per occasion
  // rather than read back through `technique_slug`, because the framing is the
  // occasion's own fact — it should not move because a technique's primary
  // grouping was re-curated.
  TechniqueGoal goal = 2;

  DeliverySurface surface = 3;

  // How long the occasion asks for, in milliseconds — a target the client fits
  // whole cycles into, not a stopwatch to cut a breath short with. Carried per
  // occasion rather than taken from the technique, because the same technique
  // is a different offer in different moments: a minute to come down from
  // something, five to sit inside it.
  uint32 duration_ms = 4;

  // Which words the session speaks. Unset means `COPY_REGISTER_PLAIN`, which is
  // what every occasion seeded before this field existed means by saying
  // nothing.
  CopyRegister register = 5;

  // A protocol-owned rhythm, in the resolved technique's phase order. Empty
  // keeps the exercise's curated durations. Populated is valid only for one
  // closed cyclic stage and carries exactly one positive duration per phase.
  repeated uint32 phase_durations_ms = 6;

  // A caution belonging to this protocol rather than to every direct start of
  // the exercise it uses. Empty means the exercise's own safety note applies.
  string safety_note = 7;
}

// A named moment somebody might open the app in, and where it routes.
// Occasions do not add an exercise to the catalogue: each is a protocol over
// a technique that remains listed on its own. Not a claim about price — a
// route may name a technique that needs a subscription, which
// `Technique.requires_subscription` says and this message does not repeat.
message Occasion {
  // Stable key ("before-a-presentation"), so a client can pin an icon or an
  // analytics event to an occasion without pinning its wording.
  string slug = 1;

  // How the moment is named to the person, in their words rather than the
  // catalogue's.
  string name = 2;

  // One sentence on what this does for them here, or empty.
  string summary = 3;

  // Where the occasion routes. Always set; a client reading
  // `DELIVERY_SURFACE_UNSPECIFIED` off the surface has read a message whose
  // prescription never arrived.
  Prescription prescription = 4;
}

// One rung of the Start here progression.
message ProgressionStep {
  // The technique this step is, named as `Technique.slug`.
  string technique_slug = 1;

  // Why this one, at this point — the sentence that makes the order a
  // progression rather than a list. Empty is allowed and means the technique's
  // own summary is enough.
  string note = 2;
}

message ListRoutesRequest {}

message ListRoutesResponse {
  // Ordered for display, in the order somebody is most likely to want them.
  repeated Occasion occasions = 1;

  // The Start here progression, in curated order. The first step is
  // `progression[0]`; the next is the first whose technique the person has
  // not breathed, decided by the client from its own history — the list is
  // the same for everybody and holds no state. Suggestive, never gating:
  // nothing is hidden or reordered by it, and price is the catalogue's to state.
  repeated ProgressionStep progression = 2;
}
