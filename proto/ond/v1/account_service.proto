syntax = "proto3";

package ond.v1;

import "google/protobuf/timestamp.proto";

// AccountService attaches a real credential to the anonymous identity every
// other service is scoped to. Until an identity is bound, possession of the
// `ond-user-id` header is the whole claim; once `SignInWithApple` binds it,
// every request naming it must also carry `ond-session-credential` or be
// refused. Signing in gates nothing; subscriptions anchor on the App Store account.
service AccountService {
  // Starts a short-lived, single-use Sign in with Apple ceremony for one
  // account action. The caller SHA-256 hashes the returned nonce into Apple's
  // request; the server stores only that digest and accepts it only from this
  // caller, for this purpose, for five minutes.
  rpc BeginAppleAuthorization(BeginAppleAuthorizationRequest) returns (BeginAppleAuthorizationResponse);

  // Binds the caller's identity to an Apple account, and returns the identity
  // the device should use from now on. The returned id is not always the one
  // that called: an Apple account already bound to another row means the
  // caller's journey is merged into that row and the device adopts its id —
  // ignoring the response means writing to an identity that no longer exists.
  rpc SignInWithApple(SignInWithAppleRequest) returns (SignInWithAppleResponse);

  // Revokes the session credential this request was made with, and nothing
  // else: the identity survives, still bound (erasure is `DeleteAccount`), and
  // a second device's credential stays valid. A caller with no credential is
  // answered `OK`. The client must stop using the bound id the moment this
  // returns; sign-out mints a fresh anonymous identity, as `DeleteAccount` does.
  rpc SignOut(SignOutRequest) returns (SignOutResponse);

  // Erases the caller: the `users` row and everything the schema hangs off it,
  // the App Store binding included (a transaction Apple revoked stays revoked).
  // A bound account must prove itself — see `DeleteAccountRequest`. It does
  // **not** cancel an App Store subscription. The device must adopt a fresh
  // identity before sending anything else: one late call upserts the old id back.
  rpc DeleteAccount(DeleteAccountRequest) returns (DeleteAccountResponse);
}

enum AppleAuthorizationPurpose {
  APPLE_AUTHORIZATION_PURPOSE_UNSPECIFIED = 0;
  APPLE_AUTHORIZATION_PURPOSE_SIGN_IN = 1;
  APPLE_AUTHORIZATION_PURPOSE_DELETE_ACCOUNT = 2;
}

message BeginAppleAuthorizationRequest {
  // Required. A challenge cannot authorize both binding an account and
  // deleting one.
  AppleAuthorizationPurpose purpose = 1;
}

message BeginAppleAuthorizationResponse {
  // 256 random bits encoded as unpadded base64url. Returned once and never
  // persisted; pass SHA-256(nonce) to `ASAuthorizationAppleIDRequest.nonce`.
  string nonce = 1;

  // The absolute instant this challenge stops being usable. The client keeps a
  // prefetched sign-in challenge only while this is still in the future.
  google.protobuf.Timestamp expires_at = 2;
}

message SignInWithAppleRequest {
  // The `identityToken` from `ASAuthorizationAppleIDCredential`, verbatim: a
  // JWT Apple signed, whose `sub` names the Apple account. Sent rather than
  // the credential's plain `user` string, which a modified client can type —
  // and this is the key somebody's whole history is filed under.
  string identity_token = 1;
}

message SignInWithAppleResponse {
  // The identity to send in `ond-user-id` from now on, persisted in place of
  // whatever the device held. Equal to the caller on a first sign-in, and the
  // older identity when this Apple account already had one — see the RPC's
  // note. Always populated, so a client stores it unconditionally.
  string user_id = 1;

  // What proves that identity from now on: sent in `ond-session-credential` on
  // every request and kept in the Keychain beside the id. Opaque — the server
  // keeps only a SHA-256, so nothing regenerates it. **Returned once**; a
  // client that loses it signs in again on a fresh anonymous id, which returns
  // the same identity. Ignoring this field locks the client out.
  string session_credential = 2;
}

// Carries no id and no credential: the caller is the `ond-user-id` header, and
// the credential being revoked is the one the request was made with.
message SignOutRequest {}

// Empty. There is nothing to say beyond the status: the credential is revoked
// or the call failed.
message SignOutResponse {}

// Carries no id: the caller is the `ond-user-id` header, and a message naming
// somebody would be an invitation to erase them.
message DeleteAccountRequest {
  // A fresh `identityToken` from `ASAuthorizationAppleIDCredential`, in the
  // form `SignInWithAppleRequest` takes it. Required exactly when the caller's
  // identity is bound to an Apple account, ignored when it is not; an
  // anonymous identity sends nothing. The token must carry the digest of a
  // five-minute, deletion-only challenge, so one kept from sign-in fails.
  string identity_token = 1;
}

// Empty. Nothing survives worth reporting, and a count of deleted rows would be
// a number no client could act on.
message DeleteAccountResponse {}
