syntax = "proto3";

package ond.v1;

// AccountService attaches a real credential to the anonymous identity every
// other service is scoped to.
//
// Everything else in this API answers whoever the `ond-user-id` header names,
// and for an identity that has never signed in, possession of that id is the
// whole of the claim. That works until the device changes: a new phone, or a
// restore that missed the Keychain, and the history is unreachable with nothing
// to prove it was ever yours. Signing in with Apple is what makes it reachable
// again.
//
// It also changes what the id is worth, which is why this service hands one
// back. A signed-in row has a subscription and a recoverable history behind it,
// so from the moment it is bound, possession of the id stops being enough:
// `SignInWithApple` returns a session credential, and every request naming a
// bound identity must carry it in the `ond-session-credential` header or be
// refused. An identity that has never signed in is asked for nothing, on any
// service.
//
// Signing in is never required. The free tier is the whole app on one device,
// and a person who never calls this keeps the anonymous identity they started
// with — which is why this is a service of its own rather than a gate in front
// of the others. Buying a subscription is the one exception: money is worth
// stealing, so `EntitlementService.SubmitAppStoreTransaction` refuses an
// identity that has never proved an Apple account.
service AccountService {
  // Binds the caller's identity to an Apple account, and returns the identity
  // the device should use from now on.
  //
  // The returned id is not always the one that called: an Apple account already
  // bound to another row means that row is the person's real history, so their
  // journey is merged into it and the device adopts its id. A client that
  // ignores the response keeps writing to an identity that no longer exists.
  rpc SignInWithApple(SignInWithAppleRequest) returns (SignInWithAppleResponse);

  // Revokes the session credential this request was made with, and nothing
  // else.
  //
  // The identity itself survives, still bound, with all its history — signing
  // out is a person handing the device on or switching accounts, not asking to
  // be forgotten. That is `DeleteAccount`.
  //
  // Only the credential presented here is revoked, so a person signed in on two
  // devices keeps the other one. A caller with no credential — anyone who never
  // signed in — is answered `OK` having had nothing to revoke, because a client
  // clearing local state should not have to know whether the server agreed it
  // had anything to clear.
  //
  // The client must stop using the bound id the moment this returns: it holds
  // nothing that can prove that identity any more, and every further request on
  // it is refused. Sign-out therefore mints a fresh anonymous identity in the
  // same breath, exactly as `DeleteAccount` does.
  rpc SignOut(SignOutRequest) returns (SignOutResponse);

  // Erases the caller: the `users` row, and everything the schema hangs off it.
  //
  // Sessions, controlled-pause scores, the assistant's spend and every session
  // credential the identity ever minted all cascade, and the profile answers are
  // columns on the row itself. The App Store binding
  // goes with it too, which is what leaves the transaction free to entitle
  // whatever identity presents it next — the same release a merge performs. A
  // transaction Apple has *revoked* stays revoked, because that fact is filed
  // against the transaction rather than against the person.
  //
  // An account bound to an Apple ID has to prove it: the anonymous id in the
  // header is the weakest credential in the system, and this is the one
  // irreversible operation in the API. See `DeleteAccountRequest`.
  //
  // It does **not** cancel an App Store subscription. Nothing on this side can:
  // Apple owns that, and the client says so before it asks.
  //
  // The device must adopt a freshly minted identity the moment this returns, and
  // before it sends anything else. There is nothing here that could refuse the
  // erased id afterwards — every request upserts the row it names, so one late
  // call on the old one brings it back as an empty stranger nobody can reach.
  rpc DeleteAccount(DeleteAccountRequest) returns (DeleteAccountResponse);
}

message SignInWithAppleRequest {
  // The `identityToken` from `ASAuthorizationAppleIDCredential`, verbatim: a
  // JWT Apple signed, whose `sub` names the Apple account.
  //
  // Sent rather than the `user` string beside it in the same credential,
  // because that one is a plain value a modified client can type — and it is
  // the key this server files somebody's whole history under.
  string identity_token = 1;
}

message SignInWithAppleResponse {
  // The identity to send in `ond-user-id` from now on, and to persist in place
  // of whatever the device held.
  //
  // Equal to the caller on a first sign-in, and the older identity when this
  // Apple account already had one — see the RPC's own note. Always populated,
  // so a client stores it unconditionally rather than deciding whether the
  // answer applies to it.
  string user_id = 1;

  // What proves that identity from now on, to be sent in the
  // `ond-session-credential` header on every request and kept in the Keychain
  // beside the id. Opaque: 256 random bits, of which the server keeps only a
  // SHA-256, so nothing can be read out of it and nothing regenerates it.
  //
  // **Returned once.** There is no RPC that hands it back, because the server
  // cannot — a client that loses it signs in again on a fresh anonymous id,
  // which is the same path a new device takes and returns the same identity.
  //
  // A client that ignores this field is locked out of the identity the same
  // response just told it to adopt.
  string session_credential = 2;
}

// Carries no id and no credential: the caller is the `ond-user-id` header, and
// the credential being revoked is the one the request was made with.
message SignOutRequest {}

// Empty. There is nothing to say beyond the status: the credential is revoked
// or the call failed.
message SignOutResponse {}

// Carries no id: the caller is the `ond-user-id` header, and a message naming
// somebody would be an invitation to erase them.
message DeleteAccountRequest {
  // A fresh `identityToken` from `ASAuthorizationAppleIDCredential`, in the same
  // form `SignInWithAppleRequest` takes it.
  //
  // Required exactly when the caller's identity is bound to an Apple account,
  // and ignored when it is not. `SignInWithApple` already refuses to let
  // possession of an anonymous id outweigh a signed-in one — a bound row cannot
  // be merged away by whoever holds its UUID — and this is that same judgement
  // applied to the operation that destroys the row outright.
  //
  // An anonymous identity sends nothing, because the header genuinely is all it
  // has: there is no stronger credential to ask for, and demanding one would
  // put erasure out of reach of the majority of people who never sign in.
  //
  // Fresh matters. Apple's token expires in ten minutes, so a client that keeps
  // one from sign-in cannot present it here — which is the point: the person
  // has to be at the device, with the account, at the moment of deletion.
  string identity_token = 1;
}

// Empty. Nothing survives worth reporting, and a count of deleted rows would be
// a number no client could act on.
message DeleteAccountResponse {}
