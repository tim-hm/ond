syntax = "proto3";

package ond.v1;

import "google/protobuf/timestamp.proto";

// EntitlementService turns an App Store purchase into something the server can
// act on: the decisions the client must not make, like spending a model call.
// The server reads the tier only from the row `SubmitAppStoreTransaction`
// wrote, so a modified client claiming önd+ still gets the rules. The
// catalogue's lock is deliberately absent — the server enforces only what costs money to serve.
service EntitlementService {
  // Verifies a StoreKit signed transaction and stores what it grants. The JWS
  // is verified in-process against Apple's root certificate, so a purchase is
  // honoured while Apple's servers are unreachable. Idempotent on the original
  // transaction id: the same JWS on every launch writes the same entitlement.
  // Restore Purchases moves the entitlement onto the identity presenting it.
  rpc SubmitAppStoreTransaction(SubmitAppStoreTransactionRequest) returns (SubmitAppStoreTransactionResponse);

  // Returns what the server currently believes the caller is entitled to.
  //
  // Never NOT_FOUND: a caller who has never purchased anything is FREE, which is
  // a state rather than an absence.
  rpc GetEntitlement(GetEntitlementRequest) returns (GetEntitlementResponse);
}

// What a person may use. Ordered, and the order is load-bearing: every tier
// includes everything below it, so a check is "at least this". The line
// between the tiers is what a use costs us to serve — on-device is free,
// what the server spends on is önd+. UNSPECIFIED is never stored or served
// (proto3 demands a zero value); a client receiving it should treat it as FREE.
enum EntitlementTier {
  // COACH held tag 3 until the collapse. Reserved rather than merely deleted:
  // a client built against the old contract still reads a 3 as the top tier,
  // so a future rung reusing the tag would silently entitle it.
  reserved 3;
  reserved "ENTITLEMENT_TIER_COACH";

  ENTITLEMENT_TIER_UNSPECIFIED = 0;

  // The whole app as it runs on the device: every exercise and protocol, the
  // session player, custom exercises, the journey, and the watch app.
  ENTITLEMENT_TIER_FREE = 1;

  // önd+. Everything with a cost per use behind it — the assistant's language
  // model, the leaderboards, and the health trends the coach reads.
  ENTITLEMENT_TIER_PLUS = 2;
}

// What the server holds for one person.
message Entitlement {
  // Derived from `expires_at` against the server's clock at the moment of the
  // call, not stored: a subscription that lapsed overnight has to read as FREE
  // on the next call without anything having run in between.
  EntitlementTier tier = 1;

  // When the current period ends. Absent on FREE, and absent is the only thing
  // FREE ever carries — a past timestamp would invite a client to render an
  // expiry date for a subscription nobody has.
  google.protobuf.Timestamp expires_at = 2;
}

message SubmitAppStoreTransactionRequest {
  // A StoreKit 2 `Transaction.jwsRepresentation`, verbatim: three base64url
  // segments whose header carries the certificate chain the signature is
  // checked against. Sent rather than the decoded payload because the
  // signature is the whole point — a client that decoded it first would be
  // asking the server to trust its parsing.
  string signed_transaction = 1;
}

message SubmitAppStoreTransactionResponse {
  // The entitlement as stored, which is what the client should believe. A
  // submission that verified but granted nothing — an expired or refunded
  // transaction — comes back FREE rather than as an error: nothing went wrong,
  // and the caller is simply not a subscriber.
  Entitlement entitlement = 1;
}

message GetEntitlementRequest {}

message GetEntitlementResponse {
  Entitlement entitlement = 1;
}
