syntax = "proto3";

package ond.v1;

// For `TechniqueDraft`, which the coach's save-this-pattern card carries. The
// same message `UserTechniqueService.CreateUserTechnique` takes, deliberately:
// the card's action is that RPC, so a second shape here would be two
// definitions of "an exercise somebody is proposing" free to drift.
import "ond/v1/user_technique_service.proto";

// AssistantService turns what somebody told us at onboarding into guidance: a
// ranked list of techniques, and a conversation with the coach. Scoped to the
// caller via `ond-user-id`; no request carries a profile. Every RPC answers:
// when the model is unreachable, rate-limited, or over the daily quota, the
// server falls back to a rule-based answer, and `AssistantSource` says which.
service AssistantService {
  // Returns techniques to try next, best first.
  //
  // The request carries nothing: the server already holds the profile the
  // ranking is derived from, and a client that sent its own copy would let a
  // stale one decide what it is told.
  rpc GetRecommendation(GetRecommendationRequest) returns (GetRecommendationResponse);

  // Streams the coach's reply to one message. On this service because a
  // conversation shares everything the one-shot RPCs settled: identity
  // scoping, daily allowance, fallback doctrine, `AssistantSource`. The
  // server keeps no conversation state — the transcript lives on the device,
  // each call carries it back, and an offer is validated then forgotten.
  rpc Chat(ChatRequest) returns (stream ChatResponse);
}

// Where an answer came from.
//
// Carried on every response so the client can say "this one is written for you"
// only when it is. The distinction is user-visible copy, not telemetry.
enum AssistantSource {
  ASSISTANT_SOURCE_UNSPECIFIED = 0;

  // A language model, given the catalogue and this person's profile.
  ASSISTANT_SOURCE_MODEL = 1;

  // The server's own rules, from the goals the person picked: what a caller
  // whose tier buys the model gets when it is unreachable, failing, or their
  // daily quota is spent — and the shape every caller gets offline. Transient,
  // and copy drawn for it should say so and invite a retry.
  ASSISTANT_SOURCE_FALLBACK = 2;

  // The same rule-based answer, refused for a reason no retry can fix: the
  // caller's tier buys no model calls. Split from FALLBACK because the two
  // need opposite copy — "try later" sends somebody who will never get a
  // model answer round a loop that cannot succeed. Copy drawn for this case
  // explains the subscription and offers a way to it.
  ASSISTANT_SOURCE_SUBSCRIPTION_REQUIRED = 3;
}

// Coarse trends the phone computes from its own Health store, attached only
// when the person has opted in. Health data is the one thing the server never
// holds: read once, folded into this call's prompt, and forgotten. Every field
// is a rounded whole-unit 7-day mean or its delta; absent means too little
// evidence or nothing shared, and out-of-range values are dropped per field.
message HealthContext {
  // 7-day mean resting heart rate, in beats per minute.
  optional sint32 resting_hr_bpm = 1;

  // The mean's delta against the person's earlier baseline, in beats per
  // minute. Signed: positive is above baseline.
  optional sint32 resting_hr_trend_bpm = 2;

  // 7-day mean heart-rate variability (SDNN), in milliseconds.
  optional sint32 hrv_sdnn_ms = 3;

  // The SDNN mean's delta against the earlier baseline, in milliseconds.
  // Signed on the same terms as the resting-heart-rate trend.
  optional sint32 hrv_sdnn_trend_ms = 4;

  // Held for `session_hr_response_bpm`, the in-session heart-rate response
  // summary, which ships with the hardware slice that can actually measure it.
  reserved 5;

  // 7-day mean sleeping respiratory rate, in breaths a minute — the passive
  // companion to the resting rate somebody counts by hand in the check-in. A
  // watch samples it overnight and nowhere else, so this is a nightly figure,
  // and it runs slower than the same person's waking rate — never compare the
  // two as though they were one series.
  optional sint32 sleeping_breaths_per_minute = 6;

  // The mean's delta against the person's earlier baseline, in breaths a
  // minute. Signed on the same terms as the heart trends above: positive is
  // above baseline, and *below* is the direction practice moves it.
  optional sint32 sleeping_breaths_trend = 7;
}

// Who said one turn of a conversation.
enum ChatRole {
  CHAT_ROLE_UNSPECIFIED = 0;

  // The person using the app.
  CHAT_ROLE_PERSON = 1;

  // The coach — this service's own earlier replies, read back to it.
  CHAT_ROLE_COACH = 2;
}

// One turn of the conversation, as the device remembers it.
message ChatTurn {
  // Never UNSPECIFIED: a turn that does not say who spoke is INVALID_ARGUMENT,
  // because the server hands these to the model as genuinely attributed
  // speech and cannot guess an attribution.
  ChatRole role = 1;

  // What was said. A turn past the new-message bound is truncated silently
  // rather than refused: a transcript is persisted replay, the coach's own
  // replies routinely outgrow the bound, and a refusal here would replay with
  // the conversation on every send forever.
  string text = 2;

  // The slug of an exercise the coach offered in this turn, if any; only the
  // slug travels back. Unverifiable like every COACH turn: the server echoes
  // it to the model only when it resolves in the catalogue, and words the
  // echo itself, so a fabricated value can never become prompt text. Over-long
  // values are dropped silently — this is annotation, not speech.
  string offered_slug = 3;
}

message ChatRequest {
  // The conversation so far, oldest first, supplied by the client — the
  // server holds no transcript, so the device's copy is the only one. COACH
  // turns cannot be verified as the coach's words and are treated as
  // conversation data. Only the most recent turns are read; older ones are
  // silently ignored.
  repeated ChatTurn history = 1;

  // The person's new message. Required, and bounded; an empty or over-long
  // message is INVALID_ARGUMENT.
  string message = 2;

  // The same coarse heart trends the recommendation RPC may carry, on the same
  // terms: optional, device-computed, used transiently, never stored.
  HealthContext health_context = 3;

  // The caller's offset from UTC, in minutes, so the coach can speak about a
  // practice streak — which counts local days and must agree with the journey
  // screen. `optional` rather than a bare int32 because zero is a real offset:
  // a plain field cannot tell UTC from a client that sent nothing. Omitting
  // it costs the streak and nothing else.
  optional int32 utc_offset_minutes = 4;
}

message ChatResponse {
  // Identical on every chunk of one stream. Neither FALLBACK nor
  // SUBSCRIPTION_REQUIRED is a conversation here — each is a short fixed
  // sentence, because the rules can rank exercises but they cannot chat. The
  // two sentences differ, and so should anything the client draws around them.
  AssistantSource source = 2;

  // One chunk carries exactly one of these, and at most one chunk of a reply
  // carries anything but text: a person handed two cards under one paragraph
  // has been given a form, not a coach.
  oneof payload {
    // The next piece of the reply, to be appended to what came before — chunk
    // boundaries carry no meaning.
    string text = 1;

    // An exercise the coach is offering to start, arriving at most once per
    // reply and after its prose; rendered as an actionable card, never
    // appended to the text. Every slug resolved against the catalogue and
    // every override was clamped to its safe ranges, so a client can start a
    // session from it without a defensive branch.
    ExerciseOffer offer = 3;

    // An offer to take the breath-hold test, on the same terms as `offer`:
    // after the prose, at most once, rendered as a card and never appended to
    // the text. The coach reasons from a BOLT score constantly — the system
    // prompt spends a paragraph on how to read one — and could previously only
    // say "go and take one" as prose the person had to go and act on.
    BoltTestOffer bolt_test = 4;

    // A pattern the coach is offering to keep as one of the person's own
    // exercises — after the prose, at most once, a card rather than text.
    // `TechniqueDraft` is reused because `UserTechniqueService.Create` takes
    // one: accepting the card is that RPC with this payload, already run
    // through the same validator, so a tapped card cannot be refused.
    TechniqueDraft saved_exercise = 5;
  }
}

// An offer to start the breath-hold (BOLT) test. Deliberately empty: the
// offer is the whole payload, and a message rather than a bool so a later
// reason or suggested moment can be added without a wire break.
message BoltTestOffer {}

// An offer to start one catalogue exercise, optionally with adjusted pacing.
message ExerciseOffer {
  // A slug from the catalogue `TechniqueService.ListTechniques` serves, always.
  string technique_slug = 1;

  // Absent means "as catalogued". When present it is complete: one entry per
  // stage in play order, every slot carrying either the coach's adjustment or
  // the catalogue default, already clamped — the client applies it wholesale.
  ExerciseOverrides overrides = 2;
}

// A complete dialling of one exercise, shaped exactly like the technique it
// belongs to. Parallel to the client's own per-exercise overrides, so a stage
// count or phase count that no longer matches the catalogue simply fails to
// apply there and the exercise runs as curated.
message ExerciseOverrides {
  // One entry per stage, in play order.
  repeated StageDialling stages = 1;

  // Clamped to the same 1..10 the dial UI allows.
  uint32 rounds = 2;
}

// One stage's pacing.
message StageDialling {
  // One duration per phase, in cycle order, clamped to each phase's own
  // catalogue min/max.
  repeated uint32 phase_durations_ms = 1;

  // Clamped to the same 1..99 the dial UI allows. An open-ended stage carries
  // its catalogue value untouched.
  uint32 cycles = 2;
}

message GetRecommendationRequest {
  // See `HealthContext` for why this request is no longer empty. Absent when
  // the person has not opted in, when Health has nothing to summarise, or when
  // the client predates the field — the server behaves identically in all
  // three cases. Message fields track presence on their own, so no `optional`.
  HealthContext health_context = 1;
}

// One technique worth trying, and why.
message Recommendation {
  // A slug from the catalogue `TechniqueService.ListTechniques` serves, always.
  // The server validates every slug a model produces against the catalogue and
  // drops the ones it invented, so a client can look this up without a
  // defensive branch for a technique it has never heard of.
  string technique_slug = 1;

  // One sentence, addressed to the person, grounded in the goals and experience
  // level they gave. Never empty.
  string reason = 2;
}

message GetRecommendationResponse {
  // Best first, and bounded — this is a nudge towards a next session, not a
  // second catalogue. Never empty: a model that returned nothing usable falls
  // back to the rules rather than an empty list the client has to explain.
  repeated Recommendation recommendations = 1;

  AssistantSource source = 2;
}
