syntax = "proto3";

package ond.v1;

// For `TechniqueDraft`, which the coach's save-this-pattern card carries. The
// same message `UserTechniqueService.CreateUserTechnique` takes, deliberately:
// the card's action is that RPC, so a second shape here would be two
// definitions of "an exercise somebody is proposing" free to drift.
import "ond/v1/user_technique_service.proto";

// AssistantService turns what somebody told us at onboarding into guidance: a
// short ranked list of techniques to try, and an explanation of why a technique
// works, written for how much breathwork they have done before.
//
// Scoped to the caller exactly like ProfileService — the anonymous identity
// travels in the `ond-user-id` header and no request message carries a
// profile, so one client can never ask for guidance shaped by another's
// answers.
//
// Every RPC here answers. A language model sits behind both of them, and it can
// be unreachable, rate-limited, or over the caller's daily quota; when it is,
// the server falls back to a rule-based answer derived from the same profile
// rather than failing the call. `AssistantSource` on the response says which
// happened, so a client can be honest about it instead of guessing.
service AssistantService {
  // Returns techniques to try next, best first.
  //
  // The request carries nothing: the server already holds the profile the
  // ranking is derived from, and a client that sent its own copy would let a
  // stale one decide what it is told.
  rpc GetRecommendation(GetRecommendationRequest) returns (GetRecommendationResponse);

  // Streams an explanation of why one technique works.
  //
  // Server-streaming because perceived latency is the whole point: an
  // explanation arrives a sentence at a time and the reader starts reading
  // immediately, where a unary call would show a spinner for as long as the
  // model takes to finish.
  rpc ExplainTechnique(ExplainTechniqueRequest) returns (stream ExplainTechniqueResponse);

  // Streams the coach's reply to one message in a conversation.
  //
  // On this service rather than its own, because a conversation shares
  // everything the one-shot RPCs already settled: the same identity scoping,
  // the same daily allowance, the same fallback doctrine, and the same
  // `AssistantSource` honesty on every chunk.
  //
  // The server keeps no conversation state at all — no transcript, no prompt,
  // no reply is persisted or logged anywhere. The transcript lives on the
  // device, and each call carries as much of it as the client wants read back.
  // An `ExerciseOffer` riding on a reply is covered by the same promise: it is
  // validated against the catalogue within the call and forgotten with it.
  rpc Chat(ChatRequest) returns (stream ChatResponse);
}

// Where an answer came from.
//
// Carried on every response so the client can say "this one is written for you"
// only when it is. The distinction is user-visible copy, not telemetry.
enum AssistantSource {
  ASSISTANT_SOURCE_UNSPECIFIED = 0;

  // A language model, given the catalogue and this person's profile.
  ASSISTANT_SOURCE_MODEL = 1;

  // The server's own rules, from the goals the person picked. What a caller
  // whose tier does buy the model gets when it is unreachable, has failed
  // repeatedly, or their daily quota is spent — and what every caller gets
  // offline, since a client that cannot reach the server shows the same shape
  // of answer.
  //
  // Transient, and copy drawn for it should say so and invite a retry.
  ASSISTANT_SOURCE_FALLBACK = 2;

  // The same rule-based answer, refused for a reason no retry can fix: the
  // caller's tier buys no model calls at all.
  //
  // Split from FALLBACK because the two need opposite copy. "We are having
  // trouble, try later" is true of an outage and false here — it sends
  // somebody who will never get a model answer round a loop that cannot
  // succeed, which is exactly what it did. Anything drawn for this case
  // explains the subscription and offers a way to it.
  ASSISTANT_SOURCE_SUBSCRIPTION_REQUIRED = 3;
}

// Coarse trends computed on the phone from its own Health store and attached
// per request when — and only when — the person has switched on the in-app
// opt-in.
//
// This message deliberately inverts the empty-request rule the RPCs above
// follow. Requests here carry nothing because the server already holds the
// fresher copy of the profile — but health data is the one thing the server
// never holds: it is never persisted and never logged there, so the device is
// its only holder and the client's copy is by definition the fresh one. The
// server reads it once, folds it into the prompt for this call, and forgets it.
//
// Every field is a rounded whole-unit summary — a 7-day mean, or that mean's
// delta against the weeks before — with no timestamps and no raw readings.
// Absent fields mean the phone had too little evidence, or the person shared
// nothing; the server treats both identically. Values outside physiological
// range are dropped server-side, field by field, never failing the request.
message HealthContext {
  // 7-day mean resting heart rate, in beats per minute.
  optional sint32 resting_hr_bpm = 1;

  // The mean's delta against the person's earlier baseline, in beats per
  // minute. Signed: positive is above baseline.
  optional sint32 resting_hr_trend_bpm = 2;

  // 7-day mean heart-rate variability (SDNN), in milliseconds.
  optional sint32 hrv_sdnn_ms = 3;

  // The SDNN mean's delta against the earlier baseline, in milliseconds.
  // Signed on the same terms as the resting-heart-rate trend.
  optional sint32 hrv_sdnn_trend_ms = 4;

  // Held for `session_hr_response_bpm`, the in-session heart-rate response
  // summary, which ships with the hardware slice that can actually measure it.
  reserved 5;

  // 7-day mean sleeping respiratory rate, in breaths a minute.
  //
  // The passive companion to the resting rate somebody counts by hand in the
  // check-in: same quantity, measured while they slept instead of while they
  // sat. A watch samples it overnight and nowhere else, so this is a nightly
  // figure whatever the field name suggests, and it runs slower than the same
  // person's waking rate — never compare the two as though they were one
  // series.
  optional sint32 sleeping_breaths_per_minute = 6;

  // The mean's delta against the person's earlier baseline, in breaths a
  // minute. Signed on the same terms as the heart trends above: positive is
  // above baseline, and *below* is the direction practice moves it.
  optional sint32 sleeping_breaths_trend = 7;
}

// Who said one turn of a conversation.
enum ChatRole {
  CHAT_ROLE_UNSPECIFIED = 0;

  // The person using the app.
  CHAT_ROLE_PERSON = 1;

  // The coach — this service's own earlier replies, read back to it.
  CHAT_ROLE_COACH = 2;
}

// One turn of the conversation, as the device remembers it.
message ChatTurn {
  // Never UNSPECIFIED: a turn that does not say who spoke is INVALID_ARGUMENT,
  // because the server hands these to the model as genuinely attributed
  // speech and cannot guess an attribution.
  ChatRole role = 1;

  // What was said. A turn past the new-message bound is truncated silently
  // rather than refused: a transcript is persisted replay, the coach's own
  // replies routinely outgrow the bound, and a refusal here would replay with
  // the conversation on every send forever.
  string text = 2;

  // The slug of an exercise the coach offered in this turn, if any. Only the
  // slug travels back: the model needs to know what it already offered, not
  // the numbers. Unverifiable like every COACH turn and treated the same way —
  // the server echoes it to the model only when it resolves in the catalogue,
  // and words the echo itself, so a fabricated value can never become prompt
  // text. Over-long values are dropped silently rather than failing the
  // request; this is annotation, not speech.
  string offered_slug = 3;
}

message ChatRequest {
  // The conversation so far, oldest first, supplied by the client. The server
  // holds no transcript, so the device's copy is the only one — the same
  // inversion of the empty-request rule `HealthContext` documents. COACH turns
  // cannot be verified as genuinely the coach's words; they are accepted and
  // treated as conversation data, on the same terms as the intent note. Only
  // the most recent turns are read; older ones are silently ignored.
  repeated ChatTurn history = 1;

  // The person's new message. Required, and bounded; an empty or over-long
  // message is INVALID_ARGUMENT.
  string message = 2;

  // The same coarse heart trends the other two RPCs may carry, on the same
  // terms: optional, device-computed, used transiently, never stored.
  HealthContext health_context = 3;

  // The caller's offset from UTC, in minutes, so the coach can speak about a
  // practice streak. Only this RPC carries one: a streak counts local days, and
  // the coach is the one surface that says the number out loud — where the
  // journey screen shows the same figure, the two must visibly agree.
  //
  // `optional` rather than a bare int32, unlike the two on JourneyService: zero
  // is a real offset, so a plain field cannot tell UTC from a client that sent
  // nothing, and computing a streak at UTC for somebody in Sydney is the exact
  // off-by-one this field exists to avoid. Omitting it costs the streak and
  // nothing else — every other figure in the snapshot is offset-free.
  optional int32 utc_offset_minutes = 4;
}

message ChatResponse {
  // Identical on every chunk of one stream. Neither FALLBACK nor
  // SUBSCRIPTION_REQUIRED is a conversation here — each is a short fixed
  // sentence, because the rules can rank exercises but they cannot chat. The
  // two sentences differ, and so should anything the client draws around them.
  AssistantSource source = 2;

  // One chunk carries exactly one of these, and at most one chunk of a reply
  // carries anything but text: a person handed two cards under one paragraph
  // has been given a form, not a coach.
  oneof payload {
    // The next piece of the reply, to be appended to what came before — chunk
    // boundaries carry no meaning, exactly as on `ExplainTechniqueResponse`.
    string text = 1;

    // An exercise the coach is offering to start, arriving at most once per
    // reply and after its prose. Rendered by the client as an actionable card,
    // never appended to the text. Every slug in here resolved against the
    // catalogue on the server and every override was clamped to the
    // catalogue's own safe ranges, so a client can start a session from it
    // without a defensive branch — exactly the contract
    // `Recommendation.technique_slug` already keeps.
    ExerciseOffer offer = 3;

    // An offer to take the breath-hold test, on the same terms as `offer`:
    // after the prose, at most once, rendered as a card and never appended to
    // the text. The coach reasons from a BOLT score constantly — the system
    // prompt spends a paragraph on how to read one — and could previously only
    // say "go and take one" as prose the person had to go and act on.
    BoltTestOffer bolt_test = 4;

    // A pattern the coach is offering to keep as one of the person's own
    // exercises, on the same terms again: after the prose, at most once, a card
    // rather than text. The natural next sentence after a dialled offer is
    // "keep this one", and there was no way to.
    //
    // `TechniqueDraft` is reused rather than mirrored — it is literally "an
    // exercise somebody is proposing", and `UserTechniqueService.Create` already
    // takes one, so accepting the card is that RPC with this payload and the
    // phone gains no new type on the write path. The server has already run it
    // through the same validator that RPC will, so a card the person taps
    // cannot be refused on arrival.
    TechniqueDraft saved_exercise = 5;
  }
}

// An offer to start the breath-hold (BOLT) test.
//
// Deliberately empty. The offer is the whole payload — there is nothing to
// parameterise and therefore nothing to validate — and a message rather than a
// bool so a later reason or a suggested moment can be added without a wire
// break.
message BoltTestOffer {}

// An offer to start one catalogue exercise, optionally with adjusted pacing.
message ExerciseOffer {
  // A slug from the catalogue `TechniqueService.ListTechniques` serves, always.
  string technique_slug = 1;

  // Absent means "as catalogued". When present it is complete: one entry per
  // stage in play order, every slot carrying either the coach's adjustment or
  // the catalogue default, already clamped — the client applies it wholesale.
  ExerciseOverrides overrides = 2;
}

// A complete dialling of one exercise, shaped exactly like the technique it
// belongs to. Parallel to the client's own per-exercise overrides, so a stage
// count or phase count that no longer matches the catalogue simply fails to
// apply there and the exercise runs as curated.
message ExerciseOverrides {
  // One entry per stage, in play order.
  repeated StageDialling stages = 1;

  // Clamped to the same 1..10 the dial UI allows.
  uint32 rounds = 2;
}

// One stage's pacing.
message StageDialling {
  // One duration per phase, in cycle order, clamped to each phase's own
  // catalogue min/max.
  repeated uint32 phase_durations_ms = 1;

  // Clamped to the same 1..99 the dial UI allows. An open-ended stage carries
  // its catalogue value untouched.
  uint32 cycles = 2;
}

message GetRecommendationRequest {
  // See `HealthContext` for why this request is no longer empty. Absent when
  // the person has not opted in, when Health has nothing to summarise, or when
  // the client predates the field — the server behaves identically in all
  // three cases. Message fields track presence on their own, so no `optional`.
  HealthContext health_context = 1;
}

// One technique worth trying, and why.
message Recommendation {
  // A slug from the catalogue `TechniqueService.ListTechniques` serves, always.
  // The server validates every slug a model produces against the catalogue and
  // drops the ones it invented, so a client can look this up without a
  // defensive branch for a technique it has never heard of.
  string technique_slug = 1;

  // One sentence, addressed to the person, grounded in the goals and experience
  // level they gave. Never empty.
  string reason = 2;
}

message GetRecommendationResponse {
  // Best first, and bounded — this is a nudge towards a next session, not a
  // second catalogue. Never empty: a model that returned nothing usable falls
  // back to the rules rather than an empty list the client has to explain.
  repeated Recommendation recommendations = 1;

  AssistantSource source = 2;
}

message ExplainTechniqueRequest {
  // A catalogue slug. Unknown slugs are NOT_FOUND rather than an invented
  // explanation.
  string technique_slug = 1;

  // The same coarse heart trends `GetRecommendationRequest` may carry, on the
  // same terms: optional, device-computed, used transiently, never stored.
  HealthContext health_context = 2;
}

message ExplainTechniqueResponse {
  // The next piece of the explanation, to be appended to what came before.
  // Chunk boundaries are wherever the model happened to break and carry no
  // meaning — a client accumulates them and renders the running total.
  string text = 1;

  // Identical on every chunk of one stream, so a client reading the first
  // message already knows whether to say the explanation was written for this
  // person. Repeating it costs a byte and saves a header contract.
  AssistantSource source = 2;
}
