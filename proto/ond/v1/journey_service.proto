syntax = "proto3";

package ond.v1;

import "google/protobuf/timestamp.proto";
import "ond/v1/technique_service.proto";

// JourneyService holds what a person has actually done: the sessions they
// breathed, the controlled-pause tests they took, and where that puts them
// against everyone who has chosen to be visible. Scoped to the caller via the
// `ond-user-id` header; no request message carries an id, so one client can
// never read another's journey by guessing a value.
service JourneyService {
  // Records a batch of finished sessions. A batch because the client records
  // sessions locally and drains them opportunistically — a week breathed on a
  // plane syncs at once. Idempotent on `(caller, client_session_id)`: a retry,
  // a double-sync, and a client that lost track all converge on the same rows,
  // and the response says how many were new.
  rpc RecordSessions(RecordSessionsRequest) returns (RecordSessionsResponse);

  // Forgets sessions the person deleted on their device. Without this call
  // the client's tombstones would have to survive forever — a reinstall loses
  // them and a later GetJourney resurrects the sessions. Idempotent: an id
  // the server does not hold is not an error, because a tombstone is only
  // dropped once the server has definitely forgotten the session.
  rpc DeleteSessions(DeleteSessionsRequest) returns (DeleteSessionsResponse);

  // Returns the caller's totals, streaks, and recent history — derived on
  // read, so nothing can drift out of step with the sessions. Two callers:
  // the journey screen asks for a bounded page, and a device restoring after
  // a reinstall pages through the whole archive with `page_token` until no
  // token comes back.
  rpc GetJourney(GetJourneyRequest) returns (GetJourneyResponse);

  // Records one BOLT-style controlled-pause measurement.
  //
  // The measurement happens on the client — it is a stopwatch the person starts
  // and stops — so the server's job is to keep the history and answer whether
  // this one is their best.
  rpc RecordBoltScore(RecordBoltScoreRequest) returns (RecordBoltScoreResponse);

  // Records one resting-rate measurement — breaths a minute, counted at rest.
  //
  // Same division of labour as the pause above: the client counts, the server
  // keeps the history and answers whether this one is the lowest.
  rpc RecordRestingRate(RecordRestingRateRequest) returns (RecordRestingRateResponse);

  // Returns a board's leading entries plus where the caller stands on it.
  //
  // Only people who have chosen a display name appear in `entries`; everyone
  // with a score is counted in the ranking. Someone with no display name is
  // therefore invisible to others and still knows their own position.
  rpc GetLeaderboard(GetLeaderboardRequest) returns (GetLeaderboardResponse);
}

// One session a person breathed. The same shape in both directions — what the
// client sends up and what `GetJourney` sends back — because a session is a
// fact, and a second read-side message would be the same fields renamed.
message SessionRecord {
  // A UUID the client mints when the session ends, and the idempotency key the
  // server upserts on. Client-generated rather than server-assigned so a
  // session recorded offline already has its identity and a retry is not a
  // second session.
  string client_session_id = 1;

  // The technique's slug, stored as text and deliberately not checked against
  // the catalogue — see the migration for why a renamed technique must never
  // invalidate a session someone did.
  string technique_slug = 2;

  // When the session began, not when it synced.
  google.protobuf.Timestamp started_at = 3;

  // How long it ran. Milliseconds, matching `Phase.duration_ms`.
  uint32 duration_ms = 4;

  // Cycles wholly finished. A session ended mid-cycle counts the cycles behind
  // it, never the one it was in.
  uint32 cycles_completed = 5;

  // Inhales taken — two per cycle in techniques like the physiological sigh.
  uint32 breath_count = 6;

  // Whether the timeline ran out, as opposed to the person ending it early.
  // Both are recorded; only this distinguishes them.
  bool completed = 7;

  // The occasion that prescribed this session, absent when the person picked
  // the technique themselves. Stored as text and unchecked against the
  // catalogue for `technique_slug`'s exact reason: a renamed occasion must
  // never invalidate a session someone did.
  optional string occasion_slug = 8;

  // How the session was delivered. UNSPECIFIED means a record from before the
  // field existed and reads as full-screen — the only surface any client could
  // deliver then. Carried because `completed` means something different per
  // surface: a discreet session's sparse cadence runs near half an hour, and
  // grading it like a five-minute guided session would misread both.
  DeliverySurface surface = 9;
}

message RecordSessionsRequest {
  // Never empty, and bounded — the server rejects an oversized batch rather
  // than accepting an unbounded write from a client that has lost its place.
  repeated SessionRecord sessions = 1;
}

message RecordSessionsResponse {
  // Sessions the server had not seen before.
  uint32 recorded = 1;

  // Sessions it already held, whether from an earlier sync or from a repeat
  // within this same batch. Not an error: it is the expected answer to a retry.
  uint32 already_known = 2;
}

message DeleteSessionsRequest {
  // The `client_session_id`s to forget. Never empty, and bounded by the same
  // limit RecordSessions carries — a client draining a backlog of deletions
  // splits it the same way it splits a backlog of sessions.
  repeated string client_session_ids = 1;
}

message DeleteSessionsResponse {
  // Rows this call actually removed. Lower than the number of ids sent whenever
  // some had already gone, which is the expected answer to a retry rather than
  // a discrepancy worth reporting.
  uint32 deleted = 1;
}

message GetJourneyRequest {
  // The caller's offset from UTC, in minutes, east-positive — 60 for British
  // Summer Time, -480 for Pacific Standard. Sent per request and never
  // stored: a streak is a run of *local* calendar days, and a stored offset
  // would be wrong the moment somebody flew somewhere.
  int32 utc_offset_minutes = 1;

  // How many sessions `recent_sessions` may carry, newest first. Absent asks
  // for the display default; the server caps anything larger and refuses a
  // zero. `optional` because proto3 cannot tell a client that asked for
  // nothing from one that predates the field, and the second must keep
  // getting a full strip.
  optional uint32 limit = 2;

  // Continues where a previous response's `next_page_token` left off. Opaque
  // and server-minted — it encodes the last session's position, so a page is
  // a keyset seek rather than an offset scan that slows as a restore goes
  // deeper. Absent asks for the first page.
  optional string page_token = 3;

  // Asks for the sessions and page token alone, zeroing `totals`, the streaks
  // and `best_bolt_seconds` — the three heaviest per-person reads — for the
  // reinstall restore, which discards them on every page. Stated rather than
  // inferred from `page_token`, which a first page never carries; a client
  // that did not ask cannot receive zeroes. Unset is false, the full answer.
  bool sessions_only = 4;
}

// Everything a person has accumulated, folded server-side. Not what either
// screen draws: both apps fold their own totals so the journey is complete in
// airplane mode, and days practised is a client fold that is not here at all.
// The one figure the two sides must agree on is the streak, which the
// response carries beside this rather than inside it.
message JourneyTotals {
  uint32 sessions = 1;

  uint64 breaths = 2;

  // Whole minutes, rounded down. Derived from the summed milliseconds so that a
  // hundred short sessions do not each lose their remainder.
  uint64 minutes = 3;
}

message GetJourneyResponse {
  JourneyTotals totals = 1;

  // Consecutive local days ending today or yesterday. Yesterday counts because
  // a streak is not broken until a whole local day has passed without a
  // session — somebody who has not breathed yet this morning has not lost
  // anything.
  uint32 current_streak_days = 2;

  // The longest run of consecutive local days there has ever been. Never
  // decreases, which is the point: it is the thing left to celebrate when a
  // current streak pauses.
  uint32 best_streak_days = 3;

  // One page of sessions, newest first, bounded by the request's `limit`.
  repeated SessionRecord recent_sessions = 4;

  // The caller's best controlled pause, absent until they have taken one.
  // Carried here so the journey screen does not need a second round trip to
  // draw the BOLT card.
  optional uint32 best_bolt_seconds = 5;

  // Pass back as `page_token` for the next page. Absent means this page is the
  // end of the history, which is the only signal a restore has that it has
  // recovered everything.
  optional string next_page_token = 6;
}

message RecordBoltScoreRequest {
  // A UUID the client mints when the test ends, and the idempotency key the
  // server upserts on — the same contract `SessionRecord` carries, and for the
  // same reason: these are drained by one opportunistic sync queue, so a retry
  // must cost nothing. Without it a resend would add a second row that every
  // board silently absorbs behind `max(seconds)`.
  string client_score_id = 3;

  // How long the comfortable pause lasted, measured on the client.
  //
  // Seconds rather than milliseconds: the test ends when the person feels the
  // first definite urge to breathe, and precision past a second would claim an
  // accuracy the measurement does not have.
  uint32 seconds = 1;

  // When it was taken. Optional — the server uses its own clock when the field
  // is absent, which is the normal case for a test taken online.
  google.protobuf.Timestamp measured_at = 2;
}

message RecordBoltScoreResponse {
  // The best score on record after this one, so a client that was offline for
  // several tests still shows the right number.
  uint32 best_seconds = 1;

  // Whether this measurement is the new best. Answered by the server rather
  // than compared on the client, which may not hold the full history.
  bool is_personal_best = 2;
}

message RecordRestingRateRequest {
  // Minted by the client when the count ends, and the idempotency key the
  // server upserts on — the same contract a session and a pause both carry,
  // because all three drain through one opportunistic sync queue.
  string client_measurement_id = 1;

  // How many breaths a minute, counted at rest on the client.
  //
  // Whole breaths a minute rather than a duration: the person taps once per
  // breath over a fixed minute, so the count *is* the measurement and any
  // further precision would be arithmetic rather than observation.
  uint32 breaths_per_minute = 2;

  // When it was taken. Optional, and read the same way `RecordBoltScoreRequest`
  // reads its own: absent means the server's clock.
  google.protobuf.Timestamp measured_at = 3;
}

message RecordRestingRateResponse {
  // The lowest rate on record after this one — the personal best, because a
  // slower resting breath is the direction practice moves it.
  uint32 lowest_breaths_per_minute = 1;

  // Whether this measurement is the new lowest. Answered by the server, which
  // holds the whole history a client may not.
  bool is_personal_best = 2;
}

// Which board is being asked for.
//
// Every board measures consistency or a controlled test. There is deliberately
// no maximal-breath-hold board: a contest over how long someone can hold their
// breath rewards exactly the behaviour this app tells people not to do.
enum LeaderboardBoard {
  LEADERBOARD_BOARD_UNSPECIFIED = 0;

  // Current streak in consecutive local days.
  LEADERBOARD_BOARD_STREAK = 1;

  // Minutes breathed over the last thirty days. A rolling window rather than an
  // all-time total, so somebody who started this month is not ranked against a
  // year of somebody else's history.
  LEADERBOARD_BOARD_MINUTES_30D = 2;

  // Best BOLT-style controlled pause, in seconds.
  LEADERBOARD_BOARD_BOLT = 3;

  // Lowest resting breathing rate, in breaths a minute — the one board where
  // a smaller number ranks higher, and the one with a ceiling: a rate at or
  // below the resonance frequency is reported as reaching it, and everybody
  // there ties. Without that, "fewest breaths in a minute" would be a
  // breath-hold contest wearing another name.
  LEADERBOARD_BOARD_RESTING_RATE = 4;
}

// Who a board is drawn from.
enum LeaderboardScope {
  LEADERBOARD_SCOPE_UNSPECIFIED = 0;

  // Everyone.
  LEADERBOARD_SCOPE_GLOBAL = 1;

  // Only people who share the caller's birth-year band. Requires the caller to
  // have set one — the server has nothing to compare against otherwise.
  LEADERBOARD_SCOPE_AGE_BAND = 2;
}

message GetLeaderboardRequest {
  LeaderboardBoard board = 1;

  LeaderboardScope scope = 2;

  // The caller's offset from UTC in minutes, as on GetJourneyRequest. Read only
  // by the streak board, and harmless on the others.
  int32 utc_offset_minutes = 3;
}

message LeaderboardEntry {
  // Position on the board. Equal values share a rank, and the ranking counts
  // everybody with a score — so consecutive entries may skip a number where the
  // person in between has not chosen a display name.
  uint32 rank = 1;

  // Never empty: a name is what puts somebody on a board at all.
  string display_name = 2;

  // The board's measure, in that board's unit — days, minutes, or seconds.
  uint32 value = 3;
}

// Where the caller stands, whether or not anyone else can see them.
message LeaderboardStanding {
  // Absent when the caller has nothing to rank yet — no sessions, or no BOLT
  // score on that board.
  optional uint32 rank = 1;

  uint32 value = 2;

  // Whether other people can see them here. False until they set a display
  // name, which is the whole of the opt-in.
  bool listed = 3;
}

message GetLeaderboardResponse {
  // The leading named entries, best first. Empty is a normal state on a young
  // board where nobody has opted in.
  repeated LeaderboardEntry entries = 1;

  LeaderboardStanding caller = 2;
}
