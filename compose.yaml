# The only container this repo runs. The API itself runs natively via
# `mise run dev` so that a code change rebuilds in seconds rather than through a
# Docker layer — see docs/contributing.md.

# Pinned, not derived: Compose otherwise names the project after the invoking
# directory, so a git worktree — where agents run the gate — becomes a second
# project whose database cannot bind the 29101 the first one already holds.
# Here rather than as COMPOSE_PROJECT_NAME in .mise.toml so a hand-typed
# `docker compose` resolves to the same project; `-p` still overrides it.
name: ond

services:
  db:
    image: postgres:18-alpine
    # 29101, not 5432: a Homebrew/Postgres.app server usually owns 5432, and
    # connect's Tilt forward owns 127.0.0.1:15432, which beats a container's
    # `*:15432` for `localhost` — pointing there silently reaches that cluster.
    # Every önd port lives in 29100–29199, a block nothing else here claims.
    ports:
      - "29101:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      # The `ond` database is created by `crates/migrate`, not here, so that
      # the one code path that provisions it is exercised on every fresh clone.
      POSTGRES_DB: postgres
    volumes:
      # `/var/lib/postgresql`, not the `/data` subdirectory that every Postgres
      # 17-and-earlier compose file uses. The 18 images place the cluster in a
      # major-version-specific subdirectory so `pg_upgrade --link` can run
      # without crossing a mount boundary, and mounting the old path makes the
      # entrypoint refuse to start.
      - db-data:/var/lib/postgresql
    healthcheck:
      # `mise run dev:db` waits on this, so `migrate` never races the server's
      # first-boot initdb.
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  db-data:
