# A cue names the passage only where the passage is the instruction.
# There is no mouth cue: a cue is said at the top of a breath already being
# taken, so "through your mouth" arrives halfway through it. `Passage.hint`
# still shows it on screen, and the written how-to keeps the mouth. The
# nostrils stay: there, the nostril is the whole instruction.

[cues.inhale]
text = "Breathe in"

[cues.exhale]
text = "Breathe out"

[cues.inhale-left-nostril]
text = "Breathe in through your left nostril"

[cues.inhale-right-nostril]
text = "Breathe in through your right nostril"

[cues.exhale-left-nostril]
text = "Breathe out through your left nostril"

[cues.exhale-right-nostril]
text = "Breathe out through your right nostril"

# One clip for both holds. They read alike in a sequence because the breath
# before a hold says which one it is.
[cues.hold]
text = "Hold"
say = "Hold."

# The short forms, for an ordinary phase too brief to fit the sentence. Bellows
# breath runs a second each way; the full cue overruns it, and a cue still
# speaking into the next phase is describing a breath nobody is taking.
[cues.short-in]
text = "In"
say = "In."

[cues.short-out]
text = "Out"
say = "Out."

# A sigh is one sentence spread across three phase boundaries. Separate clips
# let punctuation give each fragment the intonation it has in that sentence
# without changing the words shown on screen.
[cues.sigh-in]
text = "Breathe in"
say = "Breathe in,"

[cues.sigh-and-in]
text = "And in"
say = "And in,"

[cues.sigh-and-out]
text = "And breathe out"
say = "And breathe out."

# The playful register, for a route that asks for words a child can follow.
# Only the two nose breaths have one: the exercise this register exists for has
# no holds, and steering air through one nostril is not what "smell the flower"
# is for. Every other breath falls back to the plain cue, by
# `Breath.spoken(in:)`'s own rule.
[cues.inhale-playful]
text = "Smell the flower"

[cues.exhale-playful]
text = "Blow out the candle"
