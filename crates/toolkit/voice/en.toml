# What the English voices say, and who says it.
#
# One manifest per language, not per accent. `cues` is a property of the
# language and `variant` is a property of the voice, so an American and a
# British reader share one table of words rather than one each — the eleven
# sentences used to be written out twice, identically, and the second copy was
# a place one of them could quietly disagree with itself. `fr.toml` will want
# its own words; a French-Canadian voice inside it will not.
#
# The filename is documentation. Nothing derives from it: the render globs
# every `.toml` here, and a voice carries its own variant.
#
# `text` must match `Breath.instruction` and `PhaseKind.shortInstruction` in
# OndKit exactly. Nothing here enforces that — VoiceCoverageTests does, off the
# manifest rendered beside the clips, so a reworded cue fails the Swift suite
# rather than shipping audio that says the old thing.
#
# There are no phonemes here any more. The local model this replaced took
# phoneme ids rather than text, so the pronunciation of all eleven lines was
# authored by hand — and still came out saying "mouse" for "mouth", because an
# 82M model cannot hold a word-final /θ/. A hosted model reads English. If one
# of these is ever mispronounced, the fix is a pronunciation dictionary for that
# word, not a return to spelling out every line.

# Named here rather than in code, so trying another model is an edit and a
# re-render.
#
# Not v3, which is the expressive one, and expressive here means unrepeatable:
# the same "Breathe in" came back at 0.61s, 0.58s and 2.15s across three
# requests, and a cue that sometimes pauses in the middle is not a cue. Its
# `[calm]` audio tag made the spread worse rather than better. This model
# answers the same line within 0.03s of itself and says a word-final /θ/
# properly, which is the whole reason the local model was abandoned.
model = "eleven_multilingual_v2"

# `slug` is ours and becomes both the folder and the key a person's setting is
# stored as; `voice` is ElevenLabs' id. Keeping them apart is what lets a voice
# be swapped for a better one without moving a file or touching Swift — `title`
# and `variant` are carried through to voices.json and read as data by the
# picker.
#
# A slug is one voice's name and nothing more. It described the accent and the
# gender until a second British woman arrived, at which point the scheme had
# nothing left to say; a name cannot collide and needs no taxonomy to extend.
#
# `speed` is per-voice so the readers can be brought to one pace, not so they
# can all be given the same number — see Faye.
#
# Fill `voice` and `title` from `mise run voice:list`. A render refuses to start
# while one still says TODO, rather than spending a request to be told so.

[[voices]]
slug = "sarah"
voice = "EXAVITQu4vr4xnSDxMaL"
title = "Sarah"
variant = "en-US"
speed = 0.7
stability = 0.85

[[voices]]
slug = "brian"
voice = "nPczCjzI2devNBz1zQrb"
title = "Brian"
variant = "en-US"
speed = 0.7
stability = 0.85

# Reads at her own pace, where the others are slowed to 0.7. She is a meditation
# voice and already unhurried; asking for the floor on top of that took her
# longest cue to 3.9s against an authored phase of 4.0, which is a cue that fits
# only until it drifts.
[[voices]]
slug = "faye"
voice = "wOPou4MhRIYEqQHVxjmp"
title = "Faye"
variant = "en-GB"
speed = 1.0
stability = 0.85

[[voices]]
slug = "lily"
voice = "pFZP5JQG7iQjIQuC4Bku"
title = "Lily"
variant = "en-GB"
speed = 0.7
stability = 0.85

[[voices]]
slug = "george"
voice = "JBFqnCBsd6RMkjVDRZzb"
title = "George"
variant = "en-GB"
speed = 0.7
stability = 0.85

[cues.inhale]
text = "Breathe in"

[cues.inhale-mouth]
text = "Breathe in through your mouth"

[cues.inhale-left-nostril]
text = "Breathe in through your left nostril"

[cues.inhale-right-nostril]
text = "Breathe in through your right nostril"

[cues.exhale]
text = "Breathe out"

[cues.exhale-mouth]
text = "Breathe out through your mouth"

[cues.exhale-left-nostril]
text = "Breathe out through your left nostril"

[cues.exhale-right-nostril]
text = "Breathe out through your right nostril"

# One clip for both holds. They read alike in a sequence because the breath
# before a hold says which one it is — see `Breath.instruction`.
[cues.hold]
text = "Hold"
say = "Hold."

# The short forms, for a phase too brief to fit the sentence. Bellows breath
# runs a second each way and physiological sigh's top-up is shorter still; the
# full cue overruns both, and a cue still speaking into the next phase is
# describing a breath nobody is taking.
[cues.short-in]
text = "In"
say = "In."

[cues.short-out]
text = "Out"
say = "Out."
