# What the English voices say, and who says it.
#
# One manifest per language, not per accent. `cues` is a property of the
# language and `variant` is a property of the voice, so readers of different
# accents share one table of words rather than one each. `fr.toml` will want its
# own words; a French-Canadian voice inside it will not.
#
# The filename is documentation. Nothing derives from it: the render globs
# every `.toml` here, and a voice carries its own variant.
#
# `text` must match what OndKit says out loud for that breath — `Breath.spoken`
# and `PhaseKind.shortInstruction`. Nothing here enforces it; VoiceCoverageTests
# does, off the manifest rendered beside the clips, so a reworded cue fails the
# Swift suite rather than shipping audio that says the old thing.

# Named here rather than in code, so trying another model is an edit and a
# re-render.
#
# Not v3, which is the expressive one, and expressive here means unrepeatable:
# the same "Breathe in" came back at 0.61s, 0.58s and 2.15s across three
# requests, and a cue that sometimes pauses in the middle is not a cue. Its
# `[calm]` audio tag made the spread worse rather than better. This model
# answers the same line within 0.03s of itself and says a word-final /θ/
# properly, which is the whole reason the local model was abandoned.
model = "eleven_multilingual_v2"

# `slug` is ours and becomes both the folder and the key a person's setting is
# stored as; `voice` is ElevenLabs' id. Keeping them apart is what lets a voice
# be swapped for a better one without moving a file or touching Swift — `title`
# and `variant` are carried through to voices.json and read as data.
#
# Eight readers across four Englishes, chosen for the same quality rather than
# for range: a voice that sits under somebody's breathing rather than over it.
# The ones passed over read well, which is the wrong thing to be good at here —
# a cue is not a performance, and a strong reader turns a phase into something
# to listen to.
#
# Listed grouped by `variant` because that is the order the picker shows them
# in, so the file reads as the roster. Nothing derives from the order; the app
# sorts `voices.json` itself.
#
# Fill `voice` and `title` from `mise run voice:list`. A render refuses to start
# while one still says TODO, rather than spending a request to be told so.
#
# `speed` is per-voice because the readers do not arrive at one pace and the
# ceiling is fixed: alternate-nostril breathing's authored 4.0s phase has to
# hold "Breathe in through your left nostril", and a voice whose longest cue
# overruns it loses the nostril the exercise is named for. George is asked for
# the service's 0.7 floor; the meditation voices are already unhurried and
# reading them slower only crowded that ceiling.

# `default = true` marks the voice a fresh install breathes to, and exactly one
# voice must carry it — checked by the render rather than left to the app, so
# "which voice do people hear first" is answered in the same file that decides
# who the voices are.
[[voices]]
slug = "faye"
voice = "wOPou4MhRIYEqQHVxjmp"
title = "Faye"
variant = "en-GB"
default = true
speed = 1.0
stability = 0.85

[[voices]]
slug = "george"
voice = "JBFqnCBsd6RMkjVDRZzb"
title = "George"
variant = "en-GB"
speed = 0.7
stability = 0.85

[[voices]]
slug = "elias"
voice = "3QVvVdqGS5CuBZBQGuar"
title = "Elias"
variant = "en-CA"
speed = 1.0
stability = 0.85

[[voices]]
slug = "simran"
voice = "P0TQBmxaqqw6qfDmK2xb"
title = "Simran"
variant = "en-IN"
speed = 1.0
stability = 0.85

[[voices]]
slug = "anna"
voice = "7HfCp66bLqlkSw1ebj0I"
title = "Anna"
variant = "en-US"
speed = 1.0
stability = 0.85

[[voices]]
