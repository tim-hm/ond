# A cue names the passage only where the passage is the instruction.
#
# There is no mouth cue. "Breathe out through your mouth" is a true sentence and
# the wrong thing to hear: a cue is said at the top of a breath somebody is
# already taking, and by the time it reaches "through your mouth" they are
# halfway through it. The written how-to keeps the mouth, because that is read
# before the exercise starts and the two sighs turn on it — a long audible mouth
# exhale is what makes a sigh one. On screen the passage is a separate line, so
# the mouth is still named while somebody is breathing it; `Passage.hint` shows
# it there for the same reason it shows the nostrils. Out loud, it is "Breathe
# out" — see `Breath.spoken`.
#
# The nostrils stay, because alternate-nostril breathing cannot be done without
# them: there, which nostril *is* the whole instruction rather than a detail
# about it.

[cues.inhale]
text = "Breathe in"

[cues.exhale]
text = "Breathe out"

[cues.inhale-left-nostril]
text = "Breathe in through your left nostril"

[cues.inhale-right-nostril]
text = "Breathe in through your right nostril"

[cues.exhale-left-nostril]
text = "Breathe out through your left nostril"

[cues.exhale-right-nostril]
text = "Breathe out through your right nostril"

# One clip for both holds. They read alike in a sequence because the breath
# before a hold says which one it is.
[cues.hold]
text = "Hold"
say = "Hold."

# The short forms, for a phase too brief to fit the sentence. Bellows breath
# runs a second each way and the physiological sigh's top-up is shorter still;
# the full cue overruns both, and a cue still speaking into the next phase is
# describing a breath nobody is taking.
[cues.short-in]
text = "In"
say = "In."

[cues.short-out]
text = "Out"
say = "Out."

# The physiological sigh stacks a second, smaller inhale on the first, and both
# are too brief for anything but a word — so both were "In", which says nothing
# about the one being a sip on top of the other. "More" is the whole
# instruction for a breath that continues one already taken.
[cues.short-more]
text = "More"
say = "More."

# The playful register, for a route that asks for words a child can follow.
# Only the two nose breaths have one: a hold has no playful form because the
# exercise this register exists for has no holds, and steering air through one
# nostril is not what "smell the flower" is for. Every other breath falls back
# to the plain cue, which is `Breath.spoken(in:)`'s own rule rather than a
# second one kept here.
[cues.inhale-playful]
text = "Smell the flower"

[cues.exhale-playful]
text = "Blow out the candle"
