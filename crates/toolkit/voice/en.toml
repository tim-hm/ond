# What the English voices say, and who says it.
#
# One manifest per language, not per accent. `cues` is a property of the
# language and `variant` is a property of the voice, so readers of different
# accents share one table of words rather than one each. `fr.toml` will want its
# own words; a French-Canadian voice inside it will not.
#
# The filename is documentation. Nothing derives from it: the render globs
# every `.toml` here, and a voice carries its own variant.
#
# `text` must match what OndKit says out loud for that breath — `Breath.spoken`
# and `PhaseKind.shortInstruction`. Nothing here enforces it; VoiceCoverageTests
# does, off the manifest rendered beside the clips, so a reworded cue fails the
# Swift suite rather than shipping audio that says the old thing.

# Named here rather than in code, so trying another model is an edit and a
# re-render.
#
# Not v3, which is the expressive one, and expressive here means unrepeatable:
# the same "Breathe in" came back at 0.61s, 0.58s and 2.15s across three
# requests, and a cue that sometimes pauses in the middle is not a cue. Its
# `[calm]` audio tag made the spread worse rather than better. This model
# answers the same line within 0.03s of itself and says a word-final /θ/
# properly, which is the whole reason the local model was abandoned.
model = "eleven_multilingual_v2"

# `slug` is ours and becomes both the folder and the key a person's setting is
# stored as; `voice` is ElevenLabs' id. Keeping them apart is what lets a voice
# be swapped for a better one without moving a file or touching Swift — `title`
# and `variant` are carried through to voices.json and read as data.
#
# Two readers, both British, chosen by ear from five. The three dropped were
# strong voices — good at reading, which is the wrong thing to be good at when
# the words are meant to sit under somebody's breathing rather than over it.
#
# Fill `voice` and `title` from `mise run voice:list`. A render refuses to start
# while one still says TODO, rather than spending a request to be told so.

# `default = true` marks the voice a fresh install breathes to, and exactly one
# voice must carry it — checked by the render rather than left to the app, so
# "which voice do people hear first" is answered in the same file that decides
# who the voices are.
#
# She reads at her own pace where the others were slowed to 0.7: a meditation
# voice, already unhurried, and asking for the floor on top of that took her
# longest cue to 3.9s against an authored phase of 4.0. `speed` is per-voice so
# the readers can be brought to one pace, not so they can all be given the same
# number.
[[voices]]
slug = "faye"
voice = "wOPou4MhRIYEqQHVxjmp"
title = "Faye"
variant = "en-GB"
default = true
speed = 1.0
stability = 0.85

[[voices]]
slug = "george"
voice = "JBFqnCBsd6RMkjVDRZzb"
title = "George"
variant = "en-GB"
speed = 0.7
stability = 0.85

# A cue names the passage only where the passage is the instruction.
#
# There is no mouth cue. "Breathe out through your mouth" is a true sentence and
# the wrong thing to hear: a cue is said at the top of a breath somebody is
# already taking, and by the time it reaches "through your mouth" they are
# halfway through it. The written how-to keeps the mouth, because that is read
# before the exercise starts and 4-7-8 turns on it. Out loud, it is "Breathe
# out" — see `Breath.spoken`.
#
# The nostrils stay, because alternate-nostril breathing cannot be done without
# them: there, which nostril *is* the whole instruction rather than a detail
# about it.

[cues.inhale]
text = "Breathe in"

[cues.exhale]
text = "Breathe out"

[cues.inhale-left-nostril]
text = "Breathe in through your left nostril"

[cues.inhale-right-nostril]
text = "Breathe in through your right nostril"

[cues.exhale-left-nostril]
text = "Breathe out through your left nostril"

[cues.exhale-right-nostril]
text = "Breathe out through your right nostril"

# One clip for both holds. They read alike in a sequence because the breath
# before a hold says which one it is.
[cues.hold]
text = "Hold"
say = "Hold."

# The short forms, for a phase too brief to fit the sentence. Bellows breath
# runs a second each way and the physiological sigh's top-up is shorter still;
# the full cue overruns both, and a cue still speaking into the next phase is
# describing a breath nobody is taking.
[cues.short-in]
text = "In"
say = "In."

[cues.short-out]
text = "Out"
say = "Out."

# The physiological sigh stacks a second, smaller inhale on the first, and both
# are too brief for anything but a word — so both were "In", which says nothing
# about the one being a sip on top of the other. "More" is the whole
# instruction for a breath that continues one already taken.
[cues.short-more]
text = "More"
say = "More."

# The playful register, for a route that asks for words a child can follow.
# Only the two nose breaths have one: a hold has no playful form because the
# exercise this register exists for has no holds, and steering air through one
# nostril is not what "smell the flower" is for. Every other breath falls back
# to the plain cue, which is `Breath.spoken(in:)`'s own rule rather than a
# second one kept here.
[cues.inhale-playful]
text = "Smell the flower"

[cues.exhale-playful]
text = "Blow out the candle"
