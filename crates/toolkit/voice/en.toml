# What the English voices say, and who says it. One manifest per language, not
# per accent: `cues` belongs to the language and `variant` to the voice. `text`
# must match `Breath.spoken` and `PhaseKind.shortInstruction`, which
# VoiceCoverageTests enforces off the manifest rendered beside the clips.
# See docs/voice.md.

# Named here rather than in code, so trying another model is an edit and a
# re-render. Not v3, the expressive one: the same "Breathe in" came back at
# 0.61s, 0.58s and 2.15s across three requests. This model answers within 0.03s
# of itself and says a word-final /θ/ properly. See docs/voice.md.
model = "eleven_multilingual_v2"

# `slug` is ours and becomes the folder and the stored setting; `voice` is
# ElevenLabs' id. Grouped by `variant` for reading only — the app sorts
# voices.json itself. Fill `voice` and `title` from `mise run voice:list`; a
# render refuses to start while one still says TODO. docs/voice.md holds how the
# roster was chosen and why `speed` is per voice.

# `default = true` marks the voice a fresh install breathes to, and exactly one
# voice must carry it — checked by the render rather than left to the app, so
# "which voice do people hear first" is answered in the same file that decides
# who the voices are.
[[voices]]
slug = "faye"
voice = "wOPou4MhRIYEqQHVxjmp"
title = "Faye"
variant = "en-GB"
default = true
speed = 1.0
stability = 0.85

[[voices]]
slug = "george"
voice = "JBFqnCBsd6RMkjVDRZzb"
title = "George"
variant = "en-GB"
speed = 0.7
stability = 0.85

