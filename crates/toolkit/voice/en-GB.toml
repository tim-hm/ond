# What the British voices say. The header of en-US.toml explains the format;
# this file differs from it only in the voices, never in the words.

variant = "en-GB"
model = "eleven_multilingual_v2"

# Read at her own pace, where the others are slowed to 0.7. She is a meditation
# voice and already unhurried; asking for the floor on top of that took her
# longest cue to 3.9s against an authored phase of 4.0, which is a cue that fits
# only until it drifts. `speed` is per-voice so the four can be brought to one
# pace, not so they can all be given the same number.
[[voices]]
slug = "faye"
voice = "wOPou4MhRIYEqQHVxjmp"
title = "Faye"
speed = 1.0
stability = 0.85

[[voices]]
slug = "lily"
voice = "pFZP5JQG7iQjIQuC4Bku"
title = "Lily"
speed = 0.7
stability = 0.85

[[voices]]
slug = "george"
voice = "JBFqnCBsd6RMkjVDRZzb"
title = "George"
speed = 0.7
stability = 0.85

[cues.inhale]
text = "Breathe in"

[cues.inhale-mouth]
text = "Breathe in through your mouth"

[cues.inhale-left-nostril]
text = "Breathe in through your left nostril"

[cues.inhale-right-nostril]
text = "Breathe in through your right nostril"

[cues.exhale]
text = "Breathe out"

[cues.exhale-mouth]
text = "Breathe out through your mouth"

[cues.exhale-left-nostril]
text = "Breathe out through your left nostril"

[cues.exhale-right-nostril]
text = "Breathe out through your right nostril"

[cues.hold]
text = "Hold"
say = "Hold."

[cues.short-in]
text = "In"
say = "In."

[cues.short-out]
text = "Out"
say = "Out."
