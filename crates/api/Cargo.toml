[package]
name = "api"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
# Proprietary — never meant for crates.io, so fence off `cargo publish`.
publish = false

[dependencies]
anyhow.workspace = true
aws-config.workspace = true
aws-credential-types.workspace = true
aws-sdk-bedrockruntime.workspace = true
aws-smithy-http-client.workspace = true
axum.workspace = true
base64.workspace = true
chrono.workspace = true
http-body.workspace = true
log.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
# The blackout rule's numbers, shared with `migrate` — see that crate's doc for
# why a leaf is the only shape a dependency between these two can take.
physiology = { path = "../physiology" }
prost.workspace = true
prost-types.workspace = true
reqwest.workspace = true
ring.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tonic.workspace = true
tonic-prost.workspace = true
tonic-reflection.workspace = true
tonic-web.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
x509-parser.workspace = true

[dev-dependencies]
# Builds trailer-bearing unary and streaming bodies for the native status tests.
http-body-util.workspace = true
# The integration harness creates its disposable database through the same
# functions `mise run migrate` uses, so the schema under test is the real one.
migrate = { path = "../migrate" }
# `test-util` for the paused clock, which is what lets the census budget be
# tested in microseconds rather than by sleeping through it. A dev-dependency
# rather than a feature on the real one, so the pausable clock cannot reach a
# production build.
tokio = { workspace = true, features = ["test-util"] }
tower.workspace = true

[build-dependencies]
chrono.workspace = true
tonic-prost-build.workspace = true

# `cargo machete` reads only crate source, not code generated into OUT_DIR, so
# it flags the dependencies that only the generated protobuf module uses (prost
# derives, `tonic_prost::ProstCodec`, and build.rs's tonic-prost-build).
# Re-verify by removing one and running `cargo build -p api` before assuming
# this list is stale.
[package.metadata.cargo-machete]
ignored = ["prost", "tonic-prost", "tonic-prost-build"]

[lints]
workspace = true
