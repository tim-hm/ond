# Formatting, linting, and the drift checks that need no database — the fast
# slice of the gate. Tests and the SQLx cache check stay local
# (`mise run check`) until CI grows a database.
name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # check:proto's breaking-change check diffs against `main`'s history,
          # which a shallow clone doesn't carry.
          fetch-depth: 0
      # A pull_request checkout is a detached HEAD with no local `main`, and both
      # check:proto and check:migrations deliberately fail closed when `main`
      # doesn't resolve.
      - run: git rev-parse --verify --quiet main || git fetch origin main:main
      - uses: jdx/mise-action@v2
      - run: mise run check:rs
      - run: mise run check:proto
      - run: mise run check:migrations
      - run: mise run check:text
      - run: mise run check:md
      - run: mise run check:doc-links

  lint-swift:
    # macos-26 for the Xcode it ships: `check:diagrams` builds the package,
    # whose manifest (`swift-tools-version: 6.2`, platforms `.v26`) an older
    # image's Xcode cannot parse — and the failure lands at manifest parsing
    # rather than anywhere informative. `check:swift` alone compiles nothing,
    # which is why macos-15 was fine before.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          # Only the tools these tasks run — skips the Rust toolchain, which
          # costs real minutes on the 10x-billed macOS runner. `vp` formats the
          # HTML check:diagrams writes; the Swift compiler comes from the
          # runner's Xcode. The spm entries build the two protoc plugins
          # `check:generated` runs from source, so they must be named.
          install_args: swiftformat swiftlint vp buf protoc spm:apple/swift-protobuf spm:connectrpc/connect-swift
      - run: mise run check:swift
        env:
          # Without this, `mise run` auto-installs every tool in .mise.toml,
          # defeating the selective install above.
          MISE_AUTO_INSTALL: "false"
      # Asserts the committed Swift client still matches `proto/`. Here rather
      # than on the Linux job because its plugins are built with the runner's
      # Swift toolchain, the same reason check:diagrams rides this job.
      - run: mise run check:generated
        env:
          MISE_AUTO_INSTALL: "false"
      # The only automatic check that the marketing site's figures still match
      # the geometry the apps draw. It needs a Swift toolchain, which is why it
      # rides this job rather than the Linux one and cannot join `mise run check`.
      - run: mise run check:diagrams
        env:
          MISE_AUTO_INSTALL: "false"
