#cloud-config
# First-boot setup only. Everything that changes per release — the image, the
# compose file, the Caddyfile — arrives via `mise run deploy:api`, so this file
# never needs to change to ship code, and the instance never needs replacing to
# pick a release up.

package_update: true
packages:
  - docker.io
  - docker-compose-v2
  - curl

# The backup cron moved out of here on purpose: this file runs once, at first
# boot, so a fix could only reach a machine that did not need it yet —
# first-boot drift is how the nightly dump pointed at the wrong database for
# eight days. `mise run deploy:api` now installs /etc/cron.d/ond on every
# deploy, and removes the old ond-backup a pre-change box would run alongside.

runcmd:
  - usermod -aG docker ubuntu
  # rsync target for the deploy tasks.
  - install -d -o ubuntu -g ubuntu /srv/ond
  # The tailnet first — it and SSM are the only shell routes — and a failure
  # is reported rather than fatal: a bare `set -e` would also govern every
  # block below and leave the data volume unmounted. The key and version are
  # pinned, the key trusted only after its reviewed SHA-256 matches. No `-x`:
  # the auth key would land in the console log `aws ec2 get-console-output` reads.
  - |
    (
      set -eu
      tailscale_key=/usr/share/keyrings/tailscale-archive-keyring.gpg
      tailscale_key_download="$tailscale_key.download"
      tailscale_key_sha256=3e03dacf222698c60b8e2f990b809ca1b3e104de127767864284e6c228f1fb39
      tailscale_version=1.98.10

      install -d -m 0755 /usr/share/keyrings
      curl -fsSL https://pkgs.tailscale.com/stable/ubuntu/noble.noarmor.gpg \
        -o "$tailscale_key_download"
      printf '%s  %s\n' "$tailscale_key_sha256" "$tailscale_key_download" \
        | sha256sum --check --status
      install -m 0644 "$tailscale_key_download" "$tailscale_key"
      rm -f "$tailscale_key_download"
      printf '%s\n' \
        'deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg] https://pkgs.tailscale.com/stable/ubuntu noble main' \
        > /etc/apt/sources.list.d/tailscale.list
      apt-get update
      apt-get install -y --no-install-recommends "tailscale=$tailscale_version"
      apt-mark hold tailscale

      # --accept-dns=false: Docker copies the host resolver into containers, so
      # MagicDNS would front the API and Postgres with 100.100.100.100. No
      # --advertise-tags: the key carries `tag:server`, and a tag named twice
      # can disagree — Tailscale refuses to register. --ssh claims port 22, so
      # the ACL needs an `accept` (not `check`) ssh rule — docs/deployment.md.
      tailscale up \
        --auth-key='${tailscale_auth_key}' \
        --hostname='${tailscale_hostname}' \
        --accept-dns=false \
        --ssh

      # Grafana at 18104, tailnet-only: the container publishes 3000 on
      # loopback, so this proxy is the entire route to it. --https=18104 has
      # already caused an outage — serve defaults to 443, inside Caddy's
      # 0.0.0.0:443 bind, and Caddy losing that bind kills the public site while
      # every on-box health check passes. Set here so a rebuilt box is reachable.
      tailscale serve --bg --https=18104 3000
    ) || echo 'cloud-init: the tailnet join failed — the box is reachable only through SSM Session Manager; see docs/deployment.md' >&2
  # `set -e` is not the default here: without it a failed device probe carries on
  # into mkfs with an empty argument, which is exactly how this silently produced
  # a /srv/data on the root volume the first time.
  - |
    set -eux
    # The attachment is a separate resource and can land after first boot begins.
    for _ in $(seq 1 60); do
      if [ -e "${data_device}" ]; then break; fi
      sleep 2
    done
    test -e "${data_device}"
    # blkid finds nothing only on a never-formatted volume — this can never
    # reformat data.
    blkid "${data_device}" || mkfs.ext4 -L ond-data "${data_device}"
    printf 'LABEL=ond-data /srv/data ext4 defaults,nofail 0 2\n' >> /etc/fstab
    install -d /srv/data
    # `nofail` in fstab means `mount -a` shrugs off a label udev has not published
    # yet, so settle first and assert afterwards. A silent miss here puts Postgres
    # on the root volume, where replacing the instance destroys it.
    udevadm settle
    mount -a
    mountpoint -q /srv/data
  # The database password lives on the data volume, not the instance: Postgres
  # keeps its own hash inside the cluster files, so a regenerated password on a
  # fresh instance would strand the existing data. The symlink is where Docker
  # Compose picks it up for interpolation.
  - |
    set -eux
    if [ ! -f /srv/data/ond.env ]; then
      # Two leaks, closed in one subshell. `set +x` first, because xtrace
      # expands the command substitution and writes the password to the console
      # log `aws ec2 get-console-output` reads — the reason the tailnet block
      # above runs without `-x`. Then `umask`, so the mode is right before any
      # content lands rather than at the `chmod` two lines below.
      (set +x; umask 077; printf 'POSTGRES_PASSWORD=%s\n' "$(openssl rand -hex 24)" > /srv/data/ond.env)
    fi
    # Owned by ubuntu, not root: `mise run deploy:api` runs docker compose over SSH as
    # ubuntu, and compose reads this file itself to interpolate the password. Root
    # ownership makes that a permission error rather than a missing variable.
    # Outside the `if` so replacing the instance repairs an existing volume too.
    chown ubuntu:ubuntu /srv/data/ond.env
    chmod 600 /srv/data/ond.env
    ln -sf /srv/data/ond.env /srv/ond/.env
  # Ubuntu 24.04 dropped the awscli deb; the snap is Canonical's replacement and
  # the only packaged aarch64 build. Last because a snap store hiccup must not
  # take the data volume down with it, and the backup cron that needs this does
  # not run until 02:17.
  - snap install aws-cli --classic
