#cloud-config
# First-boot setup only. Everything that changes per release — the image, the
# compose file, the Caddyfile — arrives via `mise run deploy:api`, so this file
# never needs to change to ship code, and the instance never needs replacing to
# pick a release up.

package_update: true
packages:
  - docker.io
  - docker-compose-v2
  - curl

# The backup cron used to live here, and moving it out is the point rather than
# a tidy-up. This file runs once, at first boot, and never again — so the box
# kept whatever crontab it was born with, and a fix could only ever reach a
# machine that did not need it yet. That is not a hypothetical failure mode:
# first-boot drift is how the nightly dump pointed at the wrong database for
# eight days, uploading a valid gzip of nothing every night while the 30-day
# lifecycle rotated the last good backup out from underneath it.
#
# `mise run deploy:api` now installs /etc/cron.d/ond from infra/box/cron.d/ond.tmpl
# on every deploy, so the schedule on the box cannot drift from the repository.
# The deploy also removes this file's old /etc/cron.d/ond-backup, because a box
# provisioned before that change would otherwise run both.

runcmd:
  - usermod -aG docker ubuntu
  # rsync target for the deploy tasks.
  - install -d -o ubuntu -g ubuntu /srv/ond
  # The tailnet, first, because it is the door. The security group opens 80 and
  # 443 and nothing else, so from here on the only ways to a shell are this and
  # SSM — and a box that finishes every other step but not this one is a box
  # only SSM can reach. Better to know that at the top of the log.
  #
  # Tailscale's Noble repository, key and package version are all explicit. The
  # downloaded key is trusted only after its reviewed SHA-256 matches; apt then
  # verifies the signed repository metadata and package hash through that key.
  # A key rotation or release therefore stops the next box until this file is
  # deliberately updated instead of executing whatever an installer URL serves.
  #
  # No `-x` in the `set` below, unlike every other block in this file. The auth
  # key is an argument, a trace of it lands in the serial console log, and
  # `aws ec2 get-console-output` reads that from outside the box — turning a
  # secret that at least needed code running on the instance into one that needs
  # only an AWS credential.
  #
  # A subshell, and a failure that is reported rather than fatal. runcmd is one
  # script, so a bare `set -e` here would also govern every block below it, and
  # a single unreachable moment on pkgs.tailscale.com would then leave the data
  # volume unmounted — trading a box that is merely unreachable for one that is
  # unreachable *and* has Postgres pointed at the root disk. Being on the
  # tailnet is worth going first for; it is not worth the rest of the boot.
  - |
    (
      set -eu
      tailscale_key=/usr/share/keyrings/tailscale-archive-keyring.gpg
      tailscale_key_download="$tailscale_key.download"
      tailscale_key_sha256=3e03dacf222698c60b8e2f990b809ca1b3e104de127767864284e6c228f1fb39
      tailscale_version=1.98.10

      install -d -m 0755 /usr/share/keyrings
      curl -fsSL https://pkgs.tailscale.com/stable/ubuntu/noble.noarmor.gpg \
        -o "$tailscale_key_download"
      printf '%s  %s\n' "$tailscale_key_sha256" "$tailscale_key_download" \
        | sha256sum --check --status
      install -m 0644 "$tailscale_key_download" "$tailscale_key"
      rm -f "$tailscale_key_download"
      printf '%s\n' \
        'deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg] https://pkgs.tailscale.com/stable/ubuntu noble main' \
        > /etc/apt/sources.list.d/tailscale.list
      apt-get update
      apt-get install -y --no-install-recommends "tailscale=$tailscale_version"
      apt-mark hold tailscale

      # --accept-dns=false leaves /etc/resolv.conf alone. Nothing on this box
      # ever resolves another tailnet node — the traffic goes the other way —
      # and Docker copies the host's resolver into every container it starts, so
      # accepting MagicDNS would quietly put 100.100.100.100 in front of the API
      # and Postgres in exchange for nothing.
      #
      # No --advertise-tags: the auth key carries `tag:server` (see the
      # variable's description), and a tag named in both places is a pair that
      # can disagree, which Tailscale answers by refusing to register at all.
      #
      # --ssh moves the authority for who may log in from authorized_keys to
      # the tailnet's ACL, and it is not additive: Tailscale SSH claims port 22
      # on the tailnet address, and a connection no `ssh` rule matches is
      # refused rather than passed down to sshd. So the policy file is now a
      # deploy dependency — an `ssh` rule whose dst covers `tag:server` and
      # whose users include `ubuntu`, with action `accept` rather than `check`,
      # because `check` wants a browser and deploy opens several sessions in a
      # row with nobody watching. docs/deployment.md carries the rule itself.
      tailscale up \
        --auth-key='${tailscale_auth_key}' \
        --hostname='${tailscale_hostname}' \
        --accept-dns=false \
        --ssh

      # Grafana, at https://<this node>:18104/ on the tailnet and nowhere else.
      # The container publishes 3000 on loopback only, so this proxy is the
      # entire route to it: no security group rule admits the dashboard, and
      # none is asked for. Tailscale terminates TLS with a certificate it issues
      # for the node's own name, which is why the dashboard is HTTPS without
      # Caddy or ACME being involved.
      #
      # --https=18104 is load-bearing and this is the one line here that has
      # already caused an outage. `tailscale serve` defaults to 443, which it
      # binds on the tailnet address — and Docker publishes Caddy on 0.0.0.0:443,
      # which includes that address. The two cannot both have it: Caddy loses the
      # bind, comes up attached to no network, and the public site stops
      # answering while every health check that runs on the box says the
      # container is up. 18104 is the next free number in this repo's block (see
      # the port table in docs/contributing.md).
      #
      # Set here as well as being persistent state, because a rebuilt box would
      # otherwise come up on the tailnet with the dashboard unreachable and
      # nothing saying why. Needs Serve enabled for the tailnet, which also
      # provisions the certificate; without it this line fails and the join above
      # still stands.
      tailscale serve --bg --https=18104 3000
    ) || echo 'cloud-init: the tailnet join failed — the box is reachable only through SSM Session Manager; see docs/deployment.md' >&2
  # `set -e` is not the default here: without it a failed device probe carries on
  # into mkfs with an empty argument, which is exactly how this silently produced
  # a /srv/data on the root volume the first time.
  - |
    set -eux
    # The attachment is a separate resource and can land after first boot begins.
    for _ in $(seq 1 60); do
      if [ -e "${data_device}" ]; then break; fi
      sleep 2
    done
    test -e "${data_device}"
    # blkid finds nothing only on a never-formatted volume — this can never
    # reformat data.
    blkid "${data_device}" || mkfs.ext4 -L ond-data "${data_device}"
    printf 'LABEL=ond-data /srv/data ext4 defaults,nofail 0 2\n' >> /etc/fstab
    install -d /srv/data
    # `nofail` in fstab means `mount -a` shrugs off a label udev has not published
    # yet, so settle first and assert afterwards. A silent miss here puts Postgres
    # on the root volume, where replacing the instance destroys it.
    udevadm settle
    mount -a
    mountpoint -q /srv/data
  # The database password lives on the data volume, not the instance: Postgres
  # keeps its own hash inside the cluster files, so a regenerated password on a
  # fresh instance would strand the existing data. The symlink is where Docker
  # Compose picks it up for interpolation.
  - |
    set -eux
    if [ ! -f /srv/data/ond.env ]; then
      printf 'POSTGRES_PASSWORD=%s\n' "$(openssl rand -hex 24)" > /srv/data/ond.env
    fi
    # Owned by ubuntu, not root: `mise run deploy:api` runs docker compose over SSH as
    # ubuntu, and compose reads this file itself to interpolate the password. Root
    # ownership makes that a permission error rather than a missing variable.
    # Outside the `if` so replacing the instance repairs an existing volume too.
    chown ubuntu:ubuntu /srv/data/ond.env
    chmod 600 /srv/data/ond.env
    ln -sf /srv/data/ond.env /srv/ond/.env
  # Ubuntu 24.04 dropped the awscli deb; the snap is Canonical's replacement and
  # the only packaged aarch64 build. Last because a snap store hiccup must not
  # take the data volume down with it, and the backup cron that needs this does
  # not run until 02:17.
  - snap install aws-cli --classic
