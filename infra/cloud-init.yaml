#cloud-config
# First-boot setup only. Everything that changes per release — the image, the
# compose file, the Caddyfile — arrives via `mise run deploy`, so this file
# never needs to change to ship code, and the instance never needs replacing to
# pick a release up.

package_update: true
packages:
  - docker.io
  - docker-compose-v2
  - curl

write_files:
  # Nightly dump straight to S3 — credentials come from the instance profile,
  # never from a key on disk. Restore procedure lives in docs/deployment.md.
  - path: /etc/cron.d/ond-backup
    content: |
      AWS_DEFAULT_REGION=${region}
      PATH=/usr/local/bin:/usr/bin:/bin:/snap/bin
      17 2 * * * root docker compose -f /srv/ond/compose.yaml exec -T db pg_dump -U postgres ond | gzip | aws s3 cp - s3://${backup_bucket}/ond-$(date +\%F).sql.gz

runcmd:
  - usermod -aG docker ubuntu
  # rsync target for `mise run deploy`.
  - install -d -o ubuntu -g ubuntu /srv/ond
  # The tailnet, first, because it is the door. The security group opens 80 and
  # 443 and nothing else, so from here on the only ways to a shell are this and
  # SSM — and a box that finishes every other step but not this one is a box
  # only SSM can reach. Better to know that at the top of the log.
  #
  # Tailscale's own installer, which is what every ingress box in the sibling
  # infra repository uses. It configures the signed apt repository and installs
  # from it, so apt verifies the archive and unattended-upgrades keeps the
  # client current without anything here running again — all of which spelling
  # the repository out inline would also buy. What it adds is the release
  # codename read from /etc/os-release rather than pinned here, where a pin is
  # a join that breaks on the first AMI past this Ubuntu and says nothing.
  #
  # No `-x` in the `set` below, unlike every other block in this file. The auth
  # key is an argument, a trace of it lands in the serial console log, and
  # `aws ec2 get-console-output` reads that from outside the box — turning a
  # secret that at least needed code running on the instance into one that needs
  # only an AWS credential.
  #
  # A subshell, and a failure that is reported rather than fatal. runcmd is one
  # script, so a bare `set -e` here would also govern every block below it, and
  # a single unreachable moment on pkgs.tailscale.com would then leave the data
  # volume unmounted — trading a box that is merely unreachable for one that is
  # unreachable *and* has Postgres pointed at the root disk. Being on the
  # tailnet is worth going first for; it is not worth the rest of the boot.
  - |
    (
      set -eu
      curl -fsSL https://tailscale.com/install.sh | sh
      # --accept-dns=false leaves /etc/resolv.conf alone. Nothing on this box
      # ever resolves another tailnet node — the traffic goes the other way —
      # and Docker copies the host's resolver into every container it starts, so
      # accepting MagicDNS would quietly put 100.100.100.100 in front of the API
      # and Postgres in exchange for nothing.
      #
      # No --advertise-tags: the auth key carries `tag:server` (see the
      # variable's description), and a tag named in both places is a pair that
      # can disagree, which Tailscale answers by refusing to register at all.
      #
      # No --ssh either. Deploy authenticates with the operator's key through
      # OpenSSH, and Tailscale SSH would be a second way in, governed by ACLs
      # rather than by authorized_keys, with nothing in this repo describing it.
      tailscale up \
        --auth-key='${tailscale_auth_key}' \
        --hostname='${tailscale_hostname}' \
        --accept-dns=false
    ) || echo 'cloud-init: the tailnet join failed — the box is reachable only through SSM Session Manager; see docs/deployment.md' >&2
  # `set -e` is not the default here: without it a failed device probe carries on
  # into mkfs with an empty argument, which is exactly how this silently produced
  # a /srv/data on the root volume the first time.
  - |
    set -eux
    # The attachment is a separate resource and can land after first boot begins.
    for _ in $(seq 1 60); do
      if [ -e "${data_device}" ]; then break; fi
      sleep 2
    done
    test -e "${data_device}"
    # blkid finds nothing only on a never-formatted volume — this can never
    # reformat data.
    blkid "${data_device}" || mkfs.ext4 -L ond-data "${data_device}"
    printf 'LABEL=ond-data /srv/data ext4 defaults,nofail 0 2\n' >> /etc/fstab
    install -d /srv/data
    # `nofail` in fstab means `mount -a` shrugs off a label udev has not published
    # yet, so settle first and assert afterwards. A silent miss here puts Postgres
    # on the root volume, where replacing the instance destroys it.
    udevadm settle
    mount -a
    mountpoint -q /srv/data
  # The database password lives on the data volume, not the instance: Postgres
  # keeps its own hash inside the cluster files, so a regenerated password on a
  # fresh instance would strand the existing data. The symlink is where Docker
  # Compose picks it up for interpolation.
  - |
    set -eux
    if [ ! -f /srv/data/ond.env ]; then
      printf 'POSTGRES_PASSWORD=%s\n' "$(openssl rand -hex 24)" > /srv/data/ond.env
    fi
    # Owned by ubuntu, not root: `mise run deploy` runs docker compose over SSH as
    # ubuntu, and compose reads this file itself to interpolate the password. Root
    # ownership makes that a permission error rather than a missing variable.
    # Outside the `if` so replacing the instance repairs an existing volume too.
    chown ubuntu:ubuntu /srv/data/ond.env
    chmod 600 /srv/data/ond.env
    ln -sf /srv/data/ond.env /srv/ond/.env
  # Ubuntu 24.04 dropped the awscli deb; the snap is Canonical's replacement and
  # the only packaged aarch64 build. Last because a snap store hiccup must not
  # take the data volume down with it, and the backup cron that needs this does
  # not run until 02:17.
  - snap install aws-cli --classic
