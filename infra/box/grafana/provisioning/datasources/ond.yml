# Provisioned rather than clicked. Grafana reads this at boot, so the one on
# the box and the one in this repository cannot drift — and a rebuilt box has
# its datasource before anybody opens it.
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    # Fixed rather than generated, because the dashboard JSON names it. A uid
    # Grafana invented at first boot would differ on a rebuilt box, and every
    # panel would come up "datasource not found".
    uid: ond-prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    # Matches prometheus.yml's scrape_interval, so the graphs do not ask for
    # resolution the data does not have.
    jsonData:
      timeInterval: 15s
      # Lists alerts.yml's rules under Grafana's Alerting page; they are
      # datasource-managed, so without this the Alerting UI shows nothing and
      # a rule's state only exists at Prometheus on 29105. The dashboard's
      # Firing panel reads the ALERTS series directly instead — the alertlist
      # panel only renders Grafana-managed rules and would sit empty for ever.
      manageAlerts: true

  # The other half of an investigation. A metric says something went wrong at
  # 14:03; the log says what. Both in one Grafana is the difference between that
  # being a click and being an SSH session.
  - name: Loki
    type: loki
    uid: ond-loki
    access: proxy
    url: http://loki:3100
    isDefault: false
