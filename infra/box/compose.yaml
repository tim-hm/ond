# What runs on the box, rsynced to /srv/ond by `mise run deploy:api`. The
# ${POSTGRES_PASSWORD} interpolations read /srv/ond/.env — a symlink onto
# the data volume, written once at first boot by cloud-init.

# Docker's json-file driver keeps everything for ever by default. These files
# live under /var/lib/docker/containers on the *root* volume, not the data one,
# which is also where a deploy's dangling images accumulate.
#
# 50 MiB per resident service is the bound. It is no longer the whole retention
# policy: alloy ships these lines to Loki, so the rotation is now what a person
# reads over `docker compose logs` in the first few minutes of an incident,
# while anything older is a Grafana query. `migrate` is deliberately exempt —
# `run --rm` deletes its log file along with the container.
x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"

services:
  caddy:
    <<: *logging
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # The marketing one-pager, rsynced beside this file by `mise run deploy:website`.
      # Static files served straight off disk: nothing builds it, and no second
      # container exists to serve two files.
      - ./web:/srv/web:ro
      # Certificates. A named docker volume, which means /var/lib/docker on the
      # root volume — not /srv/data, where everything else that must outlive the
      # instance lives. So this survives a deploy and does not survive replacing
      # the box, and the cost of that is re-issuance against ACME's limit of
      # five duplicate certificates per week for one name.
      #
      # Left here rather than moved, because that ceiling is survivable for a
      # single domain and the daily EBS snapshots do not reach this volume
      # either. Written down because main.tf says putting data off the root
      # volume means replacing the instance replaces nothing that matters —
      # true of Postgres, and this is the exception to it.
      - caddy-data:/data
      - caddy-config:/config

  api:
    <<: *logging
    image: ond-api:latest
    restart: unless-stopped
    environment:
      OND_ENV: production
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/ond?sslmode=disable
      # Nothing here for the assistant, deliberately. It signs its Bedrock calls
      # with the instance profile, which the AWS SDK reads from the metadata
      # endpoint — reachable from inside this container because the instance's
      # http_put_response_hop_limit is 2 (see infra/main.tf). So there is no key
      # to add to this box and none to rotate.
    depends_on:
      db:
        condition: service_healthy

  # One-shot, run by `mise run deploy:api` before the api restarts — never resident.
  migrate:
    image: ond-api:latest
    profiles:
      - tools
    command: migrate
    environment:
      # Set for the same reason the api service sets it: migrate chooses its log
      # format from this, and every deploy runs it. Unset, the one record of
      # whether the schema applied arrives as prose beside everything else's JSON.
      OND_ENV: production
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/ond?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

  db:
    <<: *logging
    image: postgres:18-alpine
    restart: unless-stopped
    # No host port mapping: only the compose network can reach Postgres. Admin
    # access goes through `docker compose exec db psql` over SSH.
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      # The EBS data volume. `/var/lib/postgresql`, not `/data` — same Postgres
      # 18 path caveat as the dev compose.yaml at the repo root.
      - /srv/data/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Postgres internals — connections, transactions, cache hit ratio. The
  # product numbers deliberately do not come from here: "who is subscribed" is
  # already defined in crates/api/src/features/entitlement, and a second copy of
  # that rule written in an exporter's SQL is a copy that can quietly disagree
  # with the gate the app actually enforces.
  # Every observability container carries a `mem_limit`, and the two that matter
  # — `db` and `api` — deliberately do not.
  #
  # The box has 2 GiB and no swap, so the kernel's OOM killer is the only thing
  # arbitrating when it runs out, and it chooses by size rather than by
  # importance. Loki compacting, or Grafana answering a thirty-day query, is
  # briefly the largest process here — which means the unbounded version of this
  # file answers "the log store got busy" by killing Postgres. A ceiling on the
  # things that watch, and none on the things being watched, makes the monitoring
  # the first casualty of its own load instead of the last.
  #
  # These are ceilings, not reservations: nothing is reserved and ordinary usage
  # sits well under them. They are first estimates, to be tightened once
  # node-exporter has a few days of `container_memory` behind it.
  postgres-exporter:
    <<: *logging
    image: quay.io/prometheuscommunity/postgres-exporter:v0.19.0
    restart: unless-stopped
    mem_limit: 64m
    environment:
      DATA_SOURCE_NAME: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/postgres?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

  # The host itself — disk, memory, CPU, load. Everything else here reports on a
  # process; this is the only thing that reports on what those processes are
  # running out of. Without it the two ways this box actually dies are both
  # invisible until something has already stopped: the root volume filling with
  # images a deploy left behind, and 2 GiB of RAM running out.
  #
  # `--path.rootfs=/host` against a single read-only bind of `/` is the layout
  # upstream recommends for a container: the collectors read the host's `/proc`
  # and `/sys` through it, and filesystem metrics come back labelled with host
  # paths rather than the container's view of them. `rslave` propagation so a
  # volume attached after this container started is still seen.
  node-exporter:
    <<: *logging
    image: quay.io/prometheus/node-exporter:v1.12.1
    restart: unless-stopped
    mem_limit: 64m
    pid: host
    command:
      - --path.rootfs=/host
      # Where backup.sh leaves its result. A textfile metric outlives the script
      # that wrote it, which is the whole reason a nightly job can be alerted on
      # at all — Prometheus cannot scrape something that only exists at 02:17.
      - --collector.textfile.directory=/host/srv/data/textfile
      # Docker's own overlay and container mounts are a view of a filesystem
      # already counted once. Left in, they turn one full disk into dozens of
      # identical series and make a filesystem alert fire many times over.
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run)($$|/)|^/host/(dev|proc|sys|run|var/lib/docker)($$|/)
    volumes:
      - /:/host:ro,rslave

  prometheus:
    <<: *logging
    image: prom/prometheus:v3.7.3
    restart: unless-stopped
    mem_limit: 384m
    # Retention is bounded twice, and the size bound is the one that matters:
    # this volume is the one Postgres writes to, so an unbounded TSDB is a
    # database outage with extra steps. 30 days is what makes "is this working?"
    # answerable across a launch month; 2 GiB is what stops the answer costing
    # the thing it is measuring.
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=2GB
      - --web.enable-lifecycle
    # Loopback only, exactly as grafana is and for the same reason: the security
    # group has no rule that would admit it and needs none, while `tailscale
    # serve` on the host can still publish it to the tailnet. Two things need a
    # host-side port that the compose network alone could not give them — the
    # heartbeat cron, which has to be able to tell a dead Prometheus from a
    # healthy one, and ad-hoc PromQL without an SSH port-forward.
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - /srv/data/prometheus:/prometheus
    # nobody:nogroup, matching the directory `deploy:api` creates. The image's own
    # default is the same uid; naming it here means the bind mount and the
    # process cannot disagree after an image update.
    user: "65534:65534"
    depends_on:
      - api

  # What turns a firing rule into an email. Before this, `alerts.yml` was four
  # correct rules addressed to nobody: they surfaced on Prometheus' own /alerts
  # page, which nothing published, on a box only the tailnet can reach.
  #
  # It signs its SNS calls with the instance profile, so the config it reads
  # holds a topic ARN and no credential — the same property the assistant's
  # Bedrock calls and the backup's S3 writes already have.
  #
  # Loopback, like prometheus and grafana. `tailscale serve` publishes it at
  # 18106, which is where silences live: an email cannot acknowledge anything,
  # so the only way to quiet a known-broken thing before `repeat_interval` comes
  # round again is that UI.
  alertmanager:
    <<: *logging
    image: prom/alertmanager:v0.33.0
    restart: unless-stopped
    mem_limit: 64m
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - /srv/data/alertmanager:/alertmanager
    # Silences and notification state. On /srv/data rather than in a docker
    # volume so a silence set during an incident survives the deploy that fixes
    # it — and so a rebuilt instance does not start by re-notifying everything
    # somebody had already decided to sit on.
    user: "65534:65534"

  # Where the logs go, so an incident older than a week is still readable.
  #
  # The API has emitted aggregator-ready JSON since its subscriber chose that
  # format, and until now nothing aggregated it: 50 MiB per service on the box,
  # read over SSH, gone after a chatty week.
  #
  # Chunks live in S3 rather than on the data volume, which is the choice that
  # makes this affordable on a 20 GiB disk shared with Postgres — and means the
  # logs survive losing the instance, which an on-box store would not. The
  # bucket is written with the instance profile, so no credential lands here.
  loki:
    <<: *logging
    image: grafana/loki:3.7.2
    restart: unless-stopped
    mem_limit: 384m
    command:
      - -config.file=/etc/loki/loki.yaml
    volumes:
      - ./loki.yaml:/etc/loki/loki.yaml:ro
      # The index and the write-ahead log only. Chunks are in S3, so this stays
      # small — but it is state, and losing it mid-write loses the buffer.
      - /srv/data/loki:/loki
    user: "10001:10001"

  # What reads the containers' logs and pushes them.
  #
  # Alloy rather than Promtail, which reached end of life earlier this year.
  # It reads Docker's json-file logs off disk rather than replacing the logging
  # driver: a driver puts the log path inside container startup, and the Loki
  # plugin can block a container from starting when the sink is unreachable —
  # which turns "the aggregator is down" into "the API is down". Reading files
  # after the fact cannot, and `docker compose logs` keeps working.
  alloy:
    <<: *logging
    image: grafana/alloy:v1.15.0
    restart: unless-stopped
    mem_limit: 128m
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      # Alloy binds its own metrics endpoint to loopback by default, which
      # inside a container means nothing else on the compose network can scrape
      # it — the target would sit permanently down and `TargetDown` would fire
      # on a working collector.
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy.river:/etc/alloy/config.alloy:ro
      # Read-only, and the socket is the whole reason this container is
      # privileged in any sense: Docker's API is root on the host to anything
      # that can write to it. Alloy only discovers and reads.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /srv/data/alloy:/var/lib/alloy/data
    depends_on:
      - loki

  grafana:
    <<: *logging
    image: grafana/grafana:12.3.1
    restart: unless-stopped
    mem_limit: 256m
    # Bound to loopback, never to the ENI. `tailscale serve` on the host is what
    # publishes it, so the dashboard is reachable at the box's MagicDNS name and
    # from nowhere else — the security group has no rule that would admit it and
    # needs none.
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # No password, and no login form. The tailnet ACL already decided who may
      # reach this port — the same rule that admits an SSH session — so a second
      # credential in front of it would be one more thing to lose without being
      # one more thing to pass. This is only correct while the port stays on
      # loopback: publishing it anywhere else makes the dashboard world-writable.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - /srv/data/grafana:/var/lib/grafana
    user: "472:472"
    depends_on:
      - prometheus

volumes:
  caddy-data:
  caddy-config:
