# What is worth being told about, rsynced to /srv/ond beside prometheus.yml by
# `mise run deploy`.
#
# The box self-heals — `restart: unless-stopped` covers a crash — so these are
# not about restarting anything. They are about the case the dashboard cannot
# cover, which is nobody looking at it.
#
# They now reach a person: Alertmanager publishes to an SNS topic, signed with
# the instance profile, and one email subscription takes everything. What that
# does not cover is the failure where these rules are never evaluated at all — a
# stopped box, a full disk, a Prometheus crash-looping on a rule file that does
# not parse. Nothing on this box can report that, which is why heartbeat.sh
# publishes to CloudWatch and an alarm fires on its silence instead.
#
# Deliberately few. An alert nobody acts on trains everyone to ignore the ones
# they should, and a handful that always mean something beat twenty that mostly
# do not. No count is written here on purpose: a number in a comment is a number
# that goes stale the first time a rule is added, and `promtool test rules`
# covers what the number was standing in for.

groups:
  - name: availability
    rules:
      # `for: 2m` is eight scrape intervals: long enough that a deploy's own
      # restart does not fire it, short enough to notice before a tester does.
      - alert: TargetDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} has not answered a scrape for two minutes"
          description: >-
            Either the service is down or it is unreachable on the compose network. `docker compose ps` on the box separates those.

      # The API answers /health without touching the database, on purpose, so a
      # healthy process with a dead pool looks fine from the edge. This is the
      # rule that separates them.
      - alert: DatabaseUnreachable
        expr: pg_up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Postgres has been unreachable for two minutes"
          description: >-
            The exporter cannot open a connection. The API's own pool is almost certainly in the same state, and every request that needs a row is failing while /health keeps answering ok.

  - name: durability
    rules:
      # The rule that would have caught the eight days. The nightly dump used to
      # be a shell pipeline with no `pipefail`, so a failed pg_dump still
      # uploaded a valid gzip of nothing and exited 0 — and the 30-day lifecycle
      # then rotated the last good dump out from underneath it. Nothing was
      # wrong with the backup that anyone could see; there was simply no backup.
      #
      # backup.sh writes this timestamp only after reading the archive back and
      # measuring it, and never touches it on failure, so its age is the age of
      # the last dump known to be restorable rather than the last attempt.
      #
      # 26 hours: one daily cycle plus two hours of slack, so a dump that starts
      # at 02:17 and runs long does not fire this on its way to succeeding.
      - alert: BackupStale
        expr: time() - ond_backup_last_success_timestamp_seconds > 26 * 3600
        labels:
          severity: critical
        annotations:
          summary: "No verified database backup for over 26 hours"
          description: >-
            Either the dump failed its size or integrity check and refused to upload, or cron did not run it. `journalctl -t ond-backup` on the box has the transcript, and `ond_backup_success` separates a failed run from an absent one.

      # The absent case, which the rule above cannot state. A metric that has
      # never been written has no value to compare against `time()`, so a box
      # where the textfile collector is misconfigured — or where the cron was
      # never installed — leaves BackupStale permanently unable to fire rather
      # than firing. `absent()` is what turns that silence into a signal.
      - alert: BackupMetricMissing
        expr: absent(ond_backup_last_success_timestamp_seconds)
        for: 25h
        labels:
          severity: critical
        annotations:
          summary: "The backup has never reported a result"
          description: >-
            node-exporter is not reading /srv/data/textfile, or /etc/cron.d/ond is not installed. Until one of those is true, BackupStale cannot fire — this rule exists because a backup alert that is structurally incapable of firing is worse than no alert.

  - name: saturation
    rules:
      # Both volumes, one rule. The root volume fills with the images a deploy
      # leaves behind and the data volume fills with Postgres and the TSDB, and
      # neither has a symptom worth waiting for: a full root disk stops a deploy
      # loading an image, and a full data disk stops Postgres accepting writes
      # while `/health` — which never touches it — keeps answering ok.
      #
      # 15% rather than a byte figure because the two volumes are different
      # sizes, and `for: 30m` because a disk crossing a threshold is a trend,
      # not an event: nothing here is fixed inside five minutes anyway, and a
      # `pg_dump` writing a temp file should not page anyone on its way past.
      - alert: DiskFillingUp
        expr: |
          node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"}
            /
          node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}
            < 0.15
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.mountpoint }} is below 15% free"
          description: >-
            On the root volume the usual cause is images a deploy left behind — `docker image prune -f`. On the data volume it is Postgres or the Prometheus TSDB, and the TSDB is bounded at 2 GiB, so it is usually Postgres.

      # 2 GiB total, shared by every container. `MemAvailable` rather than
      # `MemFree`, because Linux spends free memory on page cache by design and
      # a rule on free memory would fire on a perfectly healthy box every day.
      #
      # There is no swap on this instance, so what follows running out is the
      # OOM killer choosing a process — and it will not choose the one that
      # caused it. This is the rule that has to arrive early.
      - alert: MemoryLow
        expr: |
          node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.15
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Less than 15% of memory has been available for fifteen minutes"
          description: >-
            Nothing here is sized to grow on its own, so the likely cause is a container that was added rather than one that changed. With no swap configured the next step is the OOM killer, which will not pick the process at fault.

  - name: correctness
    rules:
      # Reads the native gRPC status rather than the HTTP one. That distinction
      # is the whole point: gRPC-Web returns 200 with a non-zero status in the
      # trailers, so an HTTP-only rule here would report a healthy service while
      # every call failed.
      #
      # "Not zero" is the wrong set, though, and using it would have this fire on
      # a working system. Four of these codes are things the API returns on
      # purpose, every day:
      #
      #   16 Unauthenticated   — a call made before an identity settles
      #    8 ResourceExhausted — the throttle doing its job
      #    7 PermissionDenied  — a free caller reaching a paid lever
      #    3 InvalidArgument   — a client sending something malformed
      #
      # and two more are the network rather than the server:
      #
      #    1 Cancelled — the caller went away, which on a phone is constant
      #    2 Unknown   — usually the same thing seen from the other end
      #
      # What is left means the server failed to do something it had agreed to do.
      # On beta traffic a ratio alone is still twitchy, so it is paired with an
      # absolute floor: one unexpected call every couple of minutes is noise.
      - alert: GrpcUnexpectedFailures
        expr: |
          (
            sum(rate(ond_grpc_requests_total{status!~"0|1|2|3|7|8|16"}[5m]))
              /
            clamp_min(sum(rate(ond_grpc_requests_total[5m])), 0.001)
              > 0.05
          )
          and
          sum(rate(ond_grpc_requests_total{status!~"0|1|2|3|7|8|16"}[5m])) > 0.01
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "The API has been failing calls it agreed to serve for ten minutes"
          description: >-
            Excludes the refusals this API makes on purpose — unauthenticated, throttled, unentitled, malformed — and the two codes a disconnecting phone produces. What is left is deadlines, unavailability and internal faults. Expect this during a beta if a build ships against a contract the server does not serve, which is the case it exists to catch.

      # Status 13 is `Internal` — the code this server returns when it has broken
      # rather than when a caller has. It is inside the rule above's set too, and
      # kept separate anyway: that one needs a sustained *share* of traffic, so a
      # handful of internal faults on an otherwise quiet box would never reach
      # its floor. This one has no floor, because there is no acceptable rate of
      # the server being wrong.
      #
      # `method` is deliberately not matched on: `ond_grpc_requests_total`
      # carries only `status`, by design, so there is no way to name the
      # entitlement RPC here. Narrowing this to the money path would need a
      # `method` label first — worth having, and worth costing the cardinality
      # argument on its own rather than smuggling it in behind an alert.
      - alert: ServerErrorsSustained
        expr: sum(rate(ond_grpc_requests_total{status="13"}[5m])) > 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "The API has been returning Internal errors for ten minutes"
          description: >-
            Every one of these is a bug or a dependency that has gone away, not a caller doing something wrong. During a beta the likeliest causes are a schema the deployed build does not have and a Bedrock call that cannot authenticate. The per-request logs name which.
