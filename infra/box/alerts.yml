# What is worth being told about, rsynced to /srv/ond by `mise run deploy:api`.
# Deliberately few: an alert nobody acts on trains everyone to ignore the rest.
# Alertmanager mails these via SNS. None can cover the rules never being
# evaluated — a stopped box, a full disk, a crash-looping Prometheus — so
# heartbeat.sh publishes to CloudWatch and an alarm fires on its silence.

groups:
  - name: availability
    rules:
      # `for: 2m` is eight scrape intervals: long enough that a deploy's own
      # restart does not fire it, short enough to notice before a tester does.
      - alert: TargetDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} has not answered a scrape for two minutes"
          description: >-
            Either the service is down or it is unreachable on the compose network. `docker compose ps` on the box separates those.

      # The API answers /health without touching the database, on purpose, so a
      # healthy process with a dead pool looks fine from the edge. This is the
      # rule that separates them.
      - alert: DatabaseUnreachable
        expr: pg_up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Postgres has been unreachable for two minutes"
          description: >-
            The exporter cannot open a connection. The API's own pool is almost certainly in the same state, and every request that needs a row is failing while /health keeps answering ok.

  - name: durability
    rules:
      # The rule that would have caught the eight days: a dump pipeline without
      # `pipefail` uploaded a valid gzip of nothing while the 30-day lifecycle
      # rotated the last good dump away. backup.sh writes this timestamp only
      # after reading the archive back, so its age is the age of the last dump
      # known restorable. 26 hours is one daily cycle plus slack for a long run.
      - alert: BackupStale
        expr: time() - ond_backup_last_success_timestamp_seconds > 26 * 3600
        labels:
          severity: critical
        annotations:
          summary: "No verified database backup for over 26 hours"
          description: >-
            Either the dump failed its size or integrity check and refused to upload, or cron did not run it. `journalctl -t ond-backup` on the box has the transcript, and `ond_backup_success` separates a failed run from an absent one.

      # The absent case, which the rule above cannot state. A metric that has
      # never been written has no value to compare against `time()`, so a box
      # where the textfile collector is misconfigured — or where the cron was
      # never installed — leaves BackupStale permanently unable to fire rather
      # than firing. `absent()` is what turns that silence into a signal.
      - alert: BackupMetricMissing
        expr: absent(ond_backup_last_success_timestamp_seconds)
        for: 25h
        labels:
          severity: critical
        annotations:
          summary: "The backup has never reported a result"
          description: >-
            node-exporter is not reading /srv/data/textfile, or /etc/cron.d/ond is not installed. Until one of those is true, BackupStale cannot fire — this rule exists because a backup alert that is structurally incapable of firing is worse than no alert.

  - name: saturation
    rules:
      # Both volumes, one rule: the root fills with images a deploy leaves, the
      # data volume with Postgres and the TSDB — and a full data disk stops
      # writes while `/health`, which never touches it, keeps answering ok.
      # 15% rather than bytes because the volumes differ in size; `for: 30m` so
      # a `pg_dump` writing a temp file does not page anyone on its way past.
      - alert: DiskFillingUp
        expr: |
          node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"}
            /
          node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}
            < 0.15
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.mountpoint }} is below 15% free"
          description: >-
            On the root volume the usual cause is images a deploy left behind — `docker image prune -f`. On the data volume it is Postgres or the Prometheus TSDB, and the TSDB is bounded at 2 GiB, so it is usually Postgres.

      # `MemAvailable` rather than `MemFree`: Linux spends free memory on page
      # cache by design, so a rule on free memory would fire daily on a healthy
      # box. There is no swap on this instance, so what follows running out is
      # the OOM killer choosing a process — and not the one that caused it —
      # which is why this rule has to arrive early.
      - alert: MemoryLow
        expr: |
          node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.15
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Less than 15% of memory has been available for fifteen minutes"
          description: >-
            Nothing here is sized to grow on its own, so the likely cause is a container that was added rather than one that changed. With no swap configured the next step is the OOM killer, which will not pick the process at fault.

  - name: correctness
    rules:
      # Reads the native gRPC status: gRPC-Web returns HTTP 200 with the error
      # in the trailers, so an HTTP rule would report health while every call
      # failed. The excluded codes are deliberate refusals — 16 unauthenticated,
      # 8 throttled, 7 unentitled, 3 malformed — or the network (1, 2: a phone
      # going away); the ratio carries an absolute floor for thin beta traffic.
      - alert: GrpcUnexpectedFailures
        expr: |
          (
            sum(rate(ond_grpc_requests_total{status!~"0|1|2|3|7|8|16"}[5m]))
              /
            clamp_min(sum(rate(ond_grpc_requests_total[5m])), 0.001)
              > 0.05
          )
          and
          sum(rate(ond_grpc_requests_total{status!~"0|1|2|3|7|8|16"}[5m])) > 0.01
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "The API has been failing calls it agreed to serve for ten minutes"
          description: >-
            Excludes the refusals this API makes on purpose — unauthenticated, throttled, unentitled, malformed — and the two codes a disconnecting phone produces. What is left is deadlines, unavailability and internal faults. Expect this during a beta if a build ships against a contract the server does not serve, which is the case it exists to catch.

      # The rule transport metrics cannot provide: a declining assistant hands
      # over to `fallback` and the RPC completes with status 0, so a provider
      # outage is invisible to every rule above. The excluded reasons are the
      # product working — a free caller and a spent allowance; the rest includes
      # a box that cannot sign for Bedrock, which looks like a working coach.
      - alert: AssistantFallingBack
        expr: |
          (
            sum(rate(ond_assistant_fallbacks_total{reason!~"subscription_required|allowance_spent"}[15m]))
              /
            clamp_min(sum(rate(ond_assistant_answers_total[15m])), 0.001)
              > 0.5
          )
          and
          sum(rate(ond_assistant_fallbacks_total{reason!~"subscription_required|allowance_spent"}[15m])) > 0.001
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "The coach has been answering from its rules for fifteen minutes"
          description: >-
            Excludes the two ordinary reasons — an unsubscribed caller and a spent daily allowance. What is left is a provider that cannot be reached or a model whose replies are unusable. `ond_assistant_fallbacks_total` names which, and `ond_assistant_mode` says whether the breaker is open or no model was installed at boot.

      # A share, not a count: sandbox builds talking to production make some
      # rejection ordinary — one is a tester, half is the money path broken.
      # It exists for a signing-chain regression, which produces gRPC 3 — a
      # code `GrpcUnexpectedFailures` excludes on purpose — and a `debug` log
      # the production filter drops; the only other symptom is a quiet week.
      - alert: PurchasesBeingRejected
        expr: |
          (
            sum(rate(ond_entitlement_verifications_total{outcome="rejected"}[15m]))
              /
            clamp_min(sum(rate(ond_entitlement_verifications_total{outcome=~"rejected|honoured"}[15m])), 0.001)
              > 0.5
          )
          and
          sum(rate(ond_entitlement_verifications_total{outcome="rejected"}[15m])) > 0.001
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Most submitted App Store transactions are being rejected"
          description: >-
            Apple-signed purchases are not being honoured, so somebody is paying and not receiving. The denominator counts only rejected and honoured, so an unentitled caller reaching a gated RPC — the ordinary case, and much the most common outcome — cannot dilute this. `sum by (reason) (rate(ond_entitlement_rejections_total[15m]))` names the verifier's own reason, and the Money row draws that breakdown beside the outcomes.

      # A panic in a handler is caught by hyper's per-connection unwind: the
      # connection dies, the process carries on, and before the hook existed
      # there was no count and no structured line. There is no acceptable rate,
      # so no threshold — ServerErrorsSustained's reasoning without the ten
      # minutes, because a panic is never weather.
      - alert: ProcessPanicked
        expr: increase(ond_panics_total[15m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "A task panicked"
          description: >-
            The process survived — hyper unwinds the connection — so this will not appear as a restart or as a failed scrape. The log line carries the source location; the payload is deliberately not recorded, because a panic message can quote whatever was being formatted when it fired.

      # Status 13 is `Internal` — the server broken, not the caller. It is in
      # GrpcUnexpectedFailures' set too, but that rule needs a sustained share,
      # so a few internal faults on a quiet box never reach its floor; this one
      # has none. Deliberately not matched on `method`: PurchasesBeingRejected
      # narrows the money path, and this rule is for the server wrong anywhere.
      - alert: ServerErrorsSustained
        expr: sum(rate(ond_grpc_requests_total{status="13"}[5m])) > 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "The API has been returning Internal errors for ten minutes"
          description: >-
            Every one of these is a bug or a dependency that has gone away, not a caller doing something wrong. During a beta the likeliest causes are a schema the deployed build does not have and a Bedrock call that cannot authenticate. The per-request logs name which.

  - name: abuse
    rules:
      # The two codes GrpcUnexpectedFailures excludes on purpose, each given a
      # rule of its own. Every identity refusal logs at `debug`, which the
      # production filter drops, so without this a credential-guessing run
      # against `ond-session-credential` produces no alert and no log line.
      # Both floors are set against beta traffic and must move as it grows.
      - alert: AuthenticationRefusalsSustained
        expr: sum(rate(ond_grpc_requests_total{status="16"}[5m])) > 2
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "The API has been refusing unauthenticated calls for fifteen minutes"
          description: >-
            Status 16 is what an unknown identity, a missing session credential, a merged-away id and a refused Sign in with Apple all return, and each logs at debug, which production drops. So read this as either somebody trying ids and credentials, or a shipped build signing wrongly. `ond_grpc_requests_total` names the RPCs being tried, which separates the two.

      # Both budgets refuse with status 8: six hundred requests in a minute, or
      # ten new identities. So the floor only has to clear a carrier NAT
      # fronting many strangers. `Budget::spend` writes a warn naming which
      # budget filled, which is the line to read when this fires.
      - alert: ThrottleRefusalsSustained
        expr: sum(rate(ond_grpc_requests_total{status="8"}[5m])) > 4
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "The throttle has been refusing calls for fifteen minutes"
          description: >-
            One caller has to spend a whole budget before any of this appears — six hundred requests in a minute, or ten new identities — so a sustained rate is a script rather than the app. The throttle is holding, and this says so before the only other symptom, a quiet week, arrives. The server writes a warn naming which budget filled.
