# What gets scraped, rsynced to /srv/ond by `mise run deploy` beside
# compose.yaml. Every target is a compose service name on the internal network;
# none of them publishes a host port, so this file is also the complete list of
# things that can read those endpoints.

global:
  # Fifteen seconds is what makes a deploy visible while you are watching it.
  # It is also the API census's query rate — one count over `users` every
  # fifteen seconds, which is the cost of the two panels this whole stack
  # exists for.
  scrape_interval: 15s
  scrape_timeout: 10s
  # Rules judged as often as the data behind them changes. Set here rather than
  # per group in alerts.yml, so "fifteen seconds and why" is written once.
  evaluation_interval: 15s

# What is worth being told about. Kept in its own file because the rules answer
# a different question from the targets — one is what we can see, the other is
# what we would rather not have to look for.
rule_files:
  - /etc/prometheus/alerts.yml

# Where a firing rule goes. Without this block the rules above are evaluated
# correctly and told to nobody, which is what they did until Alertmanager
# existed — a distinction invisible from the /alerts page, because that page
# looks identical either way.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # The product: users, active subscriptions, gross MRR, and the request
  # metrics for both protocols. 18103 rather than the API's own 18100 — a
  # separate listener, so nothing that fronts the public port can route to it
  # (docs/observability.md).
  - job_name: api
    static_configs:
      - targets: ["api:18103"]

  # The edge. Answers what the public listener saw, including the requests that
  # never reached the API — a TLS handshake that failed, a path that fell
  # through to the marketing site, a 502 while the API was restarting mid-deploy.
  - job_name: caddy
    static_configs:
      - targets: ["caddy:2019"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # The box underneath all of it. Also carries the nightly backup's result, via
  # the textfile collector — so "did last night's dump work" is a metric here
  # rather than something only a person reading S3 can answer.
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  # Prometheus watching itself, which is what makes "the dashboard is empty"
  # distinguishable from "nothing is happening".
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Scraped for the dashboard, not for the alert. `TargetDown` covers this
  # target like any other, but a dead Alertmanager is precisely the thing that
  # cannot deliver the alert about a dead Alertmanager — that case belongs to
  # the CloudWatch heartbeat, which lives off this box on purpose.
  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  # The log pipeline watching itself. Both are here so `TargetDown` covers them:
  # an aggregator that has quietly stopped ingesting looks exactly like a system
  # that has stopped producing logs, and one of those is fine.
  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]
