# The single entry point for every repo operation — CLAUDE.md §3 has the
# mise-first rule. Tasks encode the env (SQLX_OFFLINE, DATABASE_URL,
# CARGO_TARGET_DIR) the raw commands need to behave identically here, in a
# fresh clone.

# Tools ride `latest` on purpose — a nudge to keep the toolchain current.
# The exceptions are pinned because something committed depends on the exact
# version, or the tool runs on a security or deployment boundary.
[tools]
# Must precede the cargo:* entries so mise's cargo backend installs prebuilt
# binaries instead of compiling each tool from source.
cargo-binstall = "1.21.1"
"cargo:cargo-llvm-cov" = "latest"

# Lockstep with Cargo.toml's `rust-version`. The components are load-bearing:
# a toolchain mise installs through rustup carries neither rustfmt nor clippy,
# so `check:rs` dies with "'cargo-fmt' is not installed" — a machine with its
# own rustup adopts it, components and all, so this only ever failed on a
# machine that had none.
rust = { version = "1.96", components = ["rustfmt", "clippy"] }

buf = "latest"
# Load-bearing despite buf handling Swift generation: crates/api/build.rs runs
# prost-build, which needs a `protoc` binary from the environment. The
# swift-protobuf entry below also ships a `protoc`; this registry entry wins,
# and prost-build wants this one — if a Rust build fails on a well-known type,
# check which `protoc` resolved before suspecting the proto.
protoc = "latest"
lychee = "latest"
"npm:markdownlint-cli2" = "0.23.2"
# `web:serve` used to reach for this through `pnpm dlx`, which resolves and
# executes whatever the registry answers with — on a machine holding the AWS
# credential and the deploy path. Pinned here instead, so the version moves
# only in a reviewed change, like every other tool in this block.
"npm:serve" = "14.2.6"
# Vite+'s formatter (oxfmt). Pinned because its output is committed, so a
# version bump reformats the tree and fails `check` for everyone behind it —
# markdownlint-cli2 is pinned for the same reason.
vp = "0.2.8"
pnpm = "latest"

"cargo:cargo-nextest" = "latest"
"cargo:cargo-watch" = "latest"
"cargo:cargo-machete" = "latest"
# The two halves of `check:audit`, pinned so the gate's implementation moves
# only in a reviewed change.
"cargo:cargo-audit" = "0.22.2"
"osv-scanner" = "2.5.0"
# 0.9.x to match the `sqlx` crate: a 0.8 CLI cannot read the committed 0.9
# offline cache. Move both together.
"cargo:sqlx-cli" = "0.9"

# iOS toolchain. Xcode itself is not installable by mise (docs/contributing.md
# covers it); `os` keeps a Linux machine off tools with no Linux builds.
xcodegen = { version = "latest", os = ["macos"] }
swiftlint = { version = "latest", os = ["macos"] }
swiftformat = { version = "latest", os = ["macos"] }

# The protoc plugins that write the Swift client, run locally because
# buf.build's unauthenticated quota starved check:generated (TIM-87). Pinned
# exactly to the runtime versions in ios/Packages/OndCore/Package.resolved —
# move all four together, or check:generated's byte-exact diff fails on
# reformatted output. `os`: the spm backend builds with `swift build`.
"spm:apple/swift-protobuf" = { version = "1.38.1", os = ["macos"] }
"spm:connectrpc/connect-swift" = { version = "1.2.3", os = ["macos"] }

# Backs the infra:* tasks. OpenTofu, not Terraform — see infra/versions.tf.
opentofu = "1.12.5"

[env]
# .env is gitignored and holds only machine-local values for the iOS release
# tasks. Deliberately not `redact = true`: redaction captures every task's
# stdio and hands children a closed stdin, which broke `db:psql` and `tofu
# apply`'s approval prompt — docs/contributing.md § Things that will bite you.
# Nothing the backend needs is in here, and nothing should be (CLAUDE.md §1.4).
_.file = { path = ".env" }

# Global so every cargo invocation reads the committed .sqlx cache rather than
# needing a live database. `generate:sqlx` overrides it, because refreshing
# the cache is precisely the operation that must talk to a real server.
SQLX_OFFLINE = "true"
# Supplied per-task rather than inherited: a shell that has visited the
# sibling `connect` repo exports a DATABASE_URL pointing at *its* cluster.
# Port rationale lives in compose.yaml.
DATABASE_URL = "postgres://postgres:postgres@localhost:18101/ond?sslmode=disable"

# Every non-`dev` cargo invocation builds here instead of ./target. The reason
# is the cargo *file lock*, not artifact invalidation: without the split,
# running `check` blocks the `dev` watch loop (and vice versa) until one
# finishes.
CHECK_TARGET_DIR = "{{config_root}}/target/check"

# dev: the local loop

[tasks."dev:db"]
description = "Start PostgreSQL in the background"
run = "docker compose up -d --wait db"

[tasks."dev:db:stop"]
description = "Stop PostgreSQL"
run = "docker compose down"

[tasks."dev:db:reset"]
description = "Destroy the database volume and rebuild it from migrations"
run = ["docker compose down -v", "mise run dev:db", "mise run migrate"]

[tasks.dev]
description = "Run the API with auto-reload on change (the coach calls Bedrock for real)"
depends = ["dev:db"]
# Pinned to a *name* for DATABASE_URL's reason: unset, the AWS SDK's default
# chain reads whichever `[default]` profile the machine holds, and the API
# boots signing against the wrong account. `ond-dev` is the scoped role that
# can invoke the model and nothing else; what local calls cost and why this is
# safe is in docs/contributing.md § The coach calls Bedrock for real.
env = { AWS_PROFILE = "ond-dev" }
# Scoped to the directories the binary is built from; unscoped, editing a
# SwiftUI view or a doc would relink and restart the API.
run = "cargo watch -w crates -w proto -x 'run -p api'"

[tasks.migrate]
description = "Create the database if absent, apply migrations, seed reference data"
depends = ["dev:db"]
run = "cargo run -p migrate"

[tasks."db:psql"]
description = "Query the local database — SQL on stdin, or a session when there is none"
# `raw` hands this task the real stdin and terminal. `-T` disables Docker's
# TTY allocation, which a pipe requires and an interactive session must not
# have. ON_ERROR_STOP because psql reports a syntax error and then exits 0 —
# without it a broken query is indistinguishable from one that matched
# nothing.
raw = true
run = '''
if [ -t 0 ]; then
  tty=
else
  tty=-T
fi
docker compose exec $tty db psql -v ON_ERROR_STOP=1 -U postgres -d ond
'''

[tasks."dev:plus"]
description = "Grant önd+ to a local user for a year (arg: user id, or the newest user)"
depends = ["dev:db"]
usage = 'arg "[user]" help="The user id to grant. Defaults to the most recently created user."'
run = "cargo run --quiet -p toolkit -- dev plus {{arg(name='user', default='')}}"

[tasks."dev:sign-in"]
description = "Sign a local user in without the Apple sheet (arg: user id, or a fresh identity)"
depends = ["dev:db"]
usage = 'arg "[user]" help="The user id to sign in. Omit to create a fresh identity, which is what a terminal usually wants."'
run = "cargo run --quiet -p toolkit -- dev sign-in {{arg(name='user', default='')}}"

# generate: everything derived from a source of truth elsewhere

[tasks.generate]
description = "Regenerate protobuf types, the catalogue export, the site's figures and icons, and the SQLx offline cache"
# generate:diagrams reads what generate:catalogue writes, so the two are
# ordered rather than fanned out.
run = ["mise run generate:proto", "mise run generate:catalogue", "mise run generate:diagrams", "mise run generate:icons", "mise run generate:sqlx"]

[tasks."generate:proto"]
description = "Generate Swift client code from proto/ (Rust generates in build.rs)"
dir = "{{config_root}}/proto"
run = "buf generate"

[tasks."generate:catalogue"]
description = "Export the seeded technique catalogue that both apps ship and the drawings derive from"
# The export lands inside OndKit because SwiftPM can only bundle a resource
# under the target's own source directory; OndDiagrams reads the same path.
# No dev:db dependency — the catalogue is a `const` array, so the export never
# opens a connection, which keeps `mise run check` off Postgres.
env = { CARGO_TARGET_DIR = "{{env.CHECK_TARGET_DIR}}" }
# Through a temporary file: a shell truncates the target before cargo runs, so
# a compile error would otherwise leave an empty catalogue.json behind and
# fail later in a Swift decoder instead of the build that broke. Beside the
# target so the move is a rename.
run = """
catalogue={{config_root}}/ios/Packages/OndCore/Sources/OndKit/Resources/catalogue.json
trap 'rm -f "$catalogue.tmp"' EXIT
cargo run --quiet -p migrate --bin export-catalogue > "$catalogue.tmp"
mv "$catalogue.tmp" "$catalogue"
"""

[tasks."generate:diagrams"]
description = "Redraw the marketing site's figures from the shared breathing geometry"
# The app and the page must draw a technique the same way, so both come out of
# OndKit's TechniqueFigure; the site has no build step, so the <svg> elements
# are written into the committed HTML.
dir = "{{config_root}}/ios/Packages/OndCore"
# `vp fmt` after writing, because check:text holds web/index.html to oxfmt's
# output like every other committed file.
run = ["swift run --quiet OndDiagrams {{config_root}}/ios/Packages/OndCore/Sources/OndKit/Resources/catalogue.json {{config_root}}/web/index.html", "vp fmt {{config_root}}/web/index.html"]

[tasks."generate:icons"]
description = "Rasterise the site's fallback icons and the watch app icon from the committed vectors"
dir = "{{config_root}}"
# Rendered rather than exported by hand: a raster committed beside its vector
# is a copy with nothing reconciling it, and a stale one is invisible until a
# retuned ring ships in last season's blue.
run = "cargo run --quiet -p toolkit -- icons"

[tasks."generate:voice"]
description = "Speak the session's cues into the clips OndKit ships"
# Outside the `generate` chain: it needs an ElevenLabs key and macOS-only
# `afconvert`, and a chain that fails in a headless environment teaches people
# to skip the chain. Nothing enforces running it by hand — a reworded cue
# fails VoiceCoverageTests inside the gate, with no key and no network; this
# is how you satisfy that check. The clips are committed (docs/voice.md).
run = "cargo run --quiet -p toolkit -- voice"

[tasks."voice:setup"]
description = "Store the ElevenLabs voice-rendering key in the login Keychain"
# `-w` is deliberately the final argument: the security client then prompts
# without putting the credential in this file, the process list, or shell
# history. `-U` rotates an existing item in place.
raw = true
run = '''
if [ "$(uname -s)" != Darwin ]; then
  echo 'voice:setup: the credential lives in the macOS Keychain, so this task requires macOS' >&2
  exit 1
fi

/usr/bin/security add-generic-password \
  -U \
  -s com.ond.voice.elevenlabs \
  -a api-key \
  -l 'önd ElevenLabs voice rendering' \
  -w
'''

[tasks."voice:list"]
description = "List the ElevenLabs voices this account can render with"
run = "cargo run --quiet -p toolkit -- voice list"

[tasks."generate:sqlx"]
description = "Refresh the committed .sqlx offline query cache"
depends = ["dev:db"]
# `cargo sqlx prepare` type-checks queries against a real server, which is the
# whole point of the cache — hence the SQLX_OFFLINE override.
env = { SQLX_OFFLINE = "false", CARGO_TARGET_DIR = "{{env.CHECK_TARGET_DIR}}" }
run = "cargo sqlx prepare --workspace -- --all-targets"

# fmt / fix: mutating

[tasks.fmt]
description = "Format everything"
run = ["mise run fmt:rs", "mise run fmt:swift", "mise run fmt:text"]

[tasks."fmt:rs"]
run = "cargo fmt --all"

[tasks."fmt:swift"]
run = "swiftformat ios --config ios/.swiftformat"

[tasks."fmt:text"]
description = "Format everything that is not Rust or Swift (markdown, YAML, JSON, TOML)"
# One tool for four formats is why this is one task. vite.config.ts is vp's
# config file, not a Vite app, and the root package.json exists only because
# vp refuses to run outside a JS workspace — see the comments in both.
run = "vp fmt"

[tasks.fix]
description = "Auto-fix formatting and the lint findings that are mechanically fixable"
env = { CARGO_TARGET_DIR = "{{env.CHECK_TARGET_DIR}}" }
run = [
  "cargo clippy --workspace --all-targets --fix --allow-dirty --allow-staged",
  "mise run fmt",
  "swiftlint --fix --config ios/.swiftlint.yml ios",
  # After `fmt`, so the linter's fixes land on already-formatted markdown
  # rather than being reflowed out from under it.
  "markdownlint-cli2 --fix",
]

# check: validation. `check` is the gate — it is what must pass. Read-only
# with one exception: check:generated regenerates the committed Swift in place
# before diffing.

[tasks.check]
description = "Full validation (the gate)"
# The Rust tasks share one cargo artifact lock, so they are serialised in
# `run` while everything genuinely independent fans out through `depends`.
depends = [
  "check:proto",
  "check:comments",
  "check:migrations",
  "check:observability",
  "check:generated",
  "check:text",
  "check:md",
  "check:doc-links",
  "check:deps",
  "check:alerts",
  "check:alertmanager",
  "check:loki",
  "check:caddy",
  "check:alloy",
  "check:metrics",
]
run = ["mise run check:rs", "mise run check:sqlx", "mise run test:rs", "mise run test:e2e", "mise run check:mac"]

[tasks."check:mac"]
description = "The half of the gate that only a Mac can run"
# The skip is on the platform, not on whether the tools are installed:
# `command -v` answers "no toolchain" on a Mac that has not run `mise
# install` yet, and would pass without checking the one machine that could
# have. The skip is loud because a silent one reads as a pass.
raw = true
run = '''
if [ "$(uname -s)" != Darwin ]; then
  echo 'check:mac: not macOS — check:swift and test:swift were NOT run' >&2
  exit 0
fi

mise run check:swift
mise run test:swift
'''

[tasks."check:rs"]
description = "Validate Rust (fmt + clippy)"
env = { CARGO_TARGET_DIR = "{{env.CHECK_TARGET_DIR}}" }
# `--all` makes the scope every workspace member: bare `cargo fmt` reads only
# the package containing the working directory.
run = ["cargo fmt --all -- --check", "cargo clippy --workspace --all-targets -- -D warnings"]

[tasks."check:sqlx"]
description = "Assert the committed .sqlx cache matches the queries in the tree"
env = { CARGO_TARGET_DIR = "{{env.CHECK_TARGET_DIR}}" }
run = "cargo sqlx prepare --workspace --check -- --all-targets"

[tasks."check:comments"]
description = "Assert new and edited prose comments stay within the repository cap"
dir = "{{config_root}}"
run = "cargo run --quiet -p toolkit -- comments check"

[tasks."comments:baseline"]
description = "Rewrite the comment-length waiver ledger from the current tree"
dir = "{{config_root}}"
# Every row it writes waives a block, so review the diff before committing.
run = "cargo run --quiet -p toolkit -- comments baseline"

[tasks."check:alerts"]
description = "Assert the Prometheus alert rules parse and fire when they should"
dir = "{{config_root}}"
run = "cargo run --quiet -p toolkit -- box check alerts"

[tasks."check:alertmanager"]
description = "Assert the rendered Alertmanager config parses"
dir = "{{config_root}}"
run = "cargo run --quiet -p toolkit -- box check alertmanager"

[tasks."check:loki"]
description = "Assert the rendered Loki config parses"
dir = "{{config_root}}"
run = "cargo run --quiet -p toolkit -- box check loki"

[tasks."check:caddy"]
description = "Assert the rendered Caddyfile parses"
dir = "{{config_root}}"
run = "cargo run --quiet -p toolkit -- box check caddy"

[tasks."check:alloy"]
description = "Assert the Alloy log pipeline is a valid configuration"
dir = "{{config_root}}"
run = "cargo run --quiet -p toolkit -- box check alloy"

[tasks."check:migrations"]
description = "Assert no migration that has landed on main has been edited, renumbered, or reordered"
dir = "{{config_root}}"
# Why an edited landed migration breaks production, and why git is the
# manifest, is on crates/toolkit/src/migrations.rs.
run = "cargo run --quiet -p toolkit -- migrations check"

[tasks."check:observability"]
description = "Assert production Swift logger categories match the closed registry"
dir = "{{config_root}}"
run = "cargo run --quiet -p toolkit -- observability check"

[tasks."check:metrics"]
description = "Assert every metric the dashboard, the alerts and the docs name is one the API emits"
dir = "{{config_root}}"
# check:alerts proves the PromQL parses; neither it nor promtool can tell
# whether the names in it exist, and a metric that stops existing blanks the
# panel reading it and silences the alert on it.
run = "cargo run --quiet -p toolkit -- metrics check"

[tasks."check:proto"]
description = "Lint the protobuf contract and check it for breaking changes against what has landed"
dir = "{{config_root}}/proto"
# The breaking-change baseline and its PROTO_BREAKING_ACK escape hatch live in
# crates/toolkit/src/proto.rs.
run = ["buf lint", "cargo run --quiet -p toolkit -- proto check"]

[tasks."check:swift"]
description = "Validate Swift (format + lint)"
run = ["swiftformat --lint ios --config ios/.swiftformat", "swiftlint lint --strict --config ios/.swiftlint.yml ios"]

[tasks."check:text"]
description = "Assert markdown, YAML, JSON, and TOML are formatted"
run = "vp fmt --check"

[tasks."check:md"]
description = "Lint markdown rules a formatter has no opinion about"
run = "markdownlint-cli2"

[tasks."check:doc-links"]
description = "Resolve every link in the docs without hitting the network"
run = "lychee --offline --root-dir {{config_root}} 'docs/**/*.md' CLAUDE.md README.md"

[tasks."check:generated"]
description = "Assert the committed Swift protobuf and catalogue export match their sources"
# check:sqlx's contract for the other committed artifacts: regenerate,
# compare, fail on drift. Against HEAD, not the index — a bare `git diff`
# passes on staged drift and, in a GitButler workspace, fails on generated
# files already committed. The site's figures need a Swift toolchain, so they
# are check:diagrams; this task must stay runnable on a headless box.
run = [
  "mise run generate:proto",
  "mise run generate:catalogue",
  "mise run generate:icons",
  "git diff --exit-code HEAD -- ios/Packages/OndCore/Sources/OndAPI/Generated ios/Packages/OndCore/Sources/OndKit/Resources/catalogue.json web/favicon.ico web/apple-touch-icon.png ios/OndWatch/Assets.xcassets/AppIcon.appiconset",
]

[tasks."check:diagrams"]
description = "Assert the site's committed figures match the app's geometry"
# Outside `check` on cost, not platform: it builds Swift for minutes. Run it
# when touching ios/ or web/ — "the page and the app draw a technique the same
# way" is the invariant this whole arrangement exists to create, and this is
# its only enforcement while Actions stay disabled.
run = ["mise run generate:diagrams", "git diff --exit-code HEAD -- web/index.html"]

[tasks."check:audit"]
description = "Match Cargo.lock against RustSec and Package.resolved against OSV"
# Outside the gate: its answer changes when somebody publishes an advisory,
# and it needs the network, which `check` deliberately does not. It runs from
# deploy:api instead — docs/deployment.md § The advisory check has the full
# reasoning, including why the deploy is the right recurring moment.
run = ["cargo audit", "osv-scanner scan source --lockfile ios/Packages/OndCore/Package.resolved"]

[tasks."check:deps"]
description = "Report crate dependencies nothing imports"
# Blind spot worth knowing: machete reads each member's [dependencies], so an
# unused entry in the root [workspace.dependencies] is invisible to it.
run = "cargo run --quiet -p toolkit -- deps check"

# test

[tasks.test]
description = "Run every test suite"
run = ["mise run test:rs", "mise run test:e2e", "mise run test:swift"]

[tasks."test:rs"]
description = "Rust unit tests — no database, no network"
# Scoped to lib and bin targets so this stays the fast inner-loop suite; the
# integration tests need Postgres and live in test:e2e.
env = { CARGO_TARGET_DIR = "{{env.CHECK_TARGET_DIR}}" }
run = "cargo nextest run --workspace --lib --bins"

[tasks."test:e2e"]
description = "Integration tests: the real router over a disposable database"
depends = ["dev:db"]
# Each test creates and migrates its own stamped `ond_test_*` database, so
# suites neither share state nor touch the development one; the harness
# sweeps hour-old leftovers.
env = { CARGO_TARGET_DIR = "{{env.CHECK_TARGET_DIR}}" }
run = "cargo nextest run -p api --test e2e"

[tasks."assistant:smoke"]
description = "Make one real call to the model provider and print what it said"
depends = ["dev:db"]
# The only task that spends money and leaves the machine, which is why the
# tests are `#[ignore]`d rather than guarded by a variable someone could set
# by accident. The filter names a category — every `smoke_*` test — so
# renaming one cannot quietly make this pass by running nothing.
# `--no-capture` because the printed answer is the result.
env = { CARGO_TARGET_DIR = "{{env.CHECK_TARGET_DIR}}", AWS_PROFILE = "ond-dev" }
run = "cargo nextest run -p api --test e2e --run-ignored only -E 'test(/::smoke_/)' --no-capture"

[tasks."test:swift"]
dir = "{{config_root}}/ios"
run = "swift test --package-path Packages/OndCore"

[tasks."test:swift:live"]
description = "Exercise the Swift gRPC-Web client against a running local backend"
dir = "{{config_root}}/ios/Packages/OndCore"
run = "swift run --quiet OndLiveSmoke http://localhost:18100"

[tasks."test:ui:phone"]
description = "Run the iPhone accessibility UI suite on a booted simulator"
depends = ["ios:gen"]
dir = "{{config_root}}"
run = "cargo run --quiet -p toolkit -- ios ui-test"

[tasks."ios:screenshots"]
description = "Capture the App Store screenshot set into ios/build/screenshots"
depends = ["ios:gen"]
dir = "{{config_root}}"
# Taken by a test rather than by hand — see OndAppUITests/ScreenshotTests for
# why it is a test at all; the device choice and the status-bar freeze are
# explained in crates/toolkit/src/screenshots.rs.
run = "cargo run --quiet -p toolkit -- ios screenshots"

[tasks."test:system"]
description = "Run live Swift/backend and iPhone accessibility tests"
depends = ["migrate"]
dir = "{{config_root}}"
run = "cargo run --quiet -p toolkit -- test system"

[tasks."coverage:rs"]
description = "Print informational Rust coverage for unit and e2e tests"
depends = ["dev:db"]
run = '''
  set -eu
  cargo llvm-cov clean --workspace
  cargo llvm-cov nextest --workspace --lib --bins --no-report \
    --status-level fail --final-status-level fail
  cargo llvm-cov nextest -p api --test e2e --no-clean \
    --status-level fail --final-status-level fail >/dev/null
  set -o pipefail
  cargo llvm-cov report \
    | awk 'NR == 1 || /^TOTAL/'
'''

[tasks."coverage:swift"]
description = "Print informational Swift package coverage"
dir = "{{config_root}}/ios"
run = '''
  set -eu
  coverage_log=Packages/OndCore/.build/coverage-test.log
  mkdir -p "${coverage_log%/*}"
  if ! swift test --enable-code-coverage --package-path Packages/OndCore >"$coverage_log" 2>&1; then
    cat "$coverage_log" >&2
    exit 1
  fi
  echo 'Swift coverage tests passed.'
  bin_path=$(swift build --package-path Packages/OndCore --show-bin-path)
  xcrun llvm-cov report \
    "$bin_path/OndCorePackageTests.xctest/Contents/MacOS/OndCorePackageTests" \
    -instr-profile "$bin_path/codecov/default.profdata" \
    -ignore-filename-regex='/(Generated|Tests|OndDiagrams|OndLiveSmoke|\.build/checkouts)/' \
    | awk 'NR == 1 || /^TOTAL/'
'''

[tasks.coverage]
description = "Print informational Rust and Swift coverage summaries"
run = ["mise run coverage:rs", "mise run coverage:swift"]

# web

[tasks."web:serve"]
description = "Serve the marketing one-pager locally"
# 18102: next free port in the 18100–18199 block (API 18100, Postgres 18101).
run = "serve --listen 18102 {{config_root}}/web"

# infra: applied deliberately — nothing below runs from `check` or CI. Every
# task that reaches AWS pins AWS_PROFILE for DATABASE_URL's reason: an
# ambient value from another repo's shell is indistinguishable from the right
# one until it has done something. The profiles are in docs/deployment.md
# § Identity and state.

[tasks."infra:bootstrap:init"]
description = "Initialise the bootstrap root (state bucket + IAM user; local state)"
dir = "{{config_root}}/infra/bootstrap"
run = "tofu init"

[tasks."infra:bootstrap:apply"]
description = "Create the OpenTofu state bucket and the ond-tofu IAM user (runs as account root; once)"
dir = "{{config_root}}/infra/bootstrap"
env = { AWS_PROFILE = "holmie" }
# `raw` because `tofu apply`'s approval prompt is the whole safety of the
# task, and it is answerable only on a real stdin.
raw = true
run = "tofu apply"

[tasks."infra:init"]
description = "Initialise OpenTofu (downloads providers and modules; reaches the S3 backend)"
dir = "{{config_root}}/infra"
env = { AWS_PROFILE = "ond" }
run = "tofu init"

[tasks."infra:fmt"]
description = "Format the OpenTofu sources (what infra:plan checks first)"
# `mise run fmt` has no HCL support, and the check that fails on unformatted
# .tf lives inside infra:plan, which needs AWS credentials. Two roots rather
# than `-recursive`, which would reformat the community modules vendored
# under .terraform/.
run = ["tofu fmt {{config_root}}/infra", "tofu fmt {{config_root}}/infra/bootstrap"]

[tasks."infra:plan"]
description = "Preview infrastructure changes (needs AWS credentials, changes nothing)"
dir = "{{config_root}}/infra"
env = { AWS_PROFILE = "ond" }
run = ["tofu fmt -check -diff", "tofu validate", "tofu plan"]

[tasks."infra:apply"]
description = "Apply infrastructure changes to AWS"
dir = "{{config_root}}/infra"
env = { AWS_PROFILE = "ond" }
# `raw` for infra:bootstrap:apply's reason: the approval prompt is the safety.
raw = true
run = "tofu apply"

[tasks."infra:drift"]
description = "Fail when AWS is not what infra/ describes (read-only; deploy depends on it)"
dir = "{{config_root}}"
env = { AWS_PROFILE = "ond" }
# Why the deploy gates on this, and the INFRA_DRIFT_ACK escape hatch, are in
# docs/deployment.md § The two halves of a release.
run = "cargo run --quiet -p toolkit -- infra drift"

[tasks."deploy:api"]
description = "Build the release image, ship it to the box over SSH, migrate, restart"
dir = "{{config_root}}"
# The dependency is the point: the box cannot be shipped to while the module
# it is described by is pending. The build, render, shipping and remote steps
# live in crates/toolkit/src/deploy.rs and infra/box/box-up.sh; the reasoning
# lives in docs/deployment.md.
depends = ["infra:drift"]
env = { AWS_PROFILE = "ond" }
run = "cargo run --quiet -p toolkit -- deploy api"

[tasks."deploy:website"]
description = "Rsync web/ to the box — the marketing pages and nothing else"
dir = "{{config_root}}"
env = { AWS_PROFILE = "ond" }
# No infra:drift and no check:audit: neither can fail for a reason that
# touches a static file — docs/deployment.md § The site has the split.
run = "cargo run --quiet -p toolkit -- deploy website"

# ios

[tasks."ios:gen"]
description = "Generate Ond.xcodeproj from ios/project.yml"
dir = "{{config_root}}/ios"
# Bakes this Mac's Bonjour address into both gitignored Info.plists: debug
# builds fall back to it when OND_API_BASE_URL is absent — every home-screen
# launch — so a device build keeps working untethered. The Bonjour name
# survives a DHCP renewal and derives per machine with no config. The watch
# gets it too: it talks to the backend directly, not through the phone.
run = ["xcodegen generate", '''
  url="http://$(scutil --get LocalHostName).local:18100"
  plutil -replace OndAPIBaseURL -string "$url" Ond/Info.plist
  plutil -replace OndAPIBaseURL -string "$url" OndWatch/Info.plist
  ''']

[tasks."ios:open"]
description = "Generate the project and open it in Xcode"
depends = ["ios:gen"]
run = "open {{config_root}}/ios/Ond.xcodeproj"

# Three verbs across two surfaces: `build` compiles and stops, `sim` lands on
# a simulator, `device` lands on hardware. None is aliased to a bare verb — a
# name that omits the surface has to pick one silently.

[tasks."ios:build:phone"]
description = "Build the phone app for the simulator without opening Xcode"
depends = ["ios:gen"]
dir = "{{config_root}}/ios"
# The generic destination builds without naming a device, so this works
# whatever simulators this Xcode happens to have installed.
run = "xcodebuild -project Ond.xcodeproj -scheme Ond -destination 'generic/platform=iOS Simulator' build"

[tasks."ios:build:watch"]
description = "Build the watch app for the simulator without opening Xcode"
depends = ["ios:gen"]
dir = "{{config_root}}/ios"
# The phone scheme embeds the watch app, so building it covers both — but a
# watch-only change wants a build that fails on the wrist's errors alone.
run = "xcodebuild -project Ond.xcodeproj -scheme OndWatch -destination 'generic/platform=watchOS Simulator' build"

[tasks."ios:build:release"]
description = "Compile both apps in Release, which is the only configuration that reads the deployed host"
depends = ["ios:gen"]
dir = "{{config_root}}/ios"
# The one build that proves `#else` compiles: the configurations resolve their
# default through `#if DEBUG`, so every other task leaves the Release branch
# unread until ios:archive. Signing off because this asks whether the code
# compiles, not whether it installs. Outside `check` on cost, like
# check:diagrams — run it when touching either configuration.
run = "xcodebuild -project Ond.xcodeproj -scheme Ond -configuration Release -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build"

[tasks."ios:sim:phone"]
description = "Build, install, and launch the phone app on the booted iOS simulator"
depends = ["ios:build:phone"]
dir = "{{config_root}}"
# The StoreKit sync is the difference between this task and Xcode's Run
# action — crates/toolkit/src/ios.rs explains why simctl needs it.
run = "cargo run --quiet -p toolkit -- ios sim phone"

[tasks."ios:sim:watch"]
description = "Build, install, and launch the watch app on the booted watch simulator"
depends = ["ios:build:watch"]
dir = "{{config_root}}"
run = "cargo run --quiet -p toolkit -- ios sim watch"

[tasks."ios:device:phone"]
description = "Build, install, and launch the phone app on a connected iPhone"
depends = ["ios:gen"]
dir = "{{config_root}}"
# Hardware is the one surface that answers background lifecycle, lock-screen
# presence, and haptics honestly; a simulator answers wrongly and confidently.
run = "cargo run --quiet -p toolkit -- ios device phone"

[tasks."ios:device:watch"]
description = "Build, install, and launch the watch app on a paired Apple Watch"
depends = ["ios:gen"]
dir = "{{config_root}}"
# The install goes over the phone bridge and is measured in minutes, not
# seconds; expect it to look hung before it succeeds.
run = "cargo run --quiet -p toolkit -- ios device watch"

[tasks."ios:archive"]
description = "Archive both apps, signed for release, into ios/build/Ond.xcarchive"
depends = ["ios:gen"]
dir = "{{config_root}}/ios"
# One archive holds both apps: the Ond target embeds OndWatch, and a companion
# watch app is not a submission of its own. The development certificate is
# correct here — distribution signing is applied when ios:testflight exports
# the archive — so this works on a machine with no distribution certificate.
run = '''
  set -eu
  if [ -z "${OND_DEV_TEAM:-}" ]; then
    echo 'ios:archive: OND_DEV_TEAM is unset, so nothing signs.' >&2
    echo 'It is the ten-character Apple Developer team id, and it belongs in' >&2
    echo '.env beside the other machine-local values. Read it off a profile' >&2
    echo 'Xcode has already installed rather than hunting for it in a browser:' >&2
    echo '  security cms -D -i ~/Library/Developer/Xcode/UserData/Provisioning\\ Profiles/*.mobileprovision \\' >&2
    echo '    | plutil -extract Entitlements.application-identifier raw -o - -' >&2
    echo 'The team id is the part before the first dot. See docs/contributing.md.' >&2
    exit 1
  fi

  # ios:gen has just baked this Mac's Bonjour address into both plists, and a
  # release build reads no such thing. Left in, the key would ship inside the
  # IPA and name the machine it was built on. The next ios:gen puts it back.
  plutil -remove OndAPIBaseURL Ond/Info.plist
  plutil -remove OndAPIBaseURL OndWatch/Info.plist

  # The build number is the commit count: App Store Connect refuses a number
  # it has already accepted, so a constant fails on the second upload and a
  # hand-bumped one whenever somebody forgets. Two archives of the same commit
  # collide — the right answer to that is a commit.
  xcodebuild archive \
    -project Ond.xcodeproj \
    -scheme Ond \
    -destination 'generic/platform=iOS' \
    -archivePath build/Ond.xcarchive \
    -allowProvisioningUpdates \
    CURRENT_PROJECT_VERSION="$(git rev-list --count HEAD)"
'''

[tasks."ios:testflight"]
description = "Archive, then upload the build to TestFlight"
depends = ["ios:archive"]
dir = "{{config_root}}/ios"
# Export and upload are one invocation because ExportOptions.plist asks for
# `destination: upload`. Authentication is an App Store Connect API key — it
# survives the two-factor prompts a headless run cannot answer. The private
# key's path derives from the key id at the location Apple's own tooling
# searches, so there is no absolute path to keep in step.
run = '''
  set -eu
  if [ -z "${OND_ASC_KEY_ID:-}" ] || [ -z "${OND_ASC_ISSUER_ID:-}" ]; then
    echo 'ios:testflight: OND_ASC_KEY_ID and OND_ASC_ISSUER_ID must both be set.' >&2
    echo 'Create a key under App Store Connect > Users and Access > Integrations >' >&2
    echo 'App Store Connect API, role Admin — App Manager can upload but cannot' >&2
    echo 'mint the distribution certificate the first export needs. The page shows' >&2
    echo 'both values; the .p8 downloads once and cannot be downloaded again.' >&2
    echo 'Both identifiers belong in .env, beside OND_DEV_TEAM.' >&2
    exit 1
  fi

  key="$HOME/.appstoreconnect/private_keys/AuthKey_$OND_ASC_KEY_ID.p8"
  if [ ! -f "$key" ]; then
    echo "ios:testflight: no private key at $key" >&2
    echo 'Move the downloaded AuthKey_*.p8 there, keeping its filename.' >&2
    exit 1
  fi

  xcodebuild -exportArchive \
    -archivePath build/Ond.xcarchive \
    -exportPath build/export \
    -exportOptionsPlist ExportOptions.plist \
    -allowProvisioningUpdates \
    -authenticationKeyPath "$key" \
    -authenticationKeyID "$OND_ASC_KEY_ID" \
    -authenticationKeyIssuerID "$OND_ASC_ISSUER_ID"
'''
