<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    The app icon's mark, at the app icon's own geometry. No ground: the app
    icon fills its canvas because iOS gives it a fixed tile, while a favicon
    sits on a tab strip whose colour belongs to the browser, and an opaque
    tile can only ever match one of them. The mark alone lets the strip show
    through. Geometry matches ios/Ond/AppIcon.icon; light tabs use a darker stroke.
  -->
  <!--
    Light is a presentation attribute and dark a CSS override, so a browser
    honouring the query gets dark and anything that does not understand the
    query, the style block, or CSS at all still gets a complete light icon.
    `toolkit icons` rasterises through a renderer with no query support and
    relies on that: favicon.ico is this drawing's light variant.
  -->
  <style>
    @media (prefers-color-scheme: dark) {
      .ring {
        stroke: #68BCD0;
      }
    }
  </style>

  <circle class="ring" cx="512" cy="512" r="350" fill="none" stroke="#2E7E96" stroke-width="96"
    stroke-linecap="round" stroke-dasharray="1736.6 462.5" transform="rotate(172.858 512 512)" />
</svg>
