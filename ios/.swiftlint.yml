included:
  - Ond
  - OndActivity
  - OndWatch
  - Packages/OndCore/Sources
  - Packages/OndCore/Tests

excluded:
  # Generated by protoc-gen-swift and protoc-gen-connect-swift. They already
  # carry `// swiftlint:disable all`, but excluding the directory means a new
  # generated file is covered before anyone notices it exists.
  - Packages/OndCore/Sources/OndAPI/Generated
  - Packages/OndCore/.build

# Opt-in rules that catch real defects rather than style preferences.
opt_in_rules:
  - force_unwrapping
  - implicitly_unwrapped_optional
  - empty_count
  - first_where
  - last_where
  - redundant_nil_coalescing
  - unneeded_parentheses_in_closure_argument
  - overridden_super_call
  - prohibited_super_call

disabled_rules:
  # SwiftFormat owns line width (--maxwidth 100); two tools disagreeing about
  # the same thing means one of them is always wrong.
  - line_length
  # Same rule, same reason: SwiftFormat's `trailingCommas` adds the comma that
  # this rule removes, so leaving both on makes every multi-line collection
  # literal unformattable — `fmt` and `check` would undo each other forever.
  - trailing_comma
  # Domain vocabulary is what it is: `id` is the field name in the proto, and
  # renaming it in Swift alone would break the correspondence deliberately.
  - identifier_name

force_unwrapping:
  severity: error

custom_rules:
  # The failure mode this catches is silent: `os.Logger` interpolates `String`
  # as `.private`, so a line missing the annotation reads `<private>` in a
  # sysdiagnose or a TestFlight bundle and nowhere else — which is to say, in
  # every place it was collected for and none of the places it is written.
  # Framework error text carries no user data; see docs/observability.md.
  redacted_error_cause:
    name: "Redacted error cause"
    regex: '\\\([^)]*localizedDescription\)'
    message: "os.Logger redacts String by default — add `, privacy: .public`"
    severity: error

  # A LiveActivityIntent only performs when the app's own App Intents metadata
  # carries it, and OndActivity/Intents is the one directory both the app and
  # the extension compile. Declared anywhere else, the intent builds green,
  # works in the simulator, and draws a button that does nothing on a device —
  # a failure nothing but this rule surfaces before a device test.
  live_activity_intent_placement:
    name: "LiveActivityIntent outside Intents/"
    excluded: ".*/OndActivity/Intents/.*"
    regex: '(struct|class|enum)\s+\w+\s*:[^{]*\bLiveActivityIntent\b'
    message: "LiveActivityIntent types belong in OndActivity/Intents/, the one directory compiled into both the app and the extension — see SessionControlIntents.swift"
    severity: error

  # `Text(timerInterval:)` and `Text(_, style: .timer)` are kept running by the
  # system with no push from the app, which is the whole of how a Live Activity
  # stays honest between updates. Combining accessibility children obliges
  # SwiftUI to resolve each child down to a concrete string to compose the
  # merged label, and a widget renders out of process into an archive — so the
  # timer becomes a dead string that redraws only on the next push. It renders
  # correctly in a preview and in the simulator, `ios/OndActivity/` has no test
  # bundle, and the frozen clock reaches a device looking exactly like a stalled
  # session. `.ignore` is unaffected: it composes no label and needs no
  # resolution, which is why SessionCueLabel may use it over a live count.
  combined_accessibility_over_timer:
    name: "Combined accessibility children over a live timer"
    included: ".*/OndActivity/.*"
    regex: 'accessibilityElement\(children:\s*\.combine\)'
    # Code only. The rule's own explanation, and SessionRemainingTime's, both
    # have to name the call they forbid.
    match_kinds:
      - identifier
    message: "children: .combine freezes a Live Activity timer — label the parts instead, or hide the decoration; see SessionRemainingTime.swift"
    severity: error

# `analyzer_rules` (unused_import and friends) are deliberately absent. They only
# run under `swiftlint analyze`, which needs a full compiler log to be built
# first — so listing them here would look like enforcement while `check:swift`
# quietly never ran them. Add them alongside an `analyze` task or not at all.
